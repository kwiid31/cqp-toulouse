<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><link rel="icon" href="/favicon.ico"><link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#C8102E"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Annonces — CQP Toulouse</title><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="/css/main.css"><script src="/js/app.js"></script><script src="/js/utils.js"></script><script src="/js/auth.js"></script><script src="/js/api.js"></script>
<style>
.an-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;padding:10px;}
.an-card{background:#fff;border-radius:var(--r);box-shadow:var(--shadow-card);overflow:hidden;cursor:pointer;}
.an-img{width:100%;height:120px;object-fit:cover;}
.an-body{padding:10px 12px;}
.an-title{font-weight:600;font-size:.88rem;margin-bottom:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.an-prix{font-family:'Bebas Neue',sans-serif;font-size:1.1rem;color:var(--rouge);}
.an-meta{font-size:.72rem;color:var(--txt3);margin-top:4px;}
.drawer-ov{display:none;position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.45);}
.drawer-ov.open{display:flex;justify-content:flex-end;}
.drawer{width:min(560px,100vw);height:100vh;background:#fff;overflow-y:auto;display:flex;flex-direction:column;animation:slideIn .28s cubic-bezier(.4,0,.2,1);}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:none}}
.drawer-head{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--border);padding:14px 16px;display:flex;align-items:flex-start;gap:10px;z-index:1;}
.drawer-body{padding:16px;flex:1;}
.modal-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;align-items:flex-end;justify-content:center;}
.modal-ov.open{display:flex;}
.modal-box{background:#fff;border-radius:20px 20px 0 0;padding:20px 16px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;padding-bottom:max(24px,env(safe-area-inset-bottom));}
</style>
</head><body>
<header class="topbar">
  <button class="back-btn" onclick="history.back()"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>
  <div class="topbar-logo"><span class="logo-pill">CQP</span><div class="logo-text"><span class="logo-name">Annonces</span></div></div>
  <button onclick="openModal()" style="padding:8px 14px;background:var(--green);border:none;border-radius:20px;color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:.72rem;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;">+ Déposer</button>
</header>
<div class="cats-bar">
  <button class="cat-btn active" onclick="filterCat(this,'')">Tout</button>
  <button class="cat-btn" onclick="filterCat(this,'Logement')">Logement</button>
  <button class="cat-btn" onclick="filterCat(this,'Emploi')">Emploi</button>
  <button class="cat-btn" onclick="filterCat(this,'Vente')">Vente</button>
  <button class="cat-btn" onclick="filterCat(this,'Service')">Service</button>
  <button class="cat-btn" onclick="filterCat(this,'Don')">Don</button>
</div>
<div id="an-list" style="max-width:720px;margin:0 auto;"><div class="spinner" style="padding:40px;"><div class="spinner-dot"></div><div class="spinner-dot"></div><div class="spinner-dot"></div></div></div>

<!-- DRAWER DÉTAIL -->
<div class="drawer-ov" id="dr" onclick="if(event.target===this)closeDr()">
  <div class="drawer">
    <div class="drawer-head">
      <div style="flex:1;"><h3 style="font-family:'Bebas Neue',sans-serif;font-size:1.3rem;margin:0 0 4px;" id="dr-titre"></h3><div id="dr-prix" style="font-family:'Bebas Neue',sans-serif;font-size:1.4rem;color:var(--rouge);"></div></div>
      <button onclick="closeDr()" style="width:30px;height:30px;border:1px solid var(--border);border-radius:6px;background:none;cursor:pointer;font-size:1rem;">✕</button>
    </div>
    <div class="drawer-body">
      <img id="dr-img" style="width:100%;border-radius:8px;margin-bottom:14px;display:none;" alt="">
      <div style="font-size:.9rem;color:var(--txt2);line-height:1.8;margin-bottom:16px;" id="dr-desc"></div>
      <div style="font-size:.8rem;color:var(--txt3);margin-bottom:16px;" id="dr-meta"></div>
      <div id="dr-contact"></div>
    </div>
  </div>
</div>

<!-- MODAL DÉPÔT -->
<div class="modal-ov" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-box">
    <div style="font-family:'Bebas Neue',sans-serif;font-size:1.3rem;margin-bottom:16px;">📋 Déposer une annonce</div>
    <div class="fg"><label>Titre *</label><input id="an-titre" placeholder="Ex: Cherche baby-sitter" maxlength="100" style="width:100%;padding:11px 14px;background:var(--bg3);border:1.5px solid var(--border);border-radius:8px;font-family:'Barlow',sans-serif;font-size:.9rem;outline:none;"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      <div class="fg"><label>Catégorie</label><select id="an-cat" style="width:100%;padding:11px 14px;background:var(--bg3);border:1.5px solid var(--border);border-radius:8px;font-family:'Barlow',sans-serif;font-size:.9rem;outline:none;"><option>Vente</option><option>Don</option><option>Service</option><option>Logement</option><option>Emploi</option><option>Autre</option></select></div>
      <div class="fg"><label>Prix (€)</label><input id="an-prix" type="number" placeholder="0 = gratuit" min="0" style="width:100%;padding:11px 14px;background:var(--bg3);border:1.5px solid var(--border);border-radius:8px;font-family:'Barlow',sans-serif;font-size:.9rem;outline:none;"></div>
    </div>
    <div class="fg"><label>Description *</label><textarea id="an-desc" rows="3" placeholder="Décrivez votre annonce…" maxlength="1000" style="width:100%;padding:11px 14px;background:var(--bg3);border:1.5px solid var(--border);border-radius:8px;font-family:'Barlow',sans-serif;font-size:.9rem;outline:none;resize:vertical;"></textarea></div>
    <div class="fg"><label>Téléphone</label><input id="an-tel" type="tel" placeholder="06 XX XX XX XX" style="width:100%;padding:11px 14px;background:var(--bg3);border:1.5px solid var(--border);border-radius:8px;font-family:'Barlow',sans-serif;font-size:.9rem;outline:none;"></div>
    <div class="fg"><label>Votre prénom *</label><input id="an-prenom" maxlength="30" style="width:100%;padding:11px 14px;background:var(--bg3);border:1.5px solid var(--border);border-radius:8px;font-family:'Barlow',sans-serif;font-size:.9rem;outline:none;"></div>
    <button class="btn-rouge" onclick="submitAnnonce()">📋 Déposer l'annonce</button>
    <div class="form-msg" id="an-msg"></div>
    <button onclick="closeModal()" style="width:100%;padding:12px;background:none;border:none;color:var(--txt3);font-family:'Barlow Condensed',sans-serif;font-size:.78rem;letter-spacing:1px;margin-top:4px;cursor:pointer;">Annuler</button>
  </div>
</div>

<nav class="bottom-nav">
  <a class="nav-item" href="index.html"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Accueil</a>
  <a class="nav-item" href="groupes.html"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Groupes</a>
  <div class="nav-center"><a href="index.html" class="nav-pub"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></a></div>
  <a class="nav-item" href="actus.html"><svg viewBox="0 0 24 24"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>Actus</a>
  <a class="nav-item" href="profil.html"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Profil</a>
</nav>
<script>
const esc=s=>Utils.esc(s),timeAgo=d=>Utils.timeAgo(d)
let _all=[]
function filterCat(btn,cat){document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');render(_all.filter(a=>!cat||a.categorie===cat))}
async function load(){
  const{data,error}=await Api.getAnnonces(null,40)
  if(error||!data?.length){document.getElementById('an-list').innerHTML='<div class="empty">Aucune annonce pour l\'instant.</div>';return}
  _all=data;render(data)
}
function render(annonces){
  const el=document.getElementById('an-list')
  if(!annonces.length){el.innerHTML='<div class="empty">Aucune annonce dans cette catégorie.</div>';return}
  el.innerHTML=`<div class="an-grid">${annonces.map(a=>`
    <div class="an-card" onclick="openAn(${a.id})">
      ${a.photo_url?`<img class="an-img" src="${esc(a.photo_url)}" loading="lazy" alt="">`:`<div style="height:120px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#020510,#081a5e,#7C3AED);font-size:2rem;">📋</div>`}
      <div class="an-body">
        <div class="an-title">${esc(a.titre)}</div>
        ${a.prix!=null?`<div class="an-prix">${a.prix==0?'Gratuit':a.prix+' €'}</div>`:''}
        <div class="an-meta">${esc(a.prenom||'')} · ${timeAgo(a.created_at)}</div>
        <span class="tag">${esc(a.categorie||'')}</span>
      </div>
    </div>`).join('')}</div>`
}
function openAn(id){
  const a=_all.find(x=>x.id===id);if(!a)return
  document.getElementById('dr-titre').textContent=a.titre
  document.getElementById('dr-prix').textContent=a.prix!=null?(a.prix==0?'Gratuit':a.prix+' €'):''
  document.getElementById('dr-desc').textContent=a.contenu||''
  document.getElementById('dr-meta').textContent=`${a.prenom||''} · ${a.categorie||''} · ${timeAgo(a.created_at)}`
  const img=document.getElementById('dr-img');if(a.photo_url){img.src=a.photo_url;img.style.display='block'}else img.style.display='none'
  const contact=document.getElementById('dr-contact')
  contact.innerHTML=''
  if(a.telephone)contact.innerHTML+=`<a href="tel:${esc(a.telephone)}" style="display:flex;align-items:center;gap:8px;padding:12px 16px;background:var(--green);color:#fff;border-radius:10px;font-family:'Barlow Condensed',sans-serif;font-size:.82rem;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px;">📞 Appeler — ${esc(a.telephone)}</a>`
  if(a.email)contact.innerHTML+=`<a href="mailto:${esc(a.email)}" style="display:flex;align-items:center;gap:8px;padding:12px 16px;background:var(--blue);color:#fff;border-radius:10px;font-family:'Barlow Condensed',sans-serif;font-size:.82rem;letter-spacing:1.5px;text-transform:uppercase;">✉️ Envoyer un email</a>`
  document.getElementById('dr').classList.add('open');document.body.style.overflow='hidden'
}
function closeDr(){document.getElementById('dr').classList.remove('open');document.body.style.overflow=''}
function openModal(){
  const p=Auth.getPrenom();if(p){const el=document.getElementById('an-prenom');el.value=p;el.readOnly=true}
  document.getElementById('modal').classList.add('open');document.body.style.overflow='hidden'
}
function closeModal(){document.getElementById('modal').classList.remove('open');document.body.style.overflow=''}
async function submitAnnonce(){
  const titre=document.getElementById('an-titre').value.trim()
  const cat=document.getElementById('an-cat').value
  const desc=document.getElementById('an-desc').value.trim()
  const prix=document.getElementById('an-prix').value
  const tel=document.getElementById('an-tel').value.trim()
  const prenom=document.getElementById('an-prenom').value.trim()||Auth.getPrenom()
  const msg=document.getElementById('an-msg')
  if(!titre||!desc||!prenom){msg.style.color='var(--rouge)';msg.textContent='Titre, description et prénom obligatoires.';return}
  msg.style.color='var(--txt3)';msg.textContent='Envoi…'
  const{error}=await Api.createAnnonce({titre,contenu:desc,categorie:cat,prix:prix?parseFloat(prix):null,telephone:tel||null,profil_code:Auth.getCode()||null,prenom})
  if(error){msg.style.color='var(--rouge)';msg.textContent='Erreur: '+error.message;return}
  msg.style.color='var(--green)';msg.textContent='✅ Annonce soumise — validation sous 24h.'
  setTimeout(closeModal,2000)
}
load();Api.trackView('annonces')
if(window.location.search.includes('new=1'))openModal()
</script>
</body></html>
