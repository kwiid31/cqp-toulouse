    </div>
    <div class="fg"><label>Titre *</label><input id="an-titre" placeholder="Ex: Cherche baby-sitter" maxlength="100" style="width:100%;padding:11px 14px;background:var(--bg3);border:1.5px solid var(--border);border-radius:8px;font-family:'Barlow',sans-serif;font-size:.9rem;outline:none;"></div>

      <div class="fg"><label>Téléphone</label><input id="an-tel" type="tel" placeholder="06 XX XX XX XX" style="width:100%;padding:11px 14px;background:var(--bg3);border:1.5px solid var(--border);border-radius:8px;font-family:'Barlow',sans-serif;font-size:.9rem;outline:none;"></div>

<script>
const esc=s=>Utils.esc(s),timeAgo=d=>Utils.timeAgo(d)
let _all=[]
function filterCat(btn,cat){document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');render(_all.filter(a=>!cat||a.categorie===cat))}
async function load(){
  const{data,error}=await Api.getAnnonces(null,40)
  if(error||!data?.length){document.getElementById('an-list').innerHTML='<div class="empty">Aucune annonce pour l\'instant.</div>';return}
  _all=data;render(data)
}
function render(annonces){
  const el=document.getElementById('an-list')
  if(!annonces.length){el.innerHTML='<div class="empty" style="text-align:center;padding:48px 20px"><div style="font-size:2rem;margin-bottom:8px">📋</div><div style="font-weight:700;">Aucune annonce dans cette catégorie</div></div>';return}
  const catColors={'Logement':'#1565c0','Emploi':'#6a1b9a','Vente':'#e65100','Service':'#2e7d32','Don':'#00695c'}
  el.innerHTML=annonces.map(a=>{
    const color=catColors[a.categorie]||'#555'
    const img=a.photo_url
      ? '<img src="'+esc(a.photo_url)+'" loading="lazy" alt="" style="width:90px;height:90px;object-fit:cover;border-radius:8px;flex-shrink:0;">'
      : '<div style="width:90px;height:90px;border-radius:8px;flex-shrink:0;background:linear-gradient(135deg,#020510,#081a5e,#7C3AED);display:flex;align-items:center;justify-content:center;font-size:1.8rem;">📋</div>'
    return '<div id="an-'+a.id+'" onclick="openAn('+a.id+')" style="display:flex;gap:12px;padding:14px;background:#fff;border-bottom:1px solid var(--border);cursor:pointer;align-items:flex-start;">'
      + img
      + '<div style="flex:1;min-width:0;">'
      + '<div style="font-size:.65rem;font-weight:700;letter-spacing:.5px;color:'+color+';margin-bottom:4px;text-transform:uppercase;">'+esc(a.categorie||'Annonce')+'</div>'
      + '<div style="font-weight:700;font-size:.92rem;line-height:1.3;margin-bottom:4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;">'+esc(a.titre)+'</div>'
      + '<div style="font-size:.8rem;color:var(--txt2);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;margin-bottom:6px;">'+esc((a.description||a.contenu||'').substring(0,120))+'</div>'
      + '<div style="display:flex;align-items:center;gap:8px;">'
      + (a.quartier ? '<span style="font-size:.7rem;background:var(--bg3);padding:2px 8px;border-radius:10px;color:var(--txt2);">📍 '+esc(a.quartier)+'</span>' : '')
      + '<span style="font-size:.7rem;color:var(--txt3);">'+esc(a.prenom||'')+'</span>'
      + '<span style="font-size:.7rem;color:var(--txt3);">· '+timeAgo(a.created_at)+'</span>'
      + '</div>'
      + '</div>'
      + '</div>'
  }).join('')
}
function openAn(id){
  const a=_all.find(x=>x.id===id);if(!a)return
  document.getElementById('dr-titre').textContent=a.titre
  document.getElementById('dr-prix').textContent=a.prix!=null?(a.prix==0?'Gratuit':a.prix+' €'):''
  document.getElementById('dr-desc').textContent=a.description||a.contenu||''
  document.getElementById('dr-meta').textContent=`${a.prenom||''} · ${a.quartier||''} · ${a.categorie||''} · ${timeAgo(a.created_at)}`
  const img=document.getElementById('dr-img');if(a.photo_url){img.src=a.photo_url;img.style.display='block'}else img.style.display='none'
  const contact=document.getElementById('dr-contact')
  contact.innerHTML=''
  if(a.telephone)contact.innerHTML+=`<a href="tel:${esc(a.telephone)}" style="display:flex;align-items:center;gap:8px;padding:12px 16px;background:var(--green);color:#fff;border-radius:10px;font-family:'Barlow Condensed',sans-serif;font-size:.82rem;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px;">📞 Appeler — ${esc(a.telephone)}</a>`
  if(a.email)contact.innerHTML+=`<a href="mailto:${esc(a.email)}" style="display:flex;align-items:center;gap:8px;padding:12px 16px;background:var(--blue);color:#fff;border-radius:10px;font-family:'Barlow Condensed',sans-serif;font-size:.82rem;letter-spacing:1.5px;text-transform:uppercase;">✉️ Envoyer un email</a>`
  document.getElementById('dr').classList.add('open');document.body.style.overflow='hidden'
}
function closeDr(){document.getElementById('dr').classList.remove('open');document.body.style.overflow=''}
function openModal(){
  const p=Auth.getPrenom();if(p){const el=document.getElementById('an-prenom');el.value=p;el.readOnly=true}
  document.getElementById('modal').classList.add('open');document.body.style.overflow='hidden'
}
function closeModal(){document.getElementById('modal').classList.remove('open');document.body.style.overflow=''}
async function submitAnnonce(){
  const prenom=document.getElementById('an-prenom').value.trim()||Auth.getPrenom()
  const quartier=document.getElementById('an-quartier').value.trim()
  const titre=document.getElementById('an-titre').value.trim()
  const cat=document.getElementById('an-cat').value
  const tel=document.getElementById('an-tel').value.trim()
  const desc=document.getElementById('an-desc').value.trim()
  const msg=document.getElementById('an-msg')
  if(!prenom||!titre||!desc||desc.length<3){msg.style.color='var(--rouge)';msg.textContent='Prénom, titre et description (min 3 caractères) obligatoires.';return}
  msg.style.color='var(--txt3)';msg.textContent='Envoi…'
  // ⚠️ nom/email/quartier/categorie/description sont NOT NULL en DB
  const{error}=await Api.createAnnonce({
    prenom, nom:'', email:'', quartier:quartier||'Non précisé',
    categorie:cat, titre, description:desc, contenu:desc, telephone:tel||null
  })
  if(error){msg.style.color='var(--rouge)';msg.textContent='Erreur: '+error.message;return}
  msg.style.color='var(--green)';msg.textContent='✅ Annonce soumise — validation sous 24h.'
  setTimeout(closeModal,2000)
}
load();Api.trackView('annonces')
// Deep link : annonces.html#an-42 ouvre directement l'annonce
window.addEventListener('hashchange', handleHash)
function handleHash(){
  const h=location.hash.replace('#an-','')
  if(h && !isNaN(h)) setTimeout(()=>openAn(parseInt(h)),300)
}
handleHash()
if(window.location.search.includes('new=1'))openModal()
</script>
<div class="pub-overlay" id="pub-overlay" onclick="closePub()"></div>
<div class="pub-menu" id="pub-menu">
  <div class="pub-menu-title">Que voulez-vous partager ?</div>
  <div class="pub-options">
    <button class="pub-opt" onclick="openPostForm('post')">
      <div class="pub-opt-icon" style="background:#fff0f2;">💬</div>
      <div><div class="pub-opt-label">Post</div><div class="pub-opt-sub">Texte ou photo</div></div>
<script>
function openPub() {
  if (!Auth.getCode()) { window.location.href = 'profil.html'; return }
  openPostForm('post')
}
function openPubWithMedia(inp) {
  if (!Auth.getCode()) { window.location.href = 'profil.html'; return }
  openPostForm('post')
  setTimeout(() => {
    if (!inp.files.length) return
    if (inp.files.length === 1) {
      // Un seul fichier — preview normale
      _pfMultiFiles = []
      document.getElementById('pf-preview-wrap').style.display = 'none'
      const pf = document.getElementById('pf-photo')
      if (pf) { const dt = new DataTransfer(); dt.items.add(inp.files[0]); pf.files = dt.files; previewPhoto(pf) }
    } else {
      // Plusieurs fichiers — carousel
      _pfMultiFiles = Array.from(inp.files)
      document.getElementById('pf-preview').style.display = 'none'
      document.getElementById('pf-video-preview').style.display = 'none'
      _renderMultiPreview()
      pfCheckPublish()
    }
  }, 300)
}
function closePub() {
  document.getElementById('pub-overlay').classList.remove('open')
  document.getElementById('pub-menu').classList.remove('open')
  document.body.style.overflow = ''
}
</script>
