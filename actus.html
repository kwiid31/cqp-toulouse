.card-read-more{margin:4px 14px 12px;padding:10px;background:var(--bg3);border:none;border-radius:7px;width:calc(100% - 28px);font-family:'Barlow Condensed',sans-serif;font-size:.76rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--txt2);cursor:pointer;display:block;}

  <button class="cat-btn" data-cat="Politique" onclick="filterCat(this,'Politique')">Politique</button>

<script>
const esc=s=>Utils.esc(s),timeAgo=d=>Utils.timeAgo(d)
let _all=[]
function filterCat(btn,cat){document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');render(_all.filter(a=>!cat||a.categorie===cat))}
async function load(){
  const el=document.getElementById('actu-list')
  el.innerHTML='<div class="spinner"><div class="spinner-dot"></div><div class="spinner-dot"></div><div class="spinner-dot"></div></div>'
  const{data,error}=await Api.getActus(null,50)
  if(error||!data?.length){el.innerHTML='<div class="empty" style="text-align:center;padding:48px 20px"><div style="font-size:2.5rem;margin-bottom:12px">📰</div><div style="font-weight:700;font-size:1rem;margin-bottom:8px">Pas encore d'actus</div><div style="color:var(--txt3);font-size:.85rem;line-height:1.6">Les actus de vos quartiers apparaîtront ici.<br>Vous avez une info locale à partager ?<br>Contactez l'admin !</div></div>';return}
  _all=data;render(data)
}
function render(actus){
  const el=document.getElementById('actu-list')
  if(!actus.length){el.innerHTML='<div class="empty">Aucune actu dans cette catégorie.</div>';return}
  el.innerHTML=actus.map(a=>`<div class="actu-card">
    ${a.photo_url?`<img class="actu-img" src="${esc(a.photo_url)}" loading="lazy" alt="">`:`<div class="card-cover cv-rouge"><div class="card-cover-cat">${esc(a.categorie||'Actualité')}</div><div class="card-cover-title">${esc(a.titre)}</div></div>`}
    <div class="actu-head">
      <div class="c-av c-av-36 c-av-init" style="background:var(--rouge);">CQP</div>
      <div style="flex:1"><div style="font-weight:600;font-size:.88rem;">CQP Toulouse</div><div style="font-size:.72rem;color:var(--txt3);">🌐 ${timeAgo(a.date_publication)}</div></div>
      <span class="badge badge-rouge">${esc(a.categorie||'Actu')}</span>
    </div>
    <div class="actu-title">${esc(a.titre)}</div>
    <div class="actu-excerpt">${esc((a.contenu||'').substring(0,200))}${(a.contenu||'').length>200?'…':''}</div>
    <button class="card-read-more" onclick="openActu(${a.id})">Lire l'article →</button>
  </div>`).join('')
}
function openActu(id){
  const a=_all.find(x=>x.id===id);if(!a)return
  document.getElementById('dr-cat').textContent=a.categorie||'Actualité'
  document.getElementById('dr-titre').textContent=a.titre
  document.getElementById('dr-date').textContent=new Date(a.date_publication).toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'})
  document.getElementById('dr-body').textContent=a.contenu||''
  const img=document.getElementById('dr-img');if(a.photo_url){img.src=a.photo_url;img.style.display='block'}else img.style.display='none'
  document.getElementById('dr').classList.add('open');document.body.style.overflow='hidden'
}
function closeDr(){document.getElementById('dr').classList.remove('open');document.body.style.overflow=''}
load();Api.trackView('actus')
</script>
