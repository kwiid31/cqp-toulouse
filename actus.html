<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#C8102E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Actualités — CQP Toulouse</title>
<meta name="description" content="Toutes les actualités des quartiers populaires de Toulouse : infos locales, politique, culture, sport et social.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://cqp-toulouse.fr/actus.html">
<meta property="og:type" content="website">
<meta property="og:url" content="https://cqp-toulouse.fr/actus.html">
<meta property="og:title" content="Actualités — CQP Toulouse">
<meta property="og:description" content="Toutes les actualités des quartiers populaires de Toulouse : infos locales, politique, culture, sport et social.">
<meta property="og:image" content="https://cqp-toulouse.fr/icons/icon-512.png">
<meta property="og:locale" content="fr_FR">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--rouge:#C8102E;--blue:#1877F2;--green:#42B72A;--purple:#7C3AED;
  --txt:#050505;--txt2:#65676B;--txt3:#8A8D91;
  --bg:#F0F2F5;--bg3:#E4E6EB;--border:#CED0D4;
  --shadow:0 1px 2px rgba(0,0,0,.1);--r:8px;--nav:56px;}
html,body{font-size:15px;background:var(--bg);color:var(--txt);font-family:'Barlow',sans-serif;min-height:100vh;}
body{padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 4px);}
a{text-decoration:none;color:inherit}button,label{cursor:pointer;font-family:inherit;outline:none;border:none;}

.topbar{position:sticky;top:0;z-index:100;height:var(--nav);background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:0 14px;box-shadow:var(--shadow);}
.back-btn{width:36px;height:36px;background:var(--bg3);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.back-btn svg{width:20px;height:20px;stroke:var(--txt);fill:none;stroke-width:2;stroke-linecap:round;}
.topbar-title{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:.5px;flex:1;}

/* CATS FILTER */
.cats-bar{background:#fff;border-bottom:1px solid var(--border);display:flex;gap:6px;padding:10px 12px;overflow-x:auto;scrollbar-width:none;position:sticky;top:var(--nav);z-index:90;}
.cats-bar::-webkit-scrollbar{display:none;}
.cat-btn{flex-shrink:0;padding:6px 14px;border-radius:20px;border:1.5px solid var(--border);background:none;font-family:'Barlow Condensed',sans-serif;font-size:.72rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--txt2);transition:all .15s;}
.cat-btn.active{background:var(--rouge);border-color:var(--rouge);color:#fff;}

/* ACTU CARD */
.actu-list{max-width:680px;margin:0 auto;padding:10px 0 16px;}
.actu-card{background:#fff;margin:0 0 10px;overflow:hidden;}
@media(min-width:600px){.actu-card{border-radius:var(--r);margin:0 10px 10px;box-shadow:var(--shadow);}}
.actu-img{width:100%;height:200px;object-fit:cover;display:block;}
.actu-cover{height:160px;display:flex;flex-direction:column;justify-content:flex-end;padding:18px;position:relative;overflow:hidden;}
.actu-cover::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,#1a0508 0%,#4a0b16 60%,var(--rouge) 100%);opacity:.97;}
.actu-cover-cat{font-family:'Barlow Condensed',sans-serif;font-size:.6rem;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.6);position:relative;z-index:1;margin-bottom:4px;}
.actu-cover-title{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;color:#fff;line-height:1.1;position:relative;z-index:1;}
.actu-head{display:flex;align-items:center;gap:10px;padding:12px 14px 6px;}
.actu-av{width:38px;height:38px;min-width:38px;border-radius:50%;background:var(--rouge);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:.9rem;color:#fff;}
.actu-meta{flex:1;}
.actu-author{font-family:'Barlow',sans-serif;font-weight:600;font-size:.88rem;}
.actu-ts{font-size:.72rem;color:var(--txt3);}
.actu-badge{font-family:'Barlow Condensed',sans-serif;font-size:.6rem;letter-spacing:1.5px;text-transform:uppercase;padding:3px 9px;border-radius:4px;color:#fff;background:var(--rouge);}
.actu-body{padding:10px 14px 8px;}
.actu-title{font-family:'Barlow',sans-serif;font-weight:600;font-size:.96rem;line-height:1.35;margin-bottom:4px;}
.actu-text{font-size:.87rem;color:var(--txt2);line-height:1.65;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.actu-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.tag{font-family:'Barlow Condensed',sans-serif;font-size:.65rem;letter-spacing:1px;text-transform:uppercase;background:var(--bg3);color:var(--txt2);padding:3px 9px;border-radius:20px;}
.actu-read-more{margin:4px 14px 12px;padding:10px;background:var(--bg3);border:none;border-radius:6px;width:calc(100% - 28px);font-family:'Barlow Condensed',sans-serif;font-size:.76rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--txt2);}

/* DRAWER */
.drawer-overlay{display:none;position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.45);}
.drawer-overlay.open{display:flex;justify-content:flex-end;}
.drawer{width:min(560px,100vw);height:100vh;background:#fff;overflow-y:auto;display:flex;flex-direction:column;animation:slideIn .28s cubic-bezier(.4,0,.2,1);}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:none}}
.drawer-head{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--border);padding:14px 16px;display:flex;align-items:flex-start;gap:10px;z-index:1;}
.drawer-head h3{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;flex:1;line-height:1.2;}
.drawer-x{width:30px;height:30px;border:1px solid var(--border);border-radius:6px;background:none;display:flex;align-items:center;justify-content:center;color:var(--txt2);}
.drawer-body{padding:16px;flex:1;}
.drawer-text{font-size:.9rem;color:var(--txt2);line-height:1.9;white-space:pre-wrap;}
.drawer-img{width:100%;border-radius:8px;margin-bottom:14px;max-height:300px;object-fit:cover;}

/* SPINNER/EMPTY */
.spinner{display:flex;align-items:center;justify-content:center;gap:8px;padding:40px;}
.spinner-dot{width:8px;height:8px;border-radius:50%;background:var(--rouge);animation:bounce .9s infinite;}
.spinner-dot:nth-child(2){animation-delay:.15s;}.spinner-dot:nth-child(3){animation-delay:.3s;}
@keyframes bounce{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.7)}}
.empty{text-align:center;padding:48px 20px;color:var(--txt3);font-family:'Barlow Condensed',sans-serif;font-size:.85rem;letter-spacing:1px;}

/* NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:200;background:#fff;border-top:1px solid var(--border);display:flex;align-items:stretch;height:var(--nav);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -1px 8px rgba(0,0,0,.06);}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:none;border:none;color:var(--txt3);font-family:'Barlow Condensed',sans-serif;font-size:.5rem;letter-spacing:.5px;text-transform:uppercase;text-decoration:none;padding:6px 0;}
.nav-item.active,.nav-item:hover{color:var(--rouge);}
.nav-item svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.nav-center{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:4px;}
.nav-pub{width:50px;height:50px;border-radius:50%;background:var(--rouge);border:none;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 14px rgba(200,16,46,.4);margin-top:-14px;}
.nav-pub svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;}
@media(min-width:700px){.bottom-nav{display:none;}body{padding-bottom:0;}}
</style>
</head>
<body>

<header class="topbar">
  <button class="back-btn" onclick="history.length>1?history.back():location.href='index.html'">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
  </button>
  <span class="topbar-title">🌐 Actualités</span>
  <div style="width:36px;"></div>
</header>

<div class="cats-bar" id="cats-bar">
  <button class="cat-btn active" data-cat="" onclick="filterCat(this,'')">Tout</button>
  <button class="cat-btn" data-cat="Quartier" onclick="filterCat(this,'Quartier')">Quartier</button>
  <button class="cat-btn" data-cat="Politique" onclick="filterCat(this,'Politique')">Politique</button>
  <button class="cat-btn" data-cat="Culture" onclick="filterCat(this,'Culture')">Culture</button>
  <button class="cat-btn" data-cat="Social" onclick="filterCat(this,'Social')">Social</button>
  <button class="cat-btn" data-cat="Sport" onclick="filterCat(this,'Sport')">Sport</button>
  <button class="cat-btn" data-cat="Général" onclick="filterCat(this,'Général')">Général</button>
</div>

<div class="actu-list" id="actu-list">
  <div class="spinner"><div class="spinner-dot"></div><div class="spinner-dot"></div><div class="spinner-dot"></div></div>
</div>

<!-- DRAWER ARTICLE -->
<div class="drawer-overlay" id="dr-article" onclick="if(event.target===this)closeDr()">
  <div class="drawer">
    <div class="drawer-head">
      <div style="flex:1">
        <div style="font-family:'Barlow Condensed',sans-serif;font-size:.65rem;letter-spacing:2px;text-transform:uppercase;color:var(--txt3);margin-bottom:4px" id="dr-cat"></div>
        <h3 id="dr-titre"></h3>
        <div style="font-size:.74rem;color:var(--txt3);margin-top:4px" id="dr-date"></div>
      </div>
      <button class="drawer-x" onclick="closeDr()">✕</button>
    </div>
    <div class="drawer-body">
      <img id="dr-img" class="drawer-img" style="display:none;">
      <div class="drawer-text" id="dr-body"></div>
    </div>
  </div>
</div>

<nav class="bottom-nav">
  <a class="nav-item" href="index.html"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Accueil</a>
  <a class="nav-item" href="groupes.html"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Groupes</a>
  <div class="nav-center"><a href="index.html" class="nav-pub"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></a></div>
  <a class="nav-item active" href="actus.html"><svg viewBox="0 0 24 24"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>Actus</a>
  <a class="nav-item" href="profil.html"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Profil</a>
</nav>

<script>
const SBU='https://vzfwtyczqfbhbjzotjft.supabase.co';
const SBK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ6Znd0eWN6cWZiaGJqem90amZ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3NDY0OTIsImV4cCI6MjA5MTMyMjQ5Mn0.heto5Qc6WdIjlurllzXhi1PmnRY7_x65Bdof-vKqyGk';
const sb=supabase.createClient(SBU,SBK);
const esc=s=>{const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;};
const timeAgo=d=>{if(!d)return'';const s=(Date.now()-new Date(d))/1000;if(s<60)return"À l'instant";if(s<3600)return`Il y a ${Math.floor(s/60)} min`;if(s<86400)return`Il y a ${Math.floor(s/3600)} h`;if(s<604800)return`Il y a ${Math.floor(s/86400)} j`;return new Date(d).toLocaleDateString('fr-FR',{day:'2-digit',month:'short'});};

let allActus=[];let currentCat='';

function filterCat(btn,cat){
  document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  currentCat=cat;
  renderActus(allActus.filter(a=>!cat||a.categorie===cat));
}

async function loadActus(){
  const el=document.getElementById('actu-list');
  try{
    const{data,error}=await sb.from('actus').select('*').eq('visible',true).order('date_publication',{ascending:false}).limit(50);
    if(error||!data?.length){el.innerHTML='<div class="empty">Aucune actualité pour l\'instant.</div>';return;}
    allActus=data;
    renderActus(data);
  }catch(e){el.innerHTML='<div class="empty">⚠️ Connexion impossible.</div>';console.error(e);}
}

function renderActus(actus){
  const el=document.getElementById('actu-list');
  if(!actus.length){el.innerHTML='<div class="empty">Aucune actu dans cette catégorie.</div>';return;}
  el.innerHTML=actus.map(a=>`
    <div class="actu-card">
      ${a.photo_url
        ?`<img class="actu-img" src="${esc(a.photo_url)}" loading="lazy">`
        :`<div class="actu-cover"><div class="actu-cover-cat">${esc(a.categorie||'Actualité')}</div><div class="actu-cover-title">${esc(a.titre)}</div></div>`}
      <div class="actu-head">
        <div class="actu-av">CQP</div>
        <div class="actu-meta"><div class="actu-author">CQP Toulouse</div><div class="actu-ts">🌐 ${timeAgo(a.date_publication)}</div></div>
        <span class="actu-badge">${esc(a.categorie||'Actu')}</span>
      </div>
      <div class="actu-body">
        <div class="actu-title">${esc(a.titre)}</div>
        <div class="actu-text">${esc((a.contenu||'').substring(0,220))}${(a.contenu||'').length>220?'…':''}</div>
        <div class="actu-tags"><span class="tag">${esc(a.categorie||'Général')}</span></div>
      </div>
      <button class="actu-read-more" onclick="openActu(${a.id})">Lire l'article →</button>
    </div>`).join('');
}

function openActu(id){
  const a=allActus.find(x=>x.id===id);if(!a)return;
  document.getElementById('dr-cat').textContent=a.categorie||'Actualité';
  document.getElementById('dr-titre').textContent=a.titre;
  document.getElementById('dr-date').textContent=new Date(a.date_publication).toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'});
  document.getElementById('dr-body').textContent=a.contenu||'';
  const img=document.getElementById('dr-img');
  if(a.photo_url){img.src=a.photo_url;img.style.display='block';}else img.style.display='none';
  document.getElementById('dr-article').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeDr(){document.getElementById('dr-article').classList.remove('open');document.body.style.overflow='';}
loadActus();
</script>
</body>
</html>
