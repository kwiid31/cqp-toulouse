<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#C8102E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Explorer — CQP Toulouse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="/css/main.css?v=20260514">
<script src="/js/app.js?v=1781184375"></script>
<script src="/js/utils.js?v=20260514"></script>
<script src="/js/auth.js?v=20260514"></script>
<script src="/js/api.js?v=20260514"></script>
<style>
* { box-sizing: border-box; }
body { background: #f0f2f5; }
.exp-topbar {
  position: sticky; top: 0; z-index: 100;
  background: #fff;
  border-bottom: 0.5px solid #e4e6eb;
  padding: 12px 16px;
}
.exp-search {
  width: 100%;
  padding: 10px 16px 10px 40px;
  background: #f0f2f5;
  border: none;
  border-radius: 24px;
  font-size: .9rem;
  color: #1c1e21;
  outline: none;
  font-family: inherit;
}
.exp-search-wrap { position: relative; }
.exp-search-icon {
  position: absolute; left: 12px; top: 50%;
  transform: translateY(-50%); pointer-events: none;
}
.exp-tabs {
  display: flex;
  background: #fff;
  border-bottom: 0.5px solid #e4e6eb;
  position: sticky;
  top: 53px;
  z-index: 99;
  overflow-x: auto;
  scrollbar-width: none;
}
.exp-tabs::-webkit-scrollbar { display: none; }
.exp-tab {
  flex-shrink: 0;
  padding: 12px 14px;
  border: none;
  background: none;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: .78rem;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: #65676b;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: color .15s;
}
.exp-tab.active { color: #C8102E; border-bottom-color: #C8102E; }
.exp-section { display: none; }
.exp-section.active { display: block; }

.evt-row {
  background: #fff; display: flex; align-items: center;
  gap: 12px; padding: 12px 16px;
  border-bottom: 0.5px solid #f0f2f5;
  cursor: pointer; transition: background .1s;
}
.evt-row:active { background: #f9f9f9; }
.evt-date-box {
  width: 44px; height: 44px; border-radius: 10px;
  background: #e8f0fe; display: flex; flex-direction: column;
  align-items: center; justify-content: center; flex-shrink: 0;
}
.evt-date-day { font-size: 1.1rem; font-weight: 700; color: #1877F2; line-height: 1; }
.evt-date-mon { font-size: .55rem; letter-spacing: 1px; text-transform: uppercase; color: #1877F2; }
.evt-info { flex: 1; min-width: 0; }
.evt-title { font-size: .9rem; font-weight: 600; color: #1c1e21; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.evt-meta { font-size: .75rem; color: #65676b; margin-top: 2px; }

.ann-row {
  background: #fff; display: flex; align-items: center;
  gap: 12px; padding: 12px 16px;
  border-bottom: 0.5px solid #f0f2f5;
  cursor: pointer; transition: background .1s;
}
.ann-row:active { background: #f9f9f9; }
.ann-cat-box {
  width: 44px; height: 44px; border-radius: 10px;
  background: #fff3e0; display: flex; align-items: center;
  justify-content: center; flex-shrink: 0; font-size: 1.3rem;
}
.ann-info { flex: 1; min-width: 0; }
.ann-title { font-size: .9rem; font-weight: 600; color: #1c1e21; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ann-meta { font-size: .75rem; color: #65676b; margin-top: 2px; }

.actu-row {
  background: #fff; display: flex; align-items: center;
  gap: 12px; padding: 12px 16px;
  border-bottom: 0.5px solid #f0f2f5;
  cursor: pointer; transition: background .1s;
}
.actu-row:active { background: #f9f9f9; }
.actu-cat-box {
  width: 44px; height: 44px; border-radius: 10px;
  background: #fff8e1; display: flex; align-items: center;
  justify-content: center; flex-shrink: 0; font-size: 1.3rem;
}
.actu-info { flex: 1; min-width: 0; }
.actu-title { font-size: .9rem; font-weight: 600; color: #1c1e21; line-height: 1.3; }
.actu-meta { font-size: .75rem; color: #65676b; margin-top: 2px; }

.section-header {
  padding: 10px 16px 6px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: .62rem; letter-spacing: 2px;
  text-transform: uppercase; color: #8a8d91;
  background: #f0f2f5;
}
.voir-plus {
  display: block; text-align: center; padding: 12px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: .75rem; letter-spacing: 1.5px;
  text-transform: uppercase; color: #C8102E;
  background: #fff; border: none; width: 100%;
  cursor: pointer; border-bottom: 4px solid #e4e6eb;
}

/* Menu publication */
.pub-overlay { display:none; position:fixed; inset:0; z-index:400; background:rgba(0,0,0,.5); }
.pub-overlay.open { display:block; }
.pub-menu {
  position:fixed; bottom:0; left:0; right:0; z-index:401;
  background:#fff; border-radius:20px 20px 0 0;
  padding:16px; padding-bottom:max(20px,env(safe-area-inset-bottom));
  display:none;
}
.pub-menu.open { display:block; }
.pub-menu-title {
  font-family:'Barlow Condensed',sans-serif; font-size:.65rem;
  letter-spacing:2px; text-transform:uppercase; color:#8a8d91;
  padding:0 4px 12px;
}
.pub-options { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.pub-opt {
  display:flex; align-items:center; gap:12px;
  padding:14px 16px; background:#f0f2f5;
  border-radius:10px; border:none; cursor:pointer;
  font-family:'Barlow',sans-serif; text-align:left;
  transition:background .15s;
}
.pub-opt:active { background:#e4e6eb; }
.pub-opt-icon {
  width:38px; height:38px; border-radius:10px;
  display:flex; align-items:center; justify-content:center;
  font-size:1.2rem; flex-shrink:0;
}
.pub-opt-label { font-weight:600; font-size:.88rem; color:#1c1e21; }
.pub-opt-sub { font-size:.75rem; color:#65676b; }
</style>
<style>
.topbar, [class*="topbar"], header { padding-top: env(safe-area-inset-top) !important; }
body { padding-top: env(safe-area-inset-top); }
</style>
</head>
<body>

<!-- TOPBAR SEARCH -->
<div class="exp-topbar">
  <div class="exp-search-wrap">
    <svg class="exp-search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#8a8d91" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input class="exp-search" placeholder="Rechercher dans le quartier…" id="search-input" oninput="filterContent(this.value)">
  </div>
</div>

<!-- TABS -->
<div class="exp-tabs">
  <button class="exp-tab active" onclick="switchTab('tout')">Tout</button>
  <button class="exp-tab" onclick="switchTab('evenements')">Événements</button>
  <button class="exp-tab" onclick="switchTab('annonces')">Annonces</button>
  <button class="exp-tab" onclick="switchTab('actus')">Actus</button>
  <button class="exp-tab" onclick="switchTab('groupes')">Groupes</button>
</div>

<!-- CONTENU -->
<div id="exp-tout" class="exp-section active"></div>
<div id="exp-evenements" class="exp-section"></div>
<div id="exp-annonces" class="exp-section"></div>
<div id="exp-actus" class="exp-section"></div>
<div id="exp-groupes" class="exp-section"></div>

<!-- MENU PUBLICATION -->
<div class="pub-overlay" id="pub-overlay" onclick="closePubMenu()"></div>
<div class="pub-menu" id="pub-menu">
  <div class="pub-menu-title">Que voulez-vous publier ?</div>
  <div class="pub-options">
    <button class="pub-opt" onclick="closePubMenu();window.location.href='index.html'">
      <div class="pub-opt-icon" style="background:#fff0f2;">💬</div>
      <div><div class="pub-opt-label">Post</div><div class="pub-opt-sub">Texte ou photo</div></div>
    </button>
    <button class="pub-opt" onclick="closePubMenu();window.location.href='index.html?story=1'">
      <div class="pub-opt-icon" style="background:#f3f0ff;">📸</div>
      <div><div class="pub-opt-label">Story</div><div class="pub-opt-sub">Éphémère 24h</div></div>
    </button>
    <button class="pub-opt" onclick="closePubMenu();window.location.href='annonces2.html?new=1'">
      <div class="pub-opt-icon" style="background:#f0fdf4;">📋</div>
      <div><div class="pub-opt-label">Annonce</div><div class="pub-opt-sub">Vente, service…</div></div>
    </button>
    <button class="pub-opt" onclick="closePubMenu();window.location.href='evenements.html?new=1'">
      <div class="pub-opt-icon" style="background:#e7f3ff;">📅</div>
      <div><div class="pub-opt-label">Événement</div><div class="pub-opt-sub">Proposer une date</div></div>
    </button>
  </div>
</div>

<!-- NAV -->
<nav class="bottom-nav">
  <a class="nav-item" href="index.html" aria-label="Accueil">
    <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
  </a>
  <a class="nav-item active" href="explorer.html" aria-label="Explorer">
    <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
  </a>
  <div class="nav-center">
    <button class="nav-pub" onclick="window.location.href='ia.html'" aria-label="Publier">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="white"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
    </button>
  </div>
  <a class="nav-item" href="notifs.html" aria-label="Notifications">
    <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
  </a>
  <a class="nav-item" href="profil.html" aria-label="Profil">
    <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
  </a>
</nav>

<script>
const esc = s => Utils.esc(s)
let _allEvts = []
let _allAnn = []
let _allActus = []
let _allGroupes = []
const TABS = ['tout','evenements','annonces','actus','groupes']
const CAT_ICONS = { Vente:'🛍️', Don:'🎁', Service:'🤝', Emploi:'💼', Logement:'🏠', Autre:'📌' }

function openPubMenu() {
  document.getElementById('pub-overlay').classList.add('open')
  document.getElementById('pub-menu').classList.add('open')
}
function closePubMenu() {
  document.getElementById('pub-overlay').classList.remove('open')
  document.getElementById('pub-menu').classList.remove('open')
}

function switchTab(tab) {
  document.querySelectorAll('.exp-tab').forEach((t,i) => t.classList.toggle('active', TABS[i] === tab))
  document.querySelectorAll('.exp-section').forEach(s => s.classList.remove('active'))
  document.getElementById('exp-' + tab).classList.add('active')
}

function filterContent(q) {
  const lower = q.toLowerCase()
  renderEvts(_allEvts.filter(e => !q || e.titre.toLowerCase().includes(lower) || (e.lieu||'').toLowerCase().includes(lower)))
  renderAnn(_allAnn.filter(a => !q || a.titre.toLowerCase().includes(lower) || (a.quartier||'').toLowerCase().includes(lower)))
  renderActus(_allActus.filter(a => !q || a.titre.toLowerCase().includes(lower) || (a.contenu||'').toLowerCase().includes(lower)))
  renderTout()
}

function fmtDate(d) {
  const dt = new Date(d)
  return { day: dt.getDate(), mon: dt.toLocaleString('fr', {month:'short'}) }
}

function renderEvts(evts) {
  const el = document.getElementById('exp-evenements')
  if (!evts.length) { el.innerHTML = '<div style="padding:40px;text-align:center;color:#8a8d91;font-size:.85rem;">Aucun événement</div>'; return }
  el.innerHTML = evts.map(e => {
    const d = fmtDate(e.date_debut)
    return `<div class="evt-row" onclick="window.location.href='evenements.html'">
      <div class="evt-date-box"><div class="evt-date-day">${d.day}</div><div class="evt-date-mon">${d.mon}</div></div>
      <div class="evt-info"><div class="evt-title">${esc(e.titre)}</div><div class="evt-meta">${e.lieu ? esc(e.lieu)+' · ' : ''}${e.categorie||'Événement'}</div></div>
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#ccc" stroke-width="2" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>
    </div>`
  }).join('')
}

function renderAnn(anns) {
  const el = document.getElementById('exp-annonces')
  if (!anns.length) { el.innerHTML = '<div style="padding:40px;text-align:center;color:#8a8d91;font-size:.85rem;">Aucune annonce</div>'; return }
  el.innerHTML = anns.map(a => {
    const icon = CAT_ICONS[a.categorie] || '📌'
    return `<div class="ann-row" onclick="window.location.href='annonces2.html'">
      <div class="ann-cat-box">${icon}</div>
      <div class="ann-info"><div class="ann-title">${esc(a.titre)}</div><div class="ann-meta">${esc(a.categorie||'')} · ${esc(a.quartier||'')}</div></div>
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#ccc" stroke-width="2" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>
    </div>`
  }).join('')
}

function renderActus(actus) {
  const el = document.getElementById('exp-actus')
  if (!actus.length) { el.innerHTML = '<div style="padding:40px;text-align:center;color:#8a8d91;font-size:.85rem;">Aucune actu</div>'; return }
  el.innerHTML = actus.map(a => {
    const cat = a.categorie || 'Actualité'
    return `<div class="actu-row" onclick="window.location.href='actus2.html'">
      <div class="actu-cat-box">📰</div>
      <div class="actu-info">
        <div class="actu-title">${esc(a.titre)}</div>
        <div class="actu-meta">${esc(cat)}${a.source ? ' · '+esc(a.source) : ''}</div>
      </div>
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#ccc" stroke-width="2" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>
    </div>`
  }).join('')
}

function renderGroupes(grps) {
  const el = document.getElementById('exp-groupes')
  if (!grps.length) { el.innerHTML = '<div style="padding:40px;text-align:center;color:#8a8d91;font-size:.85rem;">Aucun groupe</div>'; return }
  el.innerHTML = grps.map(g => {
    const init = (g.nom||'?')[0].toUpperCase()
    return `<div class="ann-row" onclick="window.location.href='groupes.html'">
      <div style="width:44px;height:44px;border-radius:10px;background:#f3f0ff;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:'Bebas Neue',sans-serif;font-size:1.1rem;color:#7c3aed;">${esc(init)}</div>
      <div class="ann-info"><div class="ann-title">${esc(g.nom)}</div><div class="ann-meta">${g.membres_count||0} membre${(g.membres_count||0)>1?'s':''} · ${esc(g.quartier||g.categorie||'')}</div></div>
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#ccc" stroke-width="2" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>
    </div>`
  }).join('')
}

function renderTout() {
  const el = document.getElementById('exp-tout')
  let html = ''

  if (_allEvts.length) {
    html += '<div class="section-header">Événements à venir</div>'
    html += _allEvts.slice(0,3).map(e => {
      const d = fmtDate(e.date_debut)
      return `<div class="evt-row" onclick="window.location.href='evenements.html'">
        <div class="evt-date-box"><div class="evt-date-day">${d.day}</div><div class="evt-date-mon">${d.mon}</div></div>
        <div class="evt-info"><div class="evt-title">${esc(e.titre)}</div><div class="evt-meta">${e.lieu ? esc(e.lieu)+' · ' : ''}${e.categorie||'Événement'}</div></div>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#ccc" stroke-width="2" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>
      </div>`
    }).join('')
    if (_allEvts.length > 3) html += `<button class="voir-plus" onclick="switchTab('evenements')">Voir tout (${_allEvts.length})</button>`
  }

  if (_allAnn.length) {
    html += '<div class="section-header">Annonces du quartier</div>'
    html += _allAnn.slice(0,3).map(a => {
      const icon = CAT_ICONS[a.categorie] || '📌'
      return `<div class="ann-row" onclick="window.location.href='annonces2.html'">
        <div class="ann-cat-box">${icon}</div>
        <div class="ann-info"><div class="ann-title">${esc(a.titre)}</div><div class="ann-meta">${esc(a.categorie||'')} · ${esc(a.quartier||'')}</div></div>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#ccc" stroke-width="2" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>
      </div>`
    }).join('')
    if (_allAnn.length > 3) html += `<button class="voir-plus" onclick="switchTab('annonces')">Voir tout (${_allAnn.length})</button>`
  }

  if (_allActus.length) {
    html += '<div class="section-header">Actualités</div>'
    html += _allActus.slice(0,3).map(a =>
      `<div class="actu-row" onclick="window.location.href='actus2.html'">
        <div class="actu-cat-box">📰</div>
        <div class="actu-info"><div class="actu-title">${esc(a.titre)}</div><div class="actu-meta">${esc(a.categorie||'Actualité')}${a.source ? ' · '+esc(a.source) : ''}</div></div>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#ccc" stroke-width="2" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>
      </div>`
    ).join('')
    if (_allActus.length > 3) html += `<button class="voir-plus" onclick="switchTab('actus')">Voir tout (${_allActus.length})</button>`
  }

  if (_allGroupes.length) {
    html += '<div class="section-header">Groupes actifs</div>'
    html += _allGroupes.slice(0,3).map(g => {
      const init = (g.nom||'?')[0].toUpperCase()
      return `<div class="ann-row" onclick="window.location.href='groupes.html'">
        <div style="width:44px;height:44px;border-radius:10px;background:#f3f0ff;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:'Bebas Neue',sans-serif;font-size:1.1rem;color:#7c3aed;">${esc(init)}</div>
        <div class="ann-info"><div class="ann-title">${esc(g.nom)}</div><div class="ann-meta">${g.membres_count||0} membre${(g.membres_count||0)>1?'s':''} · ${esc(g.quartier||g.categorie||'')}</div></div>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#ccc" stroke-width="2" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>
      </div>`
    }).join('')
  }

  if (!html) html = '<div style="padding:60px 20px;text-align:center;color:#8a8d91;font-size:.85rem;">Rien pour l\'instant</div>'
  el.innerHTML = html
}

async function init() {
  try {
    const [evtsRes, annRes, actusRes, grpRes] = await Promise.all([
      Api.getEvenements(null, 20),
      Api.getAnnonces(null, 20),
      sb.from('actus').select('*').eq('visible', true).order('date_publication', {ascending:false}).limit(20),
      sb.from('groupes').select('*').eq('visible', true).order('membres_count', {ascending:false}).limit(10)
    ])
    _allEvts = (evtsRes.data || []).filter(e => e.validee)
    _allAnn = (annRes.data || []).filter(a => a.validee)
    _allActus = actusRes.data || []
    _allGroupes = grpRes.data || []
    renderEvts(_allEvts)
    renderAnn(_allAnn)
    renderActus(_allActus)
    renderGroupes(_allGroupes)
    renderTout()
  } catch(e) { console.warn(e) }
}
init()
</script>
</body>
</html>
