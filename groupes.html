<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><link rel="icon" href="/favicon.ico"><link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#C8102E"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Groupes — CQP Toulouse</title><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="/css/main.css"><script src="/js/app.js"></script><script src="/js/utils.js"></script><script src="/js/auth.js"></script><script src="/js/api.js"></script>
<style>
.gr-card{background:#fff;border-radius:var(--r);box-shadow:var(--shadow-card);margin-bottom:10px;overflow:hidden;cursor:pointer;}
.gr-banner{height:80px;position:relative;overflow:hidden;}
.gr-banner-bg{width:100%;height:100%;display:flex;align-items:flex-end;padding:12px 14px;position:relative;}
.gr-banner-bg::before{content:'';position:absolute;inset:0;}
[data-c="blue"] .gr-banner-bg::before{background:linear-gradient(135deg,#020510,#081a5e,#1877F2);}
[data-c="rouge"] .gr-banner-bg::before{background:linear-gradient(135deg,#0d0205,#2a0509,#C8102E);}
[data-c="green"] .gr-banner-bg::before{background:linear-gradient(135deg,#020803,#0e3012,#42B72A);}
[data-c="purple"] .gr-banner-bg::before{background:linear-gradient(135deg,#060210,#280f50,#7C3AED);}
[data-c="orange"] .gr-banner-bg::before{background:linear-gradient(135deg,#100401,#4a1a05,#EA580C);}
.gr-name{font-family:'Bebas Neue',sans-serif;font-size:1.2rem;color:#fff;position:relative;z-index:1;}
.gr-info{display:flex;align-items:center;gap:10px;padding:10px 14px;}
.gr-emoji{width:38px;height:38px;border-radius:10px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0;}
.gr-meta{flex:1;}
.gr-desc{font-size:.82rem;color:var(--txt2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.chat-panel{display:none;position:fixed;inset:0;z-index:400;background:#fff;flex-direction:column;}
.chat-panel.open{display:flex;}
.chat-topbar{height:var(--nav);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:0 12px;flex-shrink:0;}
.chat-title{font-family:'Bebas Neue',sans-serif;font-size:1.1rem;flex:1;}
.chat-body{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;}
.msg-wrap{display:flex;gap:8px;max-width:85%;}
.msg-wrap.mine{flex-direction:row-reverse;align-self:flex-end;}
.msg-bubble{background:var(--bg3);border-radius:0 10px 10px 10px;padding:8px 12px;}
.mine .msg-bubble{background:var(--rouge);border-radius:10px 0 10px 10px;}
.msg-name{font-family:'Barlow Condensed',sans-serif;font-size:.65rem;letter-spacing:1px;color:var(--rouge);display:block;margin-bottom:2px;}
.mine .msg-name{display:none;}
.msg-text{font-size:.86rem;color:var(--txt);line-height:1.5;display:block;}
.mine .msg-text{color:#fff;}
.msg-ts{font-size:.65rem;color:var(--txt3);display:block;margin-top:3px;text-align:right;}
.mine .msg-ts{color:rgba(255,255,255,.6);}
.chat-foot{padding:8px 8px 8px 10px;border-top:1px solid var(--border);display:flex;gap:8px;flex-shrink:0;align-items:center;padding-bottom:max(8px,env(safe-area-inset-bottom));}
.chat-input{flex:1;padding:10px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:24px;color:var(--txt);font-family:'Barlow',sans-serif;font-size:.9rem;outline:none;}
.chat-input:focus{border-color:var(--purple);}
.modal-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;align-items:flex-end;justify-content:center;}
.modal-ov.open{display:flex;}
.modal-box{background:#fff;border-radius:20px 20px 0 0;padding:20px 16px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;padding-bottom:max(24px,env(safe-area-inset-bottom));}
</style>
</head><body>
<header class="topbar">
  <button class="back-btn" onclick="history.back()"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>
  <div class="topbar-logo"><span class="logo-pill">CQP</span><div class="logo-text"><span class="logo-name">Groupes</span></div></div>
  <button onclick="openCreateModal()" style="padding:8px 14px;background:var(--purple);border:none;border-radius:20px;color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:.72rem;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;">+ Créer</button>
</header>
<div style="max-width:680px;margin:10px auto;padding:0 10px 16px;" id="gr-list">
  <div class="spinner"><div class="spinner-dot"></div><div class="spinner-dot"></div><div class="spinner-dot"></div></div>
</div>

<!-- CHAT -->
<div class="chat-panel" id="chat-panel">
  <div class="chat-topbar">
    <button onclick="closeChat()" style="width:34px;height:34px;background:var(--bg3);border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;"><svg viewBox="0 0 24 24" width="18" height="18" stroke="var(--txt2)" fill="none" stroke-width="2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg></button>
    <div class="chat-title" id="chat-title"></div>
    <div style="font-family:'Barlow Condensed',sans-serif;font-size:.65rem;color:var(--txt3);" id="chat-members"></div>
  </div>
  <div class="chat-body" id="chat-body"></div>
  <div class="chat-foot">
    <input class="chat-input" id="chat-input" placeholder="Votre message…" style="min-width:0;" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg();}">
    <button onclick="sendMsg()" style="width:42px;height:42px;min-width:42px;background:var(--purple);border:none;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;"><svg viewBox="0 0 24 24" width="16" height="16" stroke="#fff" fill="none" stroke-width="2.5" stroke-linecap="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
  </div>
</div>

<!-- MODAL CRÉER -->
<div class="modal-ov" id="modal-create" onclick="if(event.target===this)closeCreateModal()">
  <div class="modal-box">
    <div style="font-family:'Bebas Neue',sans-serif;font-size:1.3rem;margin-bottom:16px;">👥 Créer un groupe</div>
    <div class="fg"><label>Nom *</label><input id="g-nom" placeholder="Ex: Réseau Mirail" maxlength="60" style="width:100%;padding:11px 14px;background:var(--bg3);border:1.5px solid var(--border);border-radius:8px;font-family:'Barlow',sans-serif;font-size:.9rem;outline:none;"></div>
    <div class="fg"><label>Description</label><textarea id="g-desc" rows="2" placeholder="De quoi parle ce groupe ?" maxlength="300" style="width:100%;padding:11px 14px;background:var(--bg3);border:1.5px solid var(--border);border-radius:8px;font-family:'Barlow',sans-serif;font-size:.9rem;outline:none;resize:none;"></textarea></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      <div class="fg"><label>Emoji</label><input id="g-emoji" placeholder="Ex: 🏘️" maxlength="4" style="width:100%;padding:11px 14px;background:var(--bg3);border:1.5px solid var(--border);border-radius:8px;font-family:'Barlow',sans-serif;font-size:.9rem;outline:none;"></div>
      <div class="fg"><label>Couleur</label><select id="g-color" style="width:100%;padding:11px 14px;background:var(--bg3);border:1.5px solid var(--border);border-radius:8px;font-family:'Barlow',sans-serif;font-size:.9rem;outline:none;"><option value="blue">Bleu</option><option value="rouge">Rouge</option><option value="green">Vert</option><option value="purple">Violet</option><option value="orange">Orange</option></select></div>
    </div>
    <button class="btn-rouge" onclick="createGroupe()">Créer le groupe</button>
    <div class="form-msg" id="g-msg"></div>
    <button onclick="closeCreateModal()" style="width:100%;padding:12px;background:none;border:none;color:var(--txt3);font-family:'Barlow Condensed',sans-serif;font-size:.78rem;letter-spacing:1px;margin-top:4px;cursor:pointer;">Annuler</button>
  </div>
</div>

<nav class="bottom-nav">
  <a class="nav-item" href="index.html"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Accueil</a>
  <a class="nav-item active" href="groupes.html"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Groupes</a>
  <div class="nav-center"><button class="nav-pub" onclick="openCreateModal()"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button></div>
  <a class="nav-item" href="actus.html"><svg viewBox="0 0 24 24"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>Actus</a>
  <a class="nav-item" href="profil.html"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Profil</a>
</nav>
<script>
const esc=s=>Utils.esc(s),timeAgo=d=>Utils.timeAgo(d)
let _groupes=[],_currentGr=null,_msgSub=null
async function load(){
  const el=document.getElementById('gr-list')
  const[{data:gData},{data:mData}]=await Promise.all([Api.getGroupes(),Api.getMesGroupes()])
  _groupes=gData||[]
  const myGr=new Set((mData||[]).map(m=>m.groupe_id))
  if(!_groupes.length){el.innerHTML='<div class="empty">Aucun groupe pour l\'instant.<br>Créez le premier !</div>';return}
  el.innerHTML=_groupes.map(g=>`
    <div class="gr-card" data-c="${esc(g.couleur||'blue')}" onclick="openChat(${g.id})">
      <div class="gr-banner"><div class="gr-banner-bg"><div class="gr-name">${esc(g.nom)}</div></div></div>
      <div class="gr-info">
        <div class="gr-emoji">${esc(g.emoji||'👥')}</div>
        <div class="gr-meta">
          <div class="gr-desc">${esc(g.description||'')}</div>
          <div style="font-size:.72rem;color:var(--txt3);margin-top:3px;" id="mc-${g.id}">… membres</div>
        </div>
        <button class="${myGr.has(g.id)?'btn-rouge':'btn-outline'}" id="join-${g.id}" onclick="event.stopPropagation();toggleMembre(${g.id},this)" style="padding:7px 14px;border-radius:20px;font-family:'Barlow Condensed',sans-serif;font-size:.72rem;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;">
          ${myGr.has(g.id)?'✅ Membre':'Rejoindre'}
        </button>
      </div>
    </div>`).join('')
  _groupes.forEach(async g=>{
    const{count}=await Api.getMembresCount(g.id)
    const el=document.getElementById('mc-'+g.id)
    if(el)el.textContent=`${count||0} membre${count>1?'s':''}`
  })
}
async function toggleMembre(gId,btn){
  if(!Auth.getCode()){window.location.href='profil.html';return}
  const joined=btn.classList.contains('btn-rouge')
  if(!joined){btn.classList.replace('btn-outline','btn-rouge');btn.textContent='✅ Membre';Api.joinGroupe(gId).catch(()=>{})}
  else{btn.classList.replace('btn-rouge','btn-outline');btn.textContent='Rejoindre';Api.leaveGroupe(gId).catch(()=>{})}
}
async function openChat(gId){
  _currentGr=_groupes.find(g=>g.id===gId);if(!_currentGr)return
  document.getElementById('chat-title').textContent=_currentGr.nom
  document.getElementById('chat-panel').classList.add('open')
  document.body.style.overflow='hidden'
  await loadMsgs(gId)
  if(_msgSub)sb.removeChannel(_msgSub)
  _msgSub=sb.channel('gm-'+gId).on('postgres_changes',{event:'INSERT',schema:'public',table:'groupe_messages',filter:`groupe_id=eq.${gId}`},p=>appendMsg(p.new)).subscribe()
  const{count}=await Api.getMembresCount(gId)
  document.getElementById('chat-members').textContent=`${count||0} membre${count>1?'s':''}`
}
function closeChat(){
  document.getElementById('chat-panel').classList.remove('open')
  document.body.style.overflow=''
  if(_msgSub){sb.removeChannel(_msgSub);_msgSub=null}
  _currentGr=null
}
async function loadMsgs(gId){
  const body=document.getElementById('chat-body')
  body.innerHTML='<div style="text-align:center;padding:20px;color:var(--txt3);font-size:.8rem;">Chargement…</div>'
  const{data}=await Api.getMessages(gId,60)
  body.innerHTML='';(data||[]).forEach(m=>appendMsg(m))
  body.scrollTop=body.scrollHeight
}
function appendMsg(m){
  const body=document.getElementById('chat-body')
  const mine=m.profil_code===Auth.getCode()
  const el=document.createElement('div')
  el.className='msg-wrap'+(mine?' mine':'')
  el.innerHTML=`<div class="c-av c-av-28 c-av-init">${esc((m.prenom||'?')[0].toUpperCase())}</div>
    <div><div class="msg-bubble"><span class="msg-name">${esc(m.prenom||'')}</span><span class="msg-text">${esc(m.contenu||'')}</span></div><span class="msg-ts">${timeAgo(m.created_at)}</span></div>`
  body.appendChild(el);body.scrollTop=body.scrollHeight
}
async function sendMsg(){
  const inp=document.getElementById('chat-input')
  const contenu=inp.value.trim()
  if(!contenu||!_currentGr)return
  if(!Auth.getCode()){window.location.href='profil.html';return}
  inp.value=''
  await Api.sendMessage({groupe_id:_currentGr.id,contenu})
}
function openCreateModal(){
  if(!Auth.getCode()){window.location.href='profil.html';return}
  document.getElementById('modal-create').classList.add('open');document.body.style.overflow='hidden'
}
function closeCreateModal(){document.getElementById('modal-create').classList.remove('open');document.body.style.overflow=''}
async function createGroupe(){
  const nom=document.getElementById('g-nom').value.trim()
  const desc=document.getElementById('g-desc').value.trim()
  const emoji=document.getElementById('g-emoji').value.trim()||'👥'
  const couleur=document.getElementById('g-color').value
  const msg=document.getElementById('g-msg')
  if(!nom){msg.style.color='var(--rouge)';msg.textContent='Nom obligatoire.';return}
  msg.style.color='var(--txt3)';msg.textContent='Création…'
  const{data,error}=await Api.createGroupe({nom,description:desc||null,emoji,couleur,profil_code:Auth.getCode()||null})
  if(error){msg.style.color='var(--rouge)';msg.textContent='Erreur: '+error.message;return}
  await Api.joinGroupe(data.id).catch(()=>{})
  closeCreateModal();load()
}
load();Api.trackView('groupes')
</script>
</body></html>
