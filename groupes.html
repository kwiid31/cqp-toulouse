<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#C8102E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Groupes — CQP Toulouse</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--rouge:#C8102E;--blue:#1877F2;--green:#42B72A;--purple:#7C3AED;--orange:#EA580C;
  --txt:#050505;--txt2:#65676B;--txt3:#8A8D91;
  --bg:#F0F2F5;--bg3:#E4E6EB;--border:#CED0D4;
  --shadow:0 1px 2px rgba(0,0,0,.1);--r:10px;--nav:56px;}
html,body{font-size:15px;background:var(--bg);color:var(--txt);font-family:'Barlow',sans-serif;min-height:100vh;}
body{padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 4px);}
a{text-decoration:none;color:inherit}button,label{cursor:pointer;font-family:inherit;outline:none;border:none;}

.topbar{position:sticky;top:0;z-index:100;height:var(--nav);background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:0 14px;box-shadow:var(--shadow);}
.back-btn{width:36px;height:36px;background:var(--bg3);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.back-btn svg{width:20px;height:20px;stroke:var(--txt);fill:none;stroke-width:2;stroke-linecap:round;}
.topbar-title{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:.5px;flex:1;}
.btn-create{padding:8px 16px;background:var(--purple);border:none;border-radius:20px;color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:.72rem;letter-spacing:1.5px;text-transform:uppercase;}

/* GROUPE LIST */
.groupe-list{max-width:680px;margin:0 auto;padding:10px;}
.groupe-card{background:#fff;border-radius:var(--r);margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;}
.groupe-banner{height:90px;position:relative;overflow:hidden;}
.groupe-banner-bg{width:100%;height:100%;display:flex;align-items:flex-end;padding:12px 14px;position:relative;}
.groupe-banner-bg::before{content:'';position:absolute;inset:0;}
.groupe-card[data-color="purple"] .groupe-banner-bg::before{background:linear-gradient(135deg,#0d0518 0%,#3b1a6e 60%,var(--purple) 100%);}
.groupe-card[data-color="blue"] .groupe-banner-bg::before{background:linear-gradient(135deg,#050a1a 0%,#0e2472 60%,var(--blue) 100%);}
.groupe-card[data-color="rouge"] .groupe-banner-bg::before{background:linear-gradient(135deg,#1a0508 0%,#4a0b16 60%,var(--rouge) 100%);}
.groupe-card[data-color="green"] .groupe-banner-bg::before{background:linear-gradient(135deg,#061008 0%,#1a4a1f 60%,var(--green) 100%);}
.groupe-card[data-color="orange"] .groupe-banner-bg::before{background:linear-gradient(135deg,#1a0805 0%,#4a2110 60%,var(--orange) 100%);}
.groupe-banner-name{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;color:#fff;letter-spacing:.5px;position:relative;z-index:1;}
.groupe-info{display:flex;align-items:center;gap:10px;padding:12px 14px;}
.groupe-emoji{width:40px;height:40px;border-radius:10px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0;}
.groupe-meta{flex:1;}
.groupe-desc{font-size:.84rem;color:var(--txt2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.groupe-stats{display:flex;align-items:center;gap:8px;margin-top:4px;}
.stat-pill{font-family:'Barlow Condensed',sans-serif;font-size:.65rem;letter-spacing:1px;color:var(--txt3);}
.btn-join{padding:7px 16px;border-radius:20px;font-family:'Barlow Condensed',sans-serif;font-size:.72rem;letter-spacing:1.5px;text-transform:uppercase;border:1.5px solid var(--border);background:none;color:var(--txt2);}
.btn-join.joined{background:var(--green);border-color:var(--green);color:#fff;}

/* CHAT PANEL */
.chat-panel{display:none;position:fixed;inset:0;z-index:400;background:#fff;flex-direction:column;}
.chat-panel.open{display:flex;}
.chat-topbar{height:var(--nav);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:0 12px;flex-shrink:0;}
.chat-av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.2rem;background:var(--bg3);flex-shrink:0;}
.chat-title{font-family:'Bebas Neue',sans-serif;font-size:1.1rem;letter-spacing:.3px;flex:1;}
.chat-members{font-family:'Barlow Condensed',sans-serif;font-size:.65rem;color:var(--txt3);letter-spacing:1px;}
.chat-close{width:34px;height:34px;background:var(--bg3);border-radius:50%;display:flex;align-items:center;justify-content:center;}
.chat-close svg{width:18px;height:18px;stroke:var(--txt2);fill:none;stroke-width:2;stroke-linecap:round;}
.chat-body{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;}
.msg-item{display:flex;gap:8px;max-width:85%;}
.msg-item.mine{flex-direction:row-reverse;align-self:flex-end;}
.msg-av{width:28px;height:28px;border-radius:50%;background:var(--rouge);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:.7rem;color:#fff;flex-shrink:0;margin-top:2px;}
.msg-bubble{background:var(--bg3);border-radius:0 10px 10px 10px;padding:8px 12px;max-width:100%;}
.mine .msg-bubble{background:var(--rouge);border-radius:10px 0 10px 10px;}
.msg-name{font-family:'Barlow Condensed',sans-serif;font-size:.65rem;letter-spacing:1px;color:var(--rouge);margin-bottom:3px;}
.mine .msg-name{display:none;}
.msg-text{font-size:.86rem;color:var(--txt);line-height:1.5;}
.mine .msg-text{color:#fff;}
.msg-ts{font-size:.65rem;color:var(--txt3);margin-top:3px;text-align:right;}
.mine .msg-ts{color:rgba(255,255,255,.6);}
.chat-foot{padding:10px 12px;border-top:1px solid var(--border);display:flex;gap:8px;flex-shrink:0;padding-bottom:max(10px,env(safe-area-inset-bottom));}
.chat-input{flex:1;padding:10px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:24px;color:var(--txt);font-family:'Barlow',sans-serif;font-size:.9rem;outline:none;}
.chat-input:focus{border-color:var(--purple);}
.chat-send{width:42px;height:42px;background:var(--purple);border:none;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.chat-send svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;}

/* MODAL CRÉER GROUPE */
.modal-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;align-items:flex-end;justify-content:center;}
.modal-ov.open{display:flex;}
.modal-box{background:#fff;border-radius:20px 20px 0 0;padding:20px 16px;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;padding-bottom:max(24px,env(safe-area-inset-bottom));}
.modal-title{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;margin-bottom:16px;}
.fg{margin-bottom:12px;}
.fg label{display:block;font-family:'Barlow Condensed',sans-serif;font-size:.65rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--txt3);margin-bottom:5px;}
.fg input,.fg select,.fg textarea{width:100%;padding:11px 14px;background:var(--bg3);border:1.5px solid var(--border);border-radius:8px;color:var(--txt);font-family:'Barlow',sans-serif;font-size:.9rem;outline:none;resize:vertical;}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--purple);}
.btn-submit{width:100%;padding:14px;background:var(--purple);border:none;border-radius:8px;color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:.88rem;letter-spacing:2px;text-transform:uppercase;margin-top:4px;}
.form-msg{text-align:center;font-size:.8rem;min-height:18px;margin-top:8px;}

.spinner{display:flex;align-items:center;justify-content:center;gap:8px;padding:40px;}
.spinner-dot{width:8px;height:8px;border-radius:50%;background:var(--purple);animation:bounce .9s infinite;}
.spinner-dot:nth-child(2){animation-delay:.15s;}.spinner-dot:nth-child(3){animation-delay:.3s;}
@keyframes bounce{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.7)}}
.empty{text-align:center;padding:40px 20px;color:var(--txt3);font-family:'Barlow Condensed',sans-serif;font-size:.85rem;letter-spacing:1px;}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:200;background:#fff;border-top:1px solid var(--border);display:flex;align-items:stretch;height:var(--nav);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -1px 8px rgba(0,0,0,.06);}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:none;border:none;color:var(--txt3);font-family:'Barlow Condensed',sans-serif;font-size:.5rem;letter-spacing:.5px;text-transform:uppercase;text-decoration:none;padding:6px 0;}
.nav-item.active,.nav-item:hover{color:var(--rouge);}
.nav-item svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.nav-center{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:4px;}
.nav-pub{width:50px;height:50px;border-radius:50%;background:var(--rouge);border:none;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 14px rgba(200,16,46,.4);margin-top:-14px;}
.nav-pub svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;}
@media(min-width:700px){.bottom-nav{display:none;}body{padding-bottom:0;}}
</style>
</head>
<body>

<header class="topbar">
  <button class="back-btn" onclick="history.length>1?history.back():location.href='index.html'">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
  </button>
  <span class="topbar-title">👥 Groupes</span>
  <button class="btn-create" onclick="openCreateModal()">+ Créer</button>
</header>

<div class="groupe-list" id="groupe-list">
  <div class="spinner"><div class="spinner-dot"></div><div class="spinner-dot"></div><div class="spinner-dot"></div></div>
</div>

<!-- CHAT PANEL -->
<div class="chat-panel" id="chat-panel">
  <div class="chat-topbar">
    <button class="chat-close" onclick="closeChat()"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>
    <div class="chat-av" id="chat-av"></div>
    <div style="flex:1"><div class="chat-title" id="chat-title"></div><div class="chat-members" id="chat-members"></div></div>
  </div>
  <div class="chat-body" id="chat-body"></div>
  <div class="chat-foot">
    <input class="chat-input" id="chat-input" placeholder="Votre message…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg();}">
    <button class="chat-send" onclick="sendMsg()"><svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
  </div>
</div>

<!-- MODAL CRÉER GROUPE -->
<div class="modal-ov" id="modal-create" onclick="if(event.target===this)closeCreateModal()">
  <div class="modal-box">
    <div class="modal-title">👥 Créer un groupe</div>
    <div class="fg"><label>Nom du groupe *</label><input id="g-nom" placeholder="Ex: Réseau Mirail" maxlength="50"></div>
    <div class="fg"><label>Description</label><textarea id="g-desc" rows="2" placeholder="De quoi parle ce groupe ?" maxlength="200"></textarea></div>
    <div class="fg"><label>Emoji / icône</label><input id="g-emoji" placeholder="Ex: 🏘️" maxlength="4"></div>
    <div class="fg"><label>Couleur</label>
      <select id="g-color">
        <option value="purple">Violet</option>
        <option value="blue">Bleu</option>
        <option value="rouge">Rouge</option>
        <option value="green">Vert</option>
        <option value="orange">Orange</option>
      </select>
    </div>
    <button class="btn-submit" onclick="createGroupe()">Créer le groupe</button>
    <div class="form-msg" id="g-msg"></div>
    <button onclick="closeCreateModal()" style="width:100%;padding:12px;background:none;border:none;color:var(--txt3);font-family:'Barlow Condensed',sans-serif;font-size:.78rem;letter-spacing:1px;margin-top:4px;">Annuler</button>
  </div>
</div>

<nav class="bottom-nav">
  <a class="nav-item" href="index.html"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Accueil</a>
  <a class="nav-item active" href="groupes.html"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Groupes</a>
  <div class="nav-center"><button class="nav-pub" onclick="openCreateModal()"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button></div>
  <a class="nav-item" href="actus.html"><svg viewBox="0 0 24 24"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>Actus</a>
  <a class="nav-item" href="profil.html"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Profil</a>
</nav>

<script>
const SBU='https://vzfwtyczqfbhbjzotjft.supabase.co';
const SBK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ6Znd0eWN6cWZiaGJqem90amZ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3NDY0OTIsImV4cCI6MjA5MTMyMjQ5Mn0.heto5Qc6WdIjlurllzXhi1PmnRY7_x65Bdof-vKqyGk';
const sb=supabase.createClient(SBU,SBK);
const _EF=SBU+'/functions/v1/auth';
const esc=s=>{const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;};
const getCode=()=>localStorage.getItem('cqp_code')||null;
const getPrenom=()=>localStorage.getItem('cqp_prenom')||'';
const timeAgo=d=>{if(!d)return'';const s=(Date.now()-new Date(d))/1000;if(s<60)return"À l'instant";if(s<3600)return`Il y a ${Math.floor(s/60)} min`;if(s<86400)return`Il y a ${Math.floor(s/3600)} h`;return new Date(d).toLocaleDateString('fr-FR',{day:'2-digit',month:'short'});};
const _codeToEmail=c=>`code-${c}@cqp-toulouse.fr`;
const _codeToPass=c=>`cqp-${c}-secret2025`;
let _authDone=false;
async function ensureAuth(){if(_authDone)return;const code=localStorage.getItem('cqp_code');if(!code)return;try{const{data:{session}}=await sb.auth.getSession();if(session){_authDone=true;return;}const{error}=await sb.auth.signInWithPassword({email:_codeToEmail(code),password:_codeToPass(code)});if(!error){_authDone=true;return;}await sb.auth.signUp({email:_codeToEmail(code),password:_codeToPass(code),options:{data:{profil_code:code}}});await sb.auth.signInWithPassword({email:_codeToEmail(code),password:_codeToPass(code)});_authDone=true;}catch(e){console.warn(e);}}

let groupes=[];let currentGroupe=null;let msgSub=null;

async function loadGroupes(){
  const el=document.getElementById('groupe-list');
  try{
    const[{data:gData},{data:mData}]=await Promise.all([
      sb.from('groupes').select('*').eq('visible',true).order('created_at',{ascending:false}),
      sb.from('groupe_membres').select('groupe_id').eq('profil_code',getCode()||'__none__')
    ]);
    groupes=gData||[];
    const myGroupes=new Set((mData||[]).map(m=>m.groupe_id));
    if(!groupes.length){el.innerHTML='<div class="empty">Aucun groupe pour l\'instant.<br>Créez le premier !</div>';return;}
    el.innerHTML=groupes.map(g=>`
      <div class="groupe-card" data-color="${esc(g.couleur||'purple')}" onclick="openChat(${g.id})">
        <div class="groupe-banner"><div class="groupe-banner-bg"><div class="groupe-banner-name">${esc(g.nom)}</div></div></div>
        <div class="groupe-info">
          <div class="groupe-emoji">${esc(g.emoji||'👥')}</div>
          <div class="groupe-meta">
            <div class="groupe-desc">${esc(g.description||'')}</div>
            <div class="groupe-stats">
              <span class="stat-pill" id="mc-${g.id}">… membres</span>
            </div>
          </div>
          <button class="btn-join ${myGroupes.has(g.id)?'joined':''}" id="join-${g.id}"
            onclick="event.stopPropagation();toggleMembre(${g.id},this)">
            ${myGroupes.has(g.id)?'✅ Membre':'Rejoindre'}
          </button>
        </div>
      </div>`).join('');
    // Charger counts membres
    groupes.forEach(async g=>{
      const{count}=await sb.from('groupe_membres').select('*',{count:'exact',head:true}).eq('groupe_id',g.id);
      const el=document.getElementById('mc-'+g.id);
      if(el)el.textContent=`${count||0} membre${count>1?'s':''}`;
    });
  }catch(e){el.innerHTML='<div class="empty">⚠️ Connexion impossible.</div>';console.error(e);}
}

async function toggleMembre(gId,btn){
  if(!getCode()){window.location.href='profil.html';return;}
  await ensureAuth();
  const joined=btn.classList.contains('joined');
  if(!joined){
    btn.classList.add('joined');btn.textContent='✅ Membre';
    await sb.from('groupe_membres').insert({groupe_id:gId,profil_code:getCode(),prenom:getPrenom()}).catch(()=>{});
  }else{
    btn.classList.remove('joined');btn.textContent='Rejoindre';
    await sb.from('groupe_membres').delete().eq('groupe_id',gId).eq('profil_code',getCode()).catch(()=>{});
  }
}

async function openChat(gId){
  currentGroupe=groupes.find(g=>g.id===gId);if(!currentGroupe)return;
  document.getElementById('chat-av').textContent=currentGroupe.emoji||'👥';
  document.getElementById('chat-title').textContent=currentGroupe.nom;
  document.getElementById('chat-panel').classList.add('open');
  document.body.style.overflow='hidden';
  await loadMessages(gId);
  // Realtime
  if(msgSub)sb.removeChannel(msgSub);
  msgSub=sb.channel('gm-'+gId).on('postgres_changes',{event:'INSERT',schema:'public',table:'groupe_messages',filter:`groupe_id=eq.${gId}`},payload=>{appendMsg(payload.new);}).subscribe();
  // Membres count
  const{count}=await sb.from('groupe_membres').select('*',{count:'exact',head:true}).eq('groupe_id',gId);
  document.getElementById('chat-members').textContent=`${count||0} membre${count>1?'s':''}`;
}

function closeChat(){
  document.getElementById('chat-panel').classList.remove('open');
  document.body.style.overflow='';
  if(msgSub){sb.removeChannel(msgSub);msgSub=null;}
  currentGroupe=null;
}

async function loadMessages(gId){
  const body=document.getElementById('chat-body');
  body.innerHTML='<div style="text-align:center;padding:20px;color:var(--txt3);font-size:.8rem;">Chargement…</div>';
  const{data}=await sb.from('groupe_messages').select('*').eq('groupe_id',gId).eq('visible',true).order('created_at',{ascending:true}).limit(60);
  body.innerHTML='';
  (data||[]).forEach(m=>appendMsg(m));
  body.scrollTop=body.scrollHeight;
}

function appendMsg(m){
  const body=document.getElementById('chat-body');
  const mine=m.profil_code===getCode();
  const el=document.createElement('div');
  el.className='msg-item'+(mine?' mine':'');
  el.innerHTML=`
    <div class="msg-av">${(m.prenom||'?')[0].toUpperCase()}</div>
    <div>
      <div class="msg-bubble">
        <div class="msg-name">${esc(m.prenom||'')}</div>
        <div class="msg-text">${esc(m.message||'')}</div>
      </div>
      <div class="msg-ts">${timeAgo(m.created_at)}</div>
    </div>`;
  body.appendChild(el);
  body.scrollTop=body.scrollHeight;
}

async function sendMsg(){
  const inp=document.getElementById('chat-input');
  const msg=inp.value.trim();
  if(!msg||!currentGroupe)return;
  if(!getCode()){window.location.href='profil.html';return;}
  await ensureAuth();
  inp.value='';
  const{error}=await sb.from('groupe_messages').insert({groupe_id:currentGroupe.id,profil_code:getCode(),prenom:getPrenom(),message:msg,visible:true});
  if(error)console.error('sendMsg',error);
}

function openCreateModal(){
  if(!getCode()){window.location.href='profil.html';return;}
  document.getElementById('modal-create').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeCreateModal(){document.getElementById('modal-create').classList.remove('open');document.body.style.overflow='';}

async function createGroupe(){
  await ensureAuth();
  const nom=document.getElementById('g-nom').value.trim();
  const desc=document.getElementById('g-desc').value.trim();
  const emoji=document.getElementById('g-emoji').value.trim()||'👥';
  const couleur=document.getElementById('g-color').value;
  const msg=document.getElementById('g-msg');
  if(!nom){msg.style.color='var(--rouge)';msg.textContent='Nom obligatoire.';return;}
  msg.style.color='var(--txt3)';msg.textContent='Création…';
  const{data,error}=await sb.from('groupes').insert({nom,description:desc||null,emoji,couleur,visible:true,createur_code:getCode()}).select().single();
  if(error){msg.style.color='var(--rouge)';msg.textContent='Erreur: '+error.message;return;}
  // Auto-rejoindre
  await sb.from('groupe_membres').insert({groupe_id:data.id,profil_code:getCode(),prenom:getPrenom()}).catch(()=>{});
  closeCreateModal();
  loadGroupes();
}

loadGroupes();
</script>
</body>
</html>
