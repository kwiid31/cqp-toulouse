<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>IA CQP</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#fff;font-family:-apple-system,system-ui,sans-serif;overflow:hidden}
.wrap{display:flex;flex-direction:column;height:100dvh}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;padding-top:max(14px,env(safe-area-inset-top));border-bottom:.5px solid #eff3f4;flex-shrink:0}
.back{background:none;border:none;cursor:pointer;padding:4px}
.brand{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:#0f1419}
.logo{width:28px;height:28px;background:#C8102E;border-radius:50%;display:flex;align-items:center;justify-content:center}
.badge{font-size:12px;color:#536471;background:#f7f9f9;border:.5px solid #e4e6eb;border-radius:20px;padding:4px 10px;display:flex;align-items:center;gap:5px}
.dot{width:6px;height:6px;border-radius:50%;background:#00ba7c}
.conn-btn{background:none;border:.5px solid #e4e6eb;border-radius:20px;padding:5px 12px;font-size:12px;color:#0f1419;cursor:pointer;font-family:inherit;font-weight:600}
.msgs{flex:1;overflow-y:auto;padding-bottom:8px;scroll-behavior:smooth}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;padding:32px 24px 0}
.empty-logo{width:48px;height:48px;background:#C8102E;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:20px}
.empty h1{font-size:24px;font-weight:700;color:#0f1419;margin-bottom:8px;line-height:1.3}
.empty p{font-size:14px;color:#536471}
.msg{padding:16px 16px 0;display:flex;gap:10px;animation:up .2s ease}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.av{width:32px;height:32px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.av.ia{background:#C8102E}
.av.user{background:#e4e6eb;color:#536471}
.mbody{flex:1;min-width:0;padding-bottom:14px;border-bottom:.5px solid #eff3f4}
.msg:last-child .mbody{border-bottom:none}
.mname{font-size:13px;font-weight:700;color:#0f1419;margin-bottom:4px}
.mtext{font-size:15px;color:#0f1419;line-height:1.55;white-space:pre-wrap}
.mtext.typing::after{content:'▋';animation:bl .7s infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:0}}
.preview{margin-top:12px;border:.5px solid #e4e6eb;border-radius:12px;overflow:hidden;background:#f7f9f9}
.preview-head{padding:8px 14px;background:#fff;border-bottom:.5px solid #e4e6eb;font-size:11px;font-weight:700;color:#536471;text-transform:uppercase;letter-spacing:1px}
.preview-body{padding:12px 14px}
.preview-q{font-size:15px;font-weight:800;color:#0f1419}
.preview-p{font-size:13px;color:#536471;margin-left:6px}
.preview-t{font-size:14px;color:#0f1419;margin-top:6px;line-height:1.5}
.preview-acts{display:flex;flex-direction:column;gap:8px;padding:10px 14px;border-top:.5px solid #e4e6eb}
.preview-row{display:flex;gap:8px}
.btn-pub{flex:1;background:#C8102E;color:#fff;border:none;border-radius:8px;padding:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-cancel{flex:1;background:none;color:#536471;border:.5px solid #e4e6eb;border-radius:8px;padding:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-photo{width:100%;background:#f0fdf4;color:#16a34a;border:.5px solid #86efac;border-radius:8px;padding:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.cards-zone{display:flex;gap:8px;padding:0 16px 12px;overflow-x:auto;scrollbar-width:none}
.cards-zone::-webkit-scrollbar{display:none}
.ia-card{flex-shrink:0;background:#fff;border:.5px solid #e4e6eb;border-radius:12px;padding:12px 14px;cursor:pointer;font-family:inherit;text-align:left;width:136px;display:flex;flex-direction:column;gap:8px;transition:background .1s}
.ia-card:active{background:#f7f9f9}
.ia-card-label{font-size:13px;font-weight:600;color:#0f1419;line-height:1.35}
.input-zone{padding:10px 16px;padding-bottom:max(14px,env(safe-area-inset-bottom));background:#fff;flex-shrink:0}
.input-box{display:flex;align-items:flex-end;gap:10px;border:.5px solid #e4e6eb;border-radius:16px;padding:14px 12px 14px 14px;background:#f7f9f9;transition:border-color .15s}
.input-box:focus-within{border-color:#C8102E;background:#fff}
.clip-btn{background:none;border:none;cursor:pointer;padding:2px;flex-shrink:0;display:flex;align-items:center;margin-bottom:2px}
textarea{flex:1;border:none;background:none;outline:none;resize:none;font-size:16px;font-family:inherit;color:#0f1419;line-height:1.5;min-height:48px;max-height:120px;overflow-y:auto;padding:0}
textarea::placeholder{color:#8b98a5}
.send{width:34px;height:34px;border-radius:50%;background:#0f1419;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:opacity .15s;margin-bottom:2px}
.send:disabled{opacity:.25}
</style>
</head>
<body>

    <div class="brand">

      <div style="position:relative;flex-shrink:0;">
        <img id="img-preview-thumb" style="width:72px;height:72px;border-radius:10px;object-fit:cover;border:.5px solid #e4e6eb;display:block;">
        <button onclick="window.removePendingImg()" style="position:absolute;top:-6px;right:-6px;width:20px;height:20px;background:#0f1419;border-radius:50%;border:2px solid #fff;color:#fff;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;">✕</button>

<script>
var SB_URL = 'https://rlrazcitmwxfaxlnnfau.supabase.co';

var PROXY = 'https://rlrazcitmwxfaxlnnfau.supabase.co/functions/v1/groq-proxy';
var sbc = supabase.createClient(SB_URL, SB_KEY);

var msgsEl = document.getElementById('msgs');
var taEl = document.getElementById('ta');
var sbtn = document.getElementById('sbtn');
var cardsEl = document.getElementById('cards-zone');
var emptyEl = document.getElementById('empty');
var photoInp = document.getElementById('photo-input');

var profil = null;
var hist = [];
var typing = false;
var pending = null;
var pendingImg = null;

function getSYS() {
  var prenom = profil ? profil.prenom : null
  var quartier = profil ? (profil.quartier || 'Toulouse') : 'Toulouse'
  var nbMsg = hist.length

  return `<leila_identity>
Tu es Leila, l'assistante IA de CQP Toulouse — le réseau social des habitants des quartiers populaires de Toulouse.
Tu parles à ${prenom ? prenom + ', du quartier ' + quartier : 'un habitant de ' + quartier}.
</leila_identity>

<tone>
Tu es chaleureuse, directe, naturelle. Tu parles en français comme quelqu'un du quartier — jamais trop formel.
${nbMsg === 0 ? "C'est le début de la conversation. Une phrase d'accueil courte, puis aide." : "Conversation en cours. Pas de re-salutation. Va droit au but."}
Tu poses au maximum une question à la fois. Tu ne noies pas l'utilisateur de questions.
</tone>

<knowledge>
QUARTIERS DE TOULOUSE QUE TU CONNAIS :
- Bellefontaine : grands ensembles HLM, tours iconiques, fresque Shepard Fairey, rénovation urbaine
- Reynerie : mixité sociale, marché animé, vie associative forte

- Empalot : bords de Garonne, proximité Halle aux Grains, jeunesse active
- Bagatelle : bords de Garonne, pavillons + HLM, espaces verts
- Faourette : petit quartier, tissu social fort
- Izards / Trois Cocus : nord Toulouse, quartier populaire dynamique
- Arènes / Bourbaki : proche centre, métro ligne A
- Croix d'Aurade : est de Toulouse, plus résidentiel

LIEUX IMPORTANTS :
- Prairie des Filtres : grande prairie bord de Garonne, barbecues autorisés, animations estivales
- Halle aux Grains : salle de spectacle emblématique, Saint-Cyprien, bords de Garonne
- La Garonne : fleuve, bords aménagés pour balades, pêche, pique-niques
- Capitole : place centrale de Toulouse
- Médiathèques, centres sociaux, maisons de quartier dans chaque quartier

Si tu n'es pas certaine d'un lieu ou d'une info, dis-le honnêtement. Ne jamais inventer.
</knowledge>

<capabilities>
CE QUE TU FAIS BIEN :
- Analyser des photos et flyers (extraction de texte, identification de lieux, infos événements)
- Aider à rédiger des posts, annonces, événements pour CQP
- Répondre aux questions sur la vie de quartier à Toulouse
- Adapter le quartier de publication si l'utilisateur en mentionne un différent du sien

IMPORTANT — analyse d'image :
- Si l'utilisateur envoie une photo, décris ce que tu vois puis demande ce qu'il veut en faire
- Si l'utilisateur demande d'extraire du texte d'une image, fais-le fidèlement

</capabilities>

<rules>

- Tu génères le JSON de publication UNIQUEMENT quand l'utilisateur confirme vouloir publier
- Tu ne montres JAMAIS le JSON brut dans ta réponse — il est traité automatiquement
- Si l'utilisateur mentionne un quartier différent du sien, utilise ce quartier pour la publication
</rules>

<publication_format>
Quand l'utilisateur confirme une publication, génère UNIQUEMENT ce JSON (rien d'autre) :
Post: {"action":"publier","type":"post","contenu":"...","quartier":"${quartier}"}
Annonce: {"action":"publier","type":"annonce","titre":"...","categorie":"Vente|Service|Emploi|Logement|Don|Autre","description":"...","quartier":"${quartier}"}
Evenement: {"action":"publier","type":"evenement","titre":"...","lieu":"...","date":"2026-06-15","description":"..."}
</publication_format>`
}

function init() {
  var code = localStorage.getItem('cqp_code') || localStorage.getItem('profil_code') || localStorage.getItem('code') || localStorage.getItem('session_id');
  if (!code) return;
  sbc.from('profils').select('*').eq('code', code).maybeSingle().then(function(res) {
    if (res.data) {
      profil = res.data;
      document.getElementById('badge').style.display = 'flex';
      document.getElementById('uname').textContent = res.data.prenom;
      document.getElementById('connbtn').style.display = 'none';
    }
  });
}

function hideEmpty() {
  if (emptyEl) emptyEl.style.display = 'none';
}

function addMsg(role, txt) {
  hideEmpty();
  var isIA = role === 'ia';
  var d = document.createElement('div');
  d.className = 'msg';
  var av = isIA
    ? '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><path d="M12 2a10 10 0 1 0 10 10"/><path d="M12 6v6l4 2"/></svg>'
    : (profil ? profil.prenom[0].toUpperCase() : '?');
  var name = isIA ? 'CQP IA' : (profil ? profil.prenom : 'Toi');
  d.innerHTML = '<div class="av ' + (isIA ? 'ia' : 'user') + '">' + av + '</div><div class="mbody"><div class="mname">' + name + '</div><div class="mtext">' + txt + '</div></div>';
  msgsEl.appendChild(d);
  msgsEl.scrollTop = msgsEl.scrollHeight;
  return d.querySelector('.mtext');
}

function showPreview(data) {
  var last = msgsEl.querySelector('.msg:last-child .mbody');
  if (!last) return;
  var q = data.quartier || (profil && profil.quartier) || '';
  var p = (profil && profil.prenom) || '';
  var imgHtml = data._imgB64 ? '<img src="data:' + (data._imgMime || 'image/jpeg') + ';base64,' + data._imgB64 + '" style="width:100%;border-radius:8px;margin-bottom:8px;max-height:200px;object-fit:cover;">' : '';
  var body = '';
  if (data.type === 'post') body = imgHtml + '<span class="preview-q">' + q + '</span><span class="preview-p">' + p + '</span><div class="preview-t">' + (data.contenu || '') + '</div>';
  else if (data.type === 'annonce') body = imgHtml + '<span class="preview-q">' + (data.titre || '') + '</span><div class="preview-t">' + (data.categorie || '') + ' · ' + q + '<br>' + (data.description || '') + '</div>';
  else if (data.type === 'evenement') body = imgHtml + '<span class="preview-q">' + (data.titre || '') + '</span><div class="preview-t">📍' + (data.lieu || '') + ' · ' + (data.date || '') + '<br>' + (data.description || '') + '</div>';
  var photoBtn = data._imgB64 ? '' : '<button class="btn-photo" onclick="addPhotoToPending()">🖼️ Ajouter une photo (optionnel)</button>';
  var pv = document.createElement('div');
  pv.className = 'preview';
  pv.innerHTML = '<div class="preview-head">Aperçu · ' + data.type + '</div><div class="preview-body">' + body + '</div><div class="preview-acts">' + photoBtn + '<div class="preview-row"><button class="btn-cancel" onclick="cancelPub()">Modifier</button><button class="btn-pub" onclick="confirmPub()">Publier ✓</button></div></div>';
  last.appendChild(pv);
  msgsEl.scrollTop = msgsEl.scrollHeight;
  pending = data;
}

function cancelPub() {
  pending = null;
  addMsg('ia', "D'accord, dis-moi ce que tu veux changer.");
}

function detectAndShow(fullText, tel) {
  var ft = fullText.trim();
  if (ft.indexOf('"publier"') >= 0 && ft.indexOf('"type"') >= 0) {
    var s = ft.indexOf('{');
    var e = ft.lastIndexOf('}');
    if (s >= 0 && e > s) {
      try {
        var pd = JSON.parse(ft.slice(s, e + 1));
        if (!pd.action) pd.action = 'publier';
        if (pd.action === 'publier' && pd.type) {
          if (pendingImg) { pd._imgB64 = pendingImg.b64data; pd._imgMime = pendingImg.mime; pendingImg = null; }
          tel.textContent = '';
          if (!profil) { tel.textContent = 'Tout est prêt ! Connecte-toi pour publier.'; }
          else { tel.textContent = "Voilà l'aperçu :"; showPreview(pd); }
          return true;
        }
      } catch(ex) {}
    }
  }
  return false;
}

function uploadImg(b64data, mime) {
  var formData = new FormData();
  formData.append('file', 'data:' + mime + ';base64,' + b64data);
  formData.append('upload_preset', 'cqp_toulouse');
  formData.append('folder', 'site-photos/posts');
  return fetch('https://api.cloudinary.com/v1_1/vzfwtyczqfbhbjzotjft/auto/upload', {
    method: 'POST',
    body: formData
  }).then(function(r) { return r.json(); }).then(function(d) {
    if (d.error) throw new Error(d.error.message);
    return d.secure_url;
  });
}

function confirmPub() {
  if (!profil) { addMsg('ia', 'Connecte-toi pour publier !'); return; }
  if (!pending) return;
  var d = pending; pending = null;
  var pv = document.querySelector('.preview');
  if (pv) pv.remove();
  var uploadPromise = (d._imgB64 && d._imgMime) ? uploadImg(d._imgB64, d._imgMime).catch(function() { return null; }) : Promise.resolve(null);
  uploadPromise.then(function(photoUrl) {
    var p;
    if (d.type === 'post') p = sbc.from('posts').insert({ prenom: profil.prenom, contenu: d.contenu || '', quartier: d.quartier || profil.quartier, session_id: profil.code, profil_code: profil.code, visible: true, photo_url: photoUrl });
    else if (d.type === 'annonce') p = sbc.from('annonces').insert({ prenom: profil.prenom, titre: d.titre, description: d.description || '', categorie: d.categorie || 'Autre', quartier: d.quartier || profil.quartier, profil_code: profil.code, visible: true, validee: true, photo_url: photoUrl || '' });
    else if (d.type === 'evenement') p = sbc.from('evenements').insert({ titre: d.titre, description: d.description || '', lieu: d.lieu || '', date_debut: new Date(d.date || Date.now()).toISOString(), prenom: profil.prenom, profil_code: profil.code, visible: true, validee: true, photo_url: photoUrl || '' });
    return p;
  }).then(function() {
    addMsg('ia', 'Publié ! Ton ' + (pending ? pending.type : 'contenu') + ' est maintenant visible sur CQP.');
  }).catch(function() {
    addMsg('ia', "Erreur lors de la publication, réessaie.");
  });
}

function addPhotoToPending() {
  photoInp.onchange = function(e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    photoInp.value = '';
    var reader = new FileReader();
    reader.onload = function(ev) {
      if (pending) {
        pending._imgB64 = ev.target.result.split(',')[1];
        pending._imgMime = file.type || 'image/jpeg';
        var pv = document.querySelector('.preview');
        if (pv) pv.remove();
        showPreview(pending);
        msgsEl.scrollTop = msgsEl.scrollHeight;
      }
    };
    reader.readAsDataURL(file);
  };
  photoInp.click();
}

function analyzeVision(b64data, mime, userInstruction) {
  var q = profil ? profil.quartier : 'Toulouse';
  var n = profil ? profil.prenom : 'Anonyme';
  var baseInstruction = userInstruction || null
  var QUARTIERS = ['Bellefontaine','Reynerie','Mirail','Grand Mirail','Papus','Empalot','Bagatelle','Faourette','Izards','Arènes','Bourbaki',"Croix d'Aurade"]

  var prompt = [
    '<leila_identity>',
    'Tu es Leila, assistante IA de CQP Toulouse — réseau social des quartiers populaires.',
    'Tu parles à ' + n + ' du quartier ' + q + '.',
    '</leila_identity>',
    '',
    '<tone>',
    'Tu es chaleureuse, directe, naturelle. Français courant, pas formel.',
    'Conversation déjà en cours — pas de salutation.',
    'Une seule question à la fois maximum.',
    '</tone>',
    '',
    '<image_analysis>',
    'Analyse cette image avec attention.',
    baseInstruction
      ? 'DEMANDE DE L\'UTILISATEUR : "' + baseInstruction + '" — réponds précisément à cette demande.'
      : 'Décris ce que tu vois en 1-2 phrases, puis demande ce que l\'utilisateur veut en faire.',
    '',
    'CAPACITÉS :',
    '- Si l\'image contient du texte : extrais-le fidèlement (OCR)',
    '- Si c\'est un flyer/affiche : titre, lieu, date, description',
    '- Identifie le lieu si possible en utilisant ta connaissance de Toulouse',
    '- Quartiers connus : ' + QUARTIERS.join(', '),
    '- Lieux clés : Prairie des Filtres (BBQ autorisés), Halle aux Grains (Saint-Cyprien), Garonne',
    '- Si tu n\'es pas sûre d\'un lieu, dis-le honnêtement — ne jamais inventer',
    '</image_analysis>',
    '',
    '<rules>',
    'Tu ne sors JAMAIS de ton rôle d\'assistante CQP.',
    'JSON uniquement quand l\'utilisateur confirme vouloir publier.',
    'Si l\'utilisateur mentionne un quartier différent du sien, utilise celui-là.',
    'Ne montre JAMAIS le JSON brut — il est traité automatiquement.',
    '</rules>',
    '',
    '<publication_format>',
    'Post: {"action":"publier","type":"post","contenu":"...","quartier":"QUARTIER_DETECTE"}',
    'Annonce: {"action":"publier","type":"annonce","titre":"...","categorie":"Vente|Service|Emploi|Logement|Don|Autre","description":"...","quartier":"QUARTIER_DETECTE"}',
    'Evenement: {"action":"publier","type":"evenement","titre":"...","lieu":"...","date":"2026-06-15","description":"..."}',
    '</publication_format>'
  ].join('\n')

  return fetch(PROXY, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'meta-llama/llama-4-scout-17b-16e-instruct',
      messages: [{ role: 'user', content: [
        { type: 'image_url', image_url: { url: 'data:' + mime + ';base64,' + b64data } },
        { type: 'text', text: prompt }
      ]}],
      max_tokens: 300
    })
  }).then(function(r) { return r.json(); }).then(function(d) {
    return d.choices && d.choices[0] && d.choices[0].message && d.choices[0].message.content || null;
  }).catch(function() { return null; });
}

document.getElementById('clip-btn').addEventListener('click', function() {
  photoInp.onchange = function(e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    photoInp.value = '';
    var reader = new FileReader();
    reader.onload = function(ev) {
      var b64 = ev.target.result;
      var b64data = b64.split(',')[1];
      var mime = file.type || 'image/jpeg';
      // Garder la photo dans la barre — ne pas envoyer direct
      pendingImg = { b64data: b64data, mime: mime };
      // Afficher miniature dans la barre
      var bar = document.getElementById('img-preview-bar');
      if (bar) {
        document.getElementById('img-preview-thumb').src = b64;
        bar.style.display = 'flex';
      }
      sbtn.disabled = false;
      taEl.focus();
      // STOP ici — ne pas analyser ni envoyer
      return;
      var DEAD_CODE = true;
      var tel = addMsg('ia', '');
      tel.classList.add('typing');
      typing = true;
      analyzeVision(b64data, mime).then(function(vtext) {
        tel.classList.remove('typing');
        typing = false;
        if (vtext) {
          var ft = vtext.trim();
          var s = ft.indexOf('{'); var e2 = ft.lastIndexOf('}');
          if (s >= 0 && e2 > s) {
            try {
              var pd = JSON.parse(ft.slice(s, e2 + 1));
              if (!pd.action) pd.action = 'publier';
              if (pd.action === 'publier' && pd.type) {
                pd._imgB64 = b64data; pd._imgMime = mime; pendingImg = null;
                tel.textContent = "J'ai analysé l'image, voilà l'aperçu :";
                showPreview(pd); return;
              }
            } catch(ex) {}
          }
        }
        tel.textContent = 'Image reçue ! Dis-moi ce que tu veux en faire.';
      });
    };
    reader.readAsDataURL(file);
  };
  photoInp.click();
});

taEl.addEventListener('input', function() { sbtn.disabled = !taEl.value.trim(); });
taEl.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (!sbtn.disabled && !typing) doSend(); }
});
taEl.addEventListener('input', function() { taEl.style.height = 'auto'; taEl.style.height = Math.min(taEl.scrollHeight, 120) + 'px'; });

document.getElementById('card-evt').addEventListener('click', function() { qaClick('evenement'); });
document.getElementById('card-ann').addEventListener('click', function() { qaClick('annonce'); });
document.getElementById('card-post').addEventListener('click', function() { qaClick('post'); });
sbtn.addEventListener('click', function() { doSend(); });

function qaClick(type) {
  cardsEl.style.display = 'none';
  var m = { post: 'je veux publier un post', annonce: 'je veux créer une annonce', evenement: 'je veux proposer un événement' };
  taEl.value = m[type]; sbtn.disabled = false; doSend();
}

function doSend() {
  var txt = taEl.value.trim();
  if (!txt || typing) return;
  taEl.value = ''; taEl.style.height = 'auto'; sbtn.disabled = true;
  cardsEl.style.display = 'none';
  typing = true;
  // Afficher le message + photo dans le chat
  if (pendingImg) {
    var b64url = 'data:' + pendingImg.mime + ';base64,' + pendingImg.b64data;
    hideEmpty();
    cardsEl.style.display = 'none';
    var imgDiv = document.createElement('div');
    imgDiv.className = 'msg';
    var av2 = profil ? profil.prenom[0].toUpperCase() : '?';
    var name2 = profil ? profil.prenom : 'Toi';
    imgDiv.innerHTML = '<div class="av user">' + av2 + '</div><div class="mbody"><div class="mname">' + name2 + '</div>'
      + (txt ? '<div class="mtext">' + txt + '</div>' : '')
      + '<img src="' + b64url + '" style="max-width:100%;border-radius:12px;margin-top:6px;max-height:200px;object-fit:contain;"></div>';
    msgsEl.appendChild(imgDiv);
    msgsEl.scrollTop = msgsEl.scrollHeight;
    var bar2 = document.getElementById('img-preview-bar');
    if (bar2) bar2.style.display = 'none';
    hist.push({ role: 'user', content: (txt ? txt + '\n' : '') + '[Photo jointe - décrire et demander quoi faire]' });
  } else {
    addMsg('user', txt);
    hist.push({ role: 'user', content: txt });
  }
  // Si photo jointe, analyser avec vision avant d'envoyer à Groq
  if (pendingImg) {
    var imgB64 = pendingImg.b64data;
    var imgMime = pendingImg.mime;
    pendingImg = null;
    typing = true;
    var tel2 = addMsg('ia', '');
    tel2.classList.add('typing');
    analyzeVision(imgB64, imgMime, txt || null).then(function(desc) {
      var visionMsg = desc || 'Image reçue.';
      tel2.classList.remove('typing');
      // Vérifier si c'est un JSON de publication
      var ft = visionMsg.trim()
      var s = ft.indexOf('{'); var e2 = ft.lastIndexOf('}');
      if (s >= 0 && e2 > s) {
        try {
          var pd = JSON.parse(ft.slice(s, e2+1));
          if (pd.action === 'publier' && pd.type) {
            pd._imgB64 = imgB64; pd._imgMime = imgMime;
            tel2.textContent = "Voilà l'aperçu :";
            hist.push({ role: 'assistant', content: tel2.textContent });
            showPreview(pd);
            typing = false;
            return;
          }
        } catch(ex) {}
      }
      tel2.textContent = visionMsg;
      hist.push({ role: 'assistant', content: visionMsg });
      typing = false;
    });
    return;
  }
  var tel = addMsg('ia', '');
  tel.classList.add('typing');
  fetch(PROXY, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ model: 'llama-3.3-70b-versatile', messages: [{ role: 'system', content: getSYS() }].concat(hist), max_tokens: 300, temperature: 0.5, stream: true })
  }).then(function(res) {
    tel.classList.remove('typing'); tel.textContent = '';
    var reader = res.body.getReader(); var dec = new TextDecoder(); var full = '';
    function read() {
      return reader.read().then(function(chunk) {
        if (chunk.done) {
          hist.push({ role: 'assistant', content: full });
          if (!detectAndShow(full, tel)) {}
          typing = false;
          return;
        }
        var lines = dec.decode(chunk.value).split('\n').filter(function(l) { return l.indexOf('data: ') === 0; });
        lines.forEach(function(line) {
          var d = line.slice(6); if (d === '[DONE]') return;
          try { var delta = JSON.parse(d).choices[0].delta.content || ''; full += delta; tel.textContent = full; msgsEl.scrollTop = msgsEl.scrollHeight; } catch(ex) {}
        });
        return read();
      });
    }
    return read();
  }).catch(function() { tel.classList.remove('typing'); tel.textContent = "Erreur, réessaie."; typing = false; });
}

init();
</script>
