<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>IA — CQP</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/app.js?v=20260603"></script>
<script src="/js/auth.js?v=20260603"></script>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: #fff; font-family: -apple-system, system-ui, sans-serif; overflow: hidden; }

.ia-wrap { display: flex; flex-direction: column; height: 100dvh; }

/* TOPBAR */
.ia-top {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px;
  border-bottom: 0.5px solid #eff3f4;
  background: #fff; flex-shrink: 0;
}
.ia-back { background: none; border: none; cursor: pointer; padding: 4px; display: flex; align-items: center; }
.ia-brand { display: flex; align-items: center; gap: 8px; }
.ia-logo { width: 28px; height: 28px; background: #C8102E; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.ia-name { font-size: 15px; font-weight: 700; color: #0f1419; }
.ia-user-badge {
  font-size: 12px; color: #536471; background: #f7f9f9;
  border: 0.5px solid #e4e6eb; border-radius: 20px;
  padding: 4px 10px; display: flex; align-items: center; gap: 5px;
}
.ia-user-dot { width: 6px; height: 6px; border-radius: 50%; background: #00ba7c; }

/* MESSAGES ZONE */
.ia-messages {
  flex: 1; overflow-y: auto; padding: 0 0 8px;
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
}

/* ÉTAT VIDE — style ChatGPT */
.ia-empty {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  height: 100%; padding: 32px 24px 0;
  text-align: center;
}
.ia-empty-logo { width: 48px; height: 48px; background: #C8102E; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
.ia-empty-title { font-size: 24px; font-weight: 700; color: #0f1419; margin-bottom: 8px; line-height: 1.3; }
.ia-empty-sub { font-size: 14px; color: #536471; margin-bottom: 32px; }

/* Messages */
.msg { padding: 16px 16px 0; display: flex; gap: 10px; align-items: flex-start; animation: fadeUp .2s ease; }
@keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
.msg-av { width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; }
.msg-av.ia { background: #C8102E; }
.msg-av.user { background: #e4e6eb; color: #536471; font-size: 14px; }
.msg-body { flex: 1; min-width: 0; padding-bottom: 12px; border-bottom: 0.5px solid #eff3f4; }
.msg:last-child .msg-body { border-bottom: none; }
.msg-meta { font-size: 13px; font-weight: 700; color: #0f1419; margin-bottom: 4px; }
.msg-text { font-size: 15px; color: #0f1419; line-height: 1.55; white-space: pre-wrap; }
.msg-text.typing::after { content: '▋'; animation: blink .7s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

/* APERÇU DE PUBLICATION */
.pub-preview {
  margin-top: 12px; border: 1px solid #e4e6eb; border-radius: 12px;
  overflow: hidden; background: #f7f9f9;
}
.pub-preview-head {
  padding: 10px 14px; background: #fff; border-bottom: 0.5px solid #e4e6eb;
  font-size: 11px; font-weight: 700; color: #536471; text-transform: uppercase; letter-spacing: 1px;
}
.pub-preview-body { padding: 12px 14px; }
.pub-preview-quartier { font-size: 15px; font-weight: 800; color: #0f1419; }
.pub-preview-prenom { font-size: 13px; color: #536471; margin-left: 6px; }
.pub-preview-text { font-size: 14px; color: #0f1419; margin-top: 6px; line-height: 1.5; }
.pub-preview-actions { display: flex; gap: 8px; padding: 10px 14px; border-top: 0.5px solid #e4e6eb; }
.pub-btn-ok {
  flex: 1; background: #C8102E; color: #fff; border: none;
  border-radius: 8px; padding: 10px; font-size: 14px; font-weight: 700;
  cursor: pointer; font-family: inherit;
}
.pub-btn-ok:active { opacity: .85; }
.pub-btn-cancel {
  flex: 1; background: none; color: #536471; border: 1px solid #e4e6eb;
  border-radius: 8px; padding: 10px; font-size: 14px; font-weight: 600;
  cursor: pointer; font-family: inherit;
}

/* ACTIONS + */
.ia-actions {
  display: none; flex-direction: column; gap: 2px;
  padding: 8px; background: #fff;
  border: 0.5px solid #e4e6eb; border-radius: 14px;
  margin: 0 12px 8px; box-shadow: 0 4px 16px rgba(0,0,0,.08);
}
.ia-actions.open { display: flex; }
.ia-action-btn {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; border: none; background: none;
  border-radius: 10px; cursor: pointer; font-family: inherit;
  text-align: left; font-size: 15px; color: #0f1419;
  transition: background .1s;
}
.ia-action-btn:active { background: #f0f2f5; }
.ia-action-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; flex-shrink: 0; }

/* INPUT */
.ia-input-zone { padding: 8px 12px; padding-bottom: max(12px, env(safe-area-inset-bottom)); background: #fff; flex-shrink: 0; }
.ia-input-box {
  display: flex; align-items: flex-end; gap: 8px;
  border: 1px solid #e4e6eb; border-radius: 24px;
  padding: 8px 8px 8px 14px; background: #f7f9f9;
  transition: border-color .15s, background .15s;
}
.ia-input-box:focus-within { border-color: #C8102E; background: #fff; }
.ia-plus {
  width: 32px; height: 32px; border-radius: 50%; background: none;
  border: 1px solid #e4e6eb; cursor: pointer; display: flex;
  align-items: center; justify-content: center; flex-shrink: 0;
  transition: background .1s; margin-bottom: 2px;
}
.ia-plus:active { background: #f0f2f5; }
.ia-textarea {
  flex: 1; border: none; background: none; outline: none; resize: none;
  font-size: 15px; font-family: inherit; color: #0f1419; line-height: 1.4;
  max-height: 100px; overflow-y: auto; padding: 4px 0;
}
.ia-textarea::placeholder { color: #8b98a5; }
.ia-send {
  width: 32px; height: 32px; border-radius: 50%; background: #0f1419;
  border: none; cursor: pointer; display: flex; align-items: center;
  justify-content: center; flex-shrink: 0; transition: opacity .15s;
}
.ia-send:disabled { opacity: .3; }
.ia-send:active { opacity: .7; }
</style>
</head>
<body>
<div class="ia-wrap">

  <!-- TOPBAR -->
  <div class="ia-top">
    <button class="ia-back" onclick="history.back()">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#0f1419" stroke-width="2" stroke-linecap="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </button>
    <div class="ia-brand">
      <div class="ia-logo">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><path d="M12 2a10 10 0 1 0 10 10"/><path d="M12 6v6l4 2"/></svg>
      </div>
      <span class="ia-name">CQP IA</span>
    </div>
    <div class="ia-user-badge" id="user-badge" style="display:none;">
      <div class="ia-user-dot"></div>
      <span id="user-name">...</span>
    </div>
    <div style="width:60px;" id="connect-btn-wrap">
      <button onclick="window.location.href='profil.html'" style="background:none;border:0.5px solid #e4e6eb;border-radius:20px;padding:5px 12px;font-size:12px;color:#0f1419;cursor:pointer;font-family:inherit;font-weight:600;">Connexion</button>
    </div>
  </div>

  <!-- MESSAGES -->
  <div class="ia-messages" id="messages">
    <div class="ia-empty" id="empty-state">
      <div class="ia-empty-logo">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M12 2a10 10 0 1 0 10 10"/><path d="M12 6v6l4 2"/></svg>
      </div>
      <div class="ia-empty-title">Par quoi<br>commençons-nous ?</div>
      <div class="ia-empty-sub">Dis-moi ce que tu veux faire,<br>je m'occupe du reste.</div>
    </div>
  </div>

  <!-- ACTIONS + -->
  <div class="ia-actions" id="actions-menu">
    <button class="ia-action-btn" onclick="quickAction('post')">
      <div class="ia-action-icon" style="background:#fff0f2;">💬</div>
      <div><div style="font-weight:600;">Publier un post</div><div style="font-size:13px;color:#536471;">Texte, photo, vidéo</div></div>
    </button>
    <button class="ia-action-btn" onclick="quickAction('annonce')">
      <div class="ia-action-icon" style="background:#fff3e0;">📋</div>
      <div><div style="font-weight:600;">Déposer une annonce</div><div style="font-size:13px;color:#536471;">Vente, service, emploi…</div></div>
    </button>
    <button class="ia-action-btn" onclick="quickAction('evenement')">
      <div class="ia-action-icon" style="background:#e8f0fe;">📅</div>
      <div><div style="font-weight:600;">Proposer un événement</div><div style="font-size:13px;color:#536471;">Activité, sortie, réunion…</div></div>
    </button>
  </div>

  <!-- INPUT -->
  <div class="ia-input-zone">
    <div class="ia-input-box">
      <button class="ia-plus" id="plus-btn" onclick="toggleActions()">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#536471" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
      <textarea class="ia-textarea" id="input" placeholder="Pose une question ou dis-moi ce que tu veux faire…" rows="1"
        oninput="autoResize(this)" onkeydown="handleKey(event)"></textarea>
      <button class="ia-send" id="send-btn" onclick="sendMessage()" disabled>
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
const PROXY = 'https://rlrazcitmwxfaxlnnfau.supabase.co/functions/v1/groq-proxy'
const SUPABASE_URL = 'https://rlrazcitmwxfaxlnnfau.supabase.co'
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJscmF6Y2l0bXd4ZmF4bG5uZmF1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDc1OTAzMjMsImV4cCI6MjA2MzE2NjMyM30.V7Y-HJjHMtdSaO9MnWSnbFNmMnbqGqY8RMvRNHxqVMM'

let profil = null
let history = []
let isTyping = false
let pendingPublication = null
let actionsOpen = false

const messagesEl = document.getElementById('messages')
const inputEl = document.getElementById('input')
const sendBtn = document.getElementById('send-btn')
const emptyEl = document.getElementById('empty-state')
const actionsEl = document.getElementById('actions-menu')

// Initialiser Supabase et vérifier connexion
const sbc = supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

async function init() {
  const code = localStorage.getItem('cqp_code') || localStorage.getItem('profil_code')
  if (code) {
    const { data } = await sbc.from('profils').select('*').eq('code', code).single()
    if (data) {
      profil = data
      document.getElementById('user-badge').style.display = 'flex'
      document.getElementById('user-name').textContent = data.prenom
      document.getElementById('connect-btn-wrap').style.display = 'none'
    }
  }
}

const SYSTEM = () => {
  const userInfo = profil
    ? `Utilisateur connecte: ${profil.prenom}, quartier: ${profil.quartier || 'Toulouse'}.`
    : "Utilisateur non connecte: peut discuter mais pas publier."
  return `Tu es l'assistant IA de CQP, un reseau social de quartier a Toulouse. Tu aides a creer des posts, annonces et evenements.
${userInfo}

REGLES STRICTES:
- Repenses court et naturel, max 2 phrases.
- Pose une seule question a la fois si besoin.
- Quand tu as assez d'infos, reponds UNIQUEMENT avec le JSON, rien d'autre.
- Ne montre JAMAIS le JSON dans tes messages. Ne dis jamais que tu vas generer un JSON.

Quand pret a publier, reponds UNIQUEMENT avec ce JSON exact (pas de texte avant ni apres):
Pour post: {"action":"publier","type":"post","contenu":"...","quartier":"..."}
Pour annonce: {"action":"publier","type":"annonce","titre":"...","categorie":"Vente","description":"...","quartier":"..."}
Pour evenement: {"action":"publier","type":"evenement","titre":"...","lieu":"...","date":"2026-06-10","description":"..."}

Infos minimales: post=contenu, annonce=titre+description, evenement=titre+date.`
}
