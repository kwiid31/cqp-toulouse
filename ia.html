<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#f0ede6">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>IA CQP</title>
<link rel="stylesheet" href="css/main.css">
<style>
html,body{height:100%;background:#f0ede6;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.wrap{display:flex;flex-direction:column;height:100%;height:100dvh;max-height:-webkit-fill-available;background:#f0ede6}

/* Topbar */
.ia-top{display:flex;justify-content:space-between;align-items:center;
  padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));flex-shrink:0}
.back-btn{background:none;border:none;cursor:pointer;padding:4px;color:#888;line-height:0}
.badge{display:none;align-items:center;gap:6px;font-size:13px;font-weight:500;
  background:#f0f0f0;padding:4px 10px;border-radius:20px}
.dot{width:8px;height:8px;border-radius:50%;background:#22c55e}
.conn-btn{font-size:13px;color:#888;background:none;border:none;cursor:pointer;padding:4px 8px}

/* Zone messages */
.msgs{flex:1;overflow-y:auto;padding:16px 16px 8px;display:flex;flex-direction:column;
  gap:16px;background:#f0ede6;scroll-behavior:smooth}

/* Ecran vide */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;
  flex:1;text-align:center;padding:24px;background:#f0ede6}
.empty h1{font-size:26px;font-weight:400;color:#1c1a17;margin:16px 0 8px;
  font-family:Georgia,serif;letter-spacing:-.3px}
.empty p{font-size:14px;color:#9a9080;font-style:italic;line-height:1.5}

/* Cards */
.cards-zone{display:flex;gap:10px;padding:0 16px 12px;overflow-x:auto;
  flex-shrink:0;scrollbar-width:none;background:#f0ede6}
.cards-zone::-webkit-scrollbar{display:none}
.card{flex-shrink:0;width:130px;border:1px solid #e8e2d9;border-radius:14px;
  padding:14px;cursor:pointer;background:#fff;transition:background .15s}
.card:active{background:#f5f0e8}
.card svg{margin-bottom:8px;color:#555}
.card p{font-size:13px;font-weight:500;color:#1a1a1a;margin:0;line-height:1.3}

/* Messages */
.msg{display:flex;gap:10px;animation:up .2s ease}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.av{width:32px;height:32px;border-radius:50%;flex-shrink:0;display:flex;
  align-items:center;justify-content:center;font-size:13px;font-weight:600}
.av.ia{background:#C8102E}
.av.user{background:#e8e3db;color:#555}
.mbody{flex:1;min-width:0}
.mname{font-size:12px;font-weight:600;color:#888;margin-bottom:4px}
.mtext{font-size:15px;color:#1a1a1a;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.typing::after{content:'●●●';animation:blink 1s infinite;font-size:18px;color:#C8102E;letter-spacing:4px}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}

/* Preview publication */
.preview-card{background:#fff;border:1.5px solid #C8102E;border-radius:14px;
  padding:14px;margin-top:8px;font-size:14px}
.preview-card h4{margin:0 0 8px;font-size:13px;color:#C8102E;text-transform:uppercase;letter-spacing:.5px}
.preview-card p{margin:0 0 4px;color:#333;line-height:1.4}
.preview-btns{display:flex;gap:8px;margin-top:12px}
.btn-pub{background:#C8102E;color:#fff;border:none;border-radius:8px;
  padding:8px 16px;font-size:14px;font-weight:600;cursor:pointer;flex:1}
.btn-cancel{background:#f0f0f0;color:#555;border:none;border-radius:8px;
  padding:8px 16px;font-size:14px;cursor:pointer}

/* Zone saisie */
.input-zone{padding:10px 16px;padding-bottom:max(14px,env(safe-area-inset-bottom));
  background:#f0ede6;flex-shrink:0}
.input-box{display:flex;align-items:flex-end;gap:10px;border:.5px solid #ddd8d0;
  border-radius:16px;padding:12px 14px;background:#fff;
  box-shadow:0 1px 4px rgba(0,0,0,.06)}
.clip-btn{background:none;border:none;cursor:pointer;padding:2px;color:#aaa;line-height:0;flex-shrink:0}
textarea{flex:1;border:none;background:none;outline:none;resize:none;
  font-size:16px;font-family:inherit;color:#1a1a1a;max-height:120px;line-height:1.4}
textarea::placeholder{color:#a09585}
.send-btn{width:36px;height:36px;border-radius:50%;background:#C8102E;border:none;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;opacity:.4;transition:opacity .15s}
.send-btn.active{opacity:1}

/* Image preview dans barre */
.img-preview-bar{display:none;padding:8px 16px 0;background:#f0ede6}
.img-thumb{position:relative;display:inline-block}
.img-thumb img{width:72px;height:72px;object-fit:cover;border-radius:10px}
.img-thumb button{position:absolute;top:-6px;right:-6px;width:20px;height:20px;
  border-radius:50%;background:#333;color:#fff;border:none;cursor:pointer;
  font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<div class="wrap">

  <!-- Topbar -->
  <div class="ia-top">
    <button class="back-btn" onclick="history.back()">

  <!-- Cards -->

      <p>Créer un événement</p>

      <p>Créer une annonce</p>

    <div class="card" onclick="setMsg('Je veux publier un post')">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>

  <!-- Preview image -->
  <div class="img-preview-bar" id="img-preview-bar">
    <div class="img-thumb">

  <!-- Zone saisie -->
  <div class="input-zone">
    <div class="input-box">
      <button class="clip-btn" id="clip-btn" aria-label="Ajouter une photo">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
      </button>
      <textarea id="ta" rows="1" placeholder="Discuter avec Leila…"></textarea>
      <button class="send-btn" id="sbtn" aria-label="Envoyer">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="white"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
      </button>
    </div>

</div>

<input type="file" id="file-input" accept="image/*" style="display:none">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
// ═══════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════
var SB_URL = 'https://rlrazcitmwxfaxlnnfau.supabase.co'
var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJscmF6Y2l0bXd4ZmF4bG5uZmF1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5NTI3NDUsImV4cCI6MjA5NTUyODc0NX0.0SSaUUq4x_-Slr4QJ3XJlF0mu0Ub_-ouXD3EC2-PGG0'
var PROXY = 'https://rlrazcitmwxfaxlnnfau.supabase.co/functions/v1/groq-proxy'
var TAVILY = 'https://rlrazcitmwxfaxlnnfau.supabase.co/functions/v1/tavily-proxy'
var CLOUDINARY = 'https://api.cloudinary.com/v1_1/dbpe9xree/image/upload'
var CLOUD_PRESET = 'cqp_toulouse'
var MODEL = 'deepseek-r1-distill-llama-70b'

// ═══════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════
var sbc = supabase.createClient(SB_URL, SB_KEY)
var profil = null
var hist = []
var typing = false
var pendingImg = null

// ═══════════════════════════════════════════
// DOM
// ═══════════════════════════════════════════
var msgsEl = document.getElementById('msgs')
var taEl = document.getElementById('ta')
var sbtn = document.getElementById('sbtn')
var cardsEl = document.getElementById('cards-zone')
var emptyEl = document.getElementById('empty')

// ═══════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════
function init() {
  var code = localStorage.getItem('cqp_code') || localStorage.getItem('profil_code') || localStorage.getItem('code')
  if (!code) return
  sbc.from('profils').select('*').eq('code', code).maybeSingle().then(function(res) {
    if (res.data) {
      profil = res.data
      document.getElementById('badge').style.display = 'flex'
      document.getElementById('uname').textContent = res.data.prenom
      document.getElementById('connbtn').style.display = 'none'
      var t = document.getElementById('empty-title')
      if (t) t.textContent = 'Le retour de ' + res.data.prenom + ' !'
    }
  })
}
init()

// ═══════════════════════════════════════════
// PROMPT (Couche 2)
// ═══════════════════════════════════════════
function getSYS() {
  var prenom = profil ? profil.prenom : null
  var quartier = profil ? (profil.quartier || 'Toulouse') : 'Toulouse'
  var debut = hist.length === 0
  return 'Tu es Leila, assistante IA de CQP Toulouse — réseau social des quartiers populaires.'
    + (prenom ? ' Tu parles à ' + prenom + ' du quartier ' + quartier + '.' : '')
    + ' Réponds en français, naturel et direct, 1-3 phrases max.'
    + (debut ? ' Accueil chaleureux en une phrase.' : ' Pas de re-salutation.')
    + ' Quartiers connus : Bellefontaine, Reynerie, Mirail, Papus, Empalot, Bagatelle, Faourette, Izards, Arènes, Bourbaki.'
    + ' Si tu ne sais pas quelque chose, dis-le sans inventer.'
    + ' JSON publication uniquement si confirmé par l\'utilisateur :'
    + ' Post: {"action":"publier","type":"post","contenu":"...","quartier":"' + quartier + '"}'
    + ' Annonce: {"action":"publier","type":"annonce","titre":"...","categorie":"Vente|Service|Emploi|Logement|Don|Autre","description":"...","quartier":"' + quartier + '"}'
    + ' Evenement: {"action":"publier","type":"evenement","titre":"...","lieu":"...","date":"2026-06-15","description":"..."}'
}

// ═══════════════════════════════════════════
// OUTILS (Couche 4)
// ═══════════════════════════════════════════
function needsSearch(txt) {
  var t = txt.toLowerCase()
  var keywords = ['événement','evenement','agenda','concert','marché','fête','animation',
    'infirmier','médecin','docteur','dentiste','pharmacie','urgence',
    'kebab','restaurant','épicerie','commerce','horaire','adresse','téléphone',
    'association','aide','logement','transport','métro','bus','école',
    'actualité','actualite','info','quoi faire','que faire','sortie']
  return t.length > 10 && keywords.some(function(k){ return t.includes(k) })
}

function needsFeedSearch(txt) {
  var t = txt.toLowerCase()
  var keywords = ['post','feed','habitant','dit','parle','trouve','cherche',
    'dernier','discussion','avis','opinion','témoignage']
  return keywords.some(function(k){ return t.includes(k) })
}

async function searchWeb(query) {
  try {
    var quartier = profil ? (profil.quartier || '') : ''
    var q = query + (quartier ? ' ' + quartier : '') + ' Toulouse'
    var res = await fetch(TAVILY, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({query: q, max_results: 3, country: 'France'})
    })
    var data = await res.json()
    if (!data.results || !data.results.length) return null
    return data.results.map(function(r) {
      return '[' + r.title + '] ' + r.content.slice(0, 200)
    }).join('\n')
  } catch(e) { return null }
}

async function searchFeed(query) {
  try {
    var terms = query.toLowerCase().split(' ').filter(function(w){ return w.length > 2 })
    var res = await sbc.from('posts').select('prenom,quartier,contenu,created_at')
      .eq('visible', true).order('created_at', {ascending: false}).limit(100)
    if (!res.data || !res.data.length) return null
    var matches = res.data.filter(function(p) {
      var txt = (p.contenu || '').toLowerCase()
      return terms.some(function(t){ return txt.includes(t) })
    }).slice(0, 5)
    if (!matches.length) return null
    return 'Posts CQP :\n' + matches.map(function(p) {
      return '- ' + p.prenom + ' (' + (p.quartier||'?') + ') : ' + p.contenu.slice(0, 150)
    }).join('\n')
  } catch(e) { return null }
}

// ═══════════════════════════════════════════
// MESSAGES
// ═══════════════════════════════════════════
function hideEmpty() {
  if (emptyEl) emptyEl.style.display = 'none'
}

function addMsg(role, txt) {
  hideEmpty()
  var isIA = role === 'ia'
  var d = document.createElement('div')
  d.className = 'msg'
  var av = isIA
    ? '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><path d="M12 2a10 10 0 1 0 10 10"/><path d="M12 6v6l4 2"/></svg>'
    : (profil ? profil.prenom[0].toUpperCase() : '?')
  var name = isIA ? 'CQP IA' : (profil ? profil.prenom : 'Toi')
  d.innerHTML = '<div class="av ' + (isIA ? 'ia' : 'user') + '">' + av + '</div>'
    + '<div class="mbody"><div class="mname">' + name + '</div>'
    + '<div class="mtext">' + (txt || '') + '</div></div>'
  msgsEl.appendChild(d)
  msgsEl.scrollTop = msgsEl.scrollHeight
  return d.querySelector('.mtext')
}

// ═══════════════════════════════════════════
// DETECTION ET PUBLICATION
// ═══════════════════════════════════════════
function detectAndShow(txt, el) {
  var s = txt.indexOf('{'), e = txt.lastIndexOf('}')
  if (s < 0 || e <= s) return false
  try {
    var pd = JSON.parse(txt.slice(s, e+1))
    if (pd.action === 'publier' && pd.type) {
      el.textContent = ''
      showPreview(pd, el)
      return true
    }
  } catch(ex) {}
  return false
}

function showPreview(pd, el) {
  var container = el || document.createElement('div')
  var type = pd.type === 'post' ? 'Post' : pd.type === 'annonce' ? 'Annonce' : 'Événement'
  var preview = document.createElement('div')
  preview.className = 'preview-card'
  preview.innerHTML = '<h4>' + type + '</h4>'
    + '<p>' + (pd.contenu || pd.description || pd.titre || '') + '</p>'
    + (pd.lieu ? '<p>📍 ' + pd.lieu + '</p>' : '')
    + (pd.date ? '<p>📅 ' + pd.date + '</p>' : '')
    + '<div class="preview-btns">'
    + '<button class="btn-pub" onclick="publish(' + JSON.stringify(JSON.stringify(pd)) + ')">Publier</button>'
    + '<button class="btn-cancel" onclick="this.closest(\'.preview-card\').remove()">Annuler</button>'
    + '</div>'
  container.appendChild(preview)
  if (!el) msgsEl.appendChild(container)
  msgsEl.scrollTop = msgsEl.scrollHeight
}

async function publish(pdStr) {
  var pd = JSON.parse(pdStr)
  try {
    var table = pd.type === 'post' ? 'posts' : pd.type === 'annonce' ? 'annonces' : 'evenements'
    var row = {visible: true, profil_id: profil ? profil.id : null}
    if (pd.type === 'post') { row.contenu = pd.contenu; row.quartier = pd.quartier }
    else if (pd.type === 'annonce') { row.titre = pd.titre; row.description = pd.description; row.categorie = pd.categorie; row.quartier = pd.quartier }
    else { row.titre = pd.titre; row.lieu = pd.lieu; row.date_debut = pd.date; row.description = pd.description }
    var res = await sbc.from(table).insert(row)
    if (!res.error) {
      addMsg('ia', '✅ Publié avec succès !')
    } else {
      addMsg('ia', 'Erreur lors de la publication.')
    }
  } catch(e) { addMsg('ia', 'Erreur : ' + e.message) }
}

// ═══════════════════════════════════════════
// VISION (analyzeVision)
// ═══════════════════════════════════════════
function analyzeVision(b64, mime, userMsg) {
  var n = profil ? profil.prenom : 'l\'utilisateur'
  var q = profil ? (profil.quartier || 'Toulouse') : 'Toulouse'
  var prompt = 'Tu es Leila, assistante IA de CQP Toulouse. Tu parles à ' + n + ' du quartier ' + q + '.'
    + ' Analyse cette image et réponds en français naturel et court.'
    + (userMsg ? ' L\'utilisateur demande : "' + userMsg + '"' : ' Décris ce que tu vois en 1-2 phrases, demande ce qu\'il veut en faire.')
    + ' Si publication : {"action":"publier","type":"post|annonce|evenement","contenu":"...","quartier":"' + q + '"}'

  return fetch(PROXY, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      model: 'meta-llama/llama-4-scout-17b-16e-instruct',
      messages: [{role: 'user', content: [
        {type: 'image_url', image_url: {url: 'data:' + mime + ';base64,' + b64}},
        {type: 'text', text: prompt}
      ]}],
      max_tokens: 300,
      temperature: 0.3
    })
  }).then(function(r){ return r.json() })
    .then(function(d){ return d.choices && d.choices[0] ? d.choices[0].message.content : 'Image analysée.' })
    .catch(function(){ return 'Impossible d\'analyser l\'image.' })
}

// ═══════════════════════════════════════════
// ENVOI MESSAGE
// ═══════════════════════════════════════════
async function doSend() {
  var txt = taEl.value.trim()
  if (!txt && !pendingImg) return
  if (typing) return
  taEl.value = ''
  taEl.style.height = 'auto'
  sbtn.disabled = true
  sbtn.classList.remove('active')
  cardsEl.style.display = 'none'
  typing = true

  // Contexte web et feed (avec timeout 5s)
  var webContext = ''
  var feedContext = ''
  if (txt) {
    if (needsFeedSearch(txt)) {
      try {
        var fr = await Promise.race([searchFeed(txt), new Promise(function(r){ setTimeout(function(){ r(null) }, 5000) })])
        if (fr) feedContext = '\n\n[Posts CQP]\n' + fr
      } catch(e) {}
    }
    if (needsSearch(txt)) {
      try {
        var sr = await Promise.race([searchWeb(txt), new Promise(function(r){ setTimeout(function(){ r(null) }, 5000) })])
        if (sr) webContext = '\n\n[Résultats internet]\n' + sr
      } catch(e) {}
    }
  }

  // Afficher message utilisateur
  if (pendingImg) {
    var b64url = 'data:' + pendingImg.mime + ';base64,' + pendingImg.b64data
    hideEmpty()
    var imgDiv = document.createElement('div')
    imgDiv.className = 'msg'
    var av2 = profil ? profil.prenom[0].toUpperCase() : '?'
    imgDiv.innerHTML = '<div class="av user">' + av2 + '</div>'
      + '<div class="mbody"><div class="mname">' + (profil ? profil.prenom : 'Toi') + '</div>'
      + (txt ? '<div class="mtext">' + txt + '</div>' : '')
      + '<img src="' + b64url + '" style="max-width:100%;border-radius:12px;margin-top:6px;max-height:200px;object-fit:contain;"></div>'
    msgsEl.appendChild(imgDiv)
    msgsEl.scrollTop = msgsEl.scrollHeight
    document.getElementById('img-preview-bar').style.display = 'none'
    hist.push({role: 'user', content: (txt ? txt + '\n' : '') + '[Photo jointe]'})
  } else {
    addMsg('user', txt)
    hist.push({role: 'user', content: txt})
  }

  // Si photo → vision
  if (pendingImg) {
    var imgB64 = pendingImg.b64data
    var imgMime = pendingImg.mime
    pendingImg = null
    var tel2 = addMsg('ia', '')
    tel2.classList.add('typing')
    analyzeVision(imgB64, imgMime, txt || null).then(function(desc) {
      tel2.classList.remove('typing')
      var visionMsg = desc || 'Image reçue.'
      if (!detectAndShow(visionMsg, tel2)) {
        tel2.textContent = visionMsg
      }
      hist.push({role: 'assistant', content: tel2.textContent})
      typing = false
      sbtn.disabled = false
    })
    return
  }

  // Appel Groq texte
  var tel = addMsg('ia', '')
  tel.classList.add('typing')

  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent)
  var useStream = !isIOS

  fetch(PROXY, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      model: MODEL,
      messages: [{role: 'system', content: getSYS() + feedContext + webContext}].concat(hist),
      max_tokens: 300,
      temperature: 0.5,
      stream: useStream
    })
  }).then(function(res) {
    tel.classList.remove('typing')
    tel.textContent = ''
    if (!useStream) {
      // Mode non-streaming pour iOS
      return res.json().then(function(d) {
        var full = d.choices && d.choices[0] ? d.choices[0].message.content || '' : ''
        hist.push({role: 'assistant', content: full})
        if (!detectAndShow(full, tel)) { tel.textContent = full }
        typing = false
        sbtn.disabled = false
      })
    }
    // Mode streaming pour les autres
    var reader = res.body.getReader()
    var dec = new TextDecoder()
    var full = ''
    function read() {
      return reader.read().then(function(chunk) {
        if (chunk.done) {
          hist.push({role: 'assistant', content: full})
          if (!detectAndShow(full, tel)) {}
          typing = false
          sbtn.disabled = false
          return
        }
        var lines = dec.decode(chunk.value).split('\n').filter(function(l){ return l.indexOf('data: ') === 0 })
        lines.forEach(function(line) {
          var d = line.slice(6)
          if (d === '[DONE]') return
          try {
            var delta = JSON.parse(d).choices[0].delta.content || ''
            full += delta
            tel.textContent = full
            msgsEl.scrollTop = msgsEl.scrollHeight
          } catch(ex) {}
        })
        return read()
      })
    }
    return read()
  }).catch(function() {
    tel.classList.remove('typing')
    tel.textContent = 'Désolée, une erreur s\'est produite.'
    typing = false
    sbtn.disabled = false
  })
}

// ═══════════════════════════════════════════
// UI HELPERS
// ═══════════════════════════════════════════
function setMsg(txt) {
  taEl.value = txt
  taEl.dispatchEvent(new Event('input'))
  taEl.focus()
}

function clearImg() {
  pendingImg = null
  document.getElementById('img-preview-bar').style.display = 'none'
}

// Auto-resize textarea
taEl.addEventListener('input', function() {
  this.style.height = 'auto'
  this.style.height = Math.min(this.scrollHeight, 120) + 'px'
  sbtn.classList.toggle('active', this.value.trim().length > 0 || !!pendingImg)
})

taEl.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSend() }
})

sbtn.addEventListener('click', doSend)

// Upload photo
document.getElementById('clip-btn').addEventListener('click', function() {
  document.getElementById('file-input').click()
})

document.getElementById('file-input').addEventListener('change', function(e) {
  var file = e.target.files[0]
  if (!file) return
  var reader = new FileReader()
  reader.onload = function(ev) {
    var result = ev.target.result
    var b64 = result.split(',')[1]
    var mime = file.type
    pendingImg = {b64data: b64, mime: mime}
    var bar = document.getElementById('img-preview-bar')
    document.getElementById('img-thumb-el').src = result
    bar.style.display = 'block'
    sbtn.classList.add('active')
  }
  reader.readAsDataURL(file)
  e.target.value = ''
})
</script>
