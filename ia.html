function needsImageGen(txt) {
  var t = txt.toLowerCase()
  var keywords = ['génère','genere','génerer','crée une image','cree une image',
    'fais une image','fais un flyer','génère une affiche','dessine','illustration',
    'image pour','photo pour','visuel pour']
  return keywords.some(function(k){ return t.includes(k) })
}

// Enrichir la requête pour Tavily
function enrichQuery(query, quartier) {
  var q = query.toLowerCase()
  var enriched = query
  
  // Ajouter le quartier si pas déjà mentionné
  var quartiers = ['bellefontaine','reynerie','mirail','papus','empalot','bagatelle','faourette','izards','arènes']
  var hasQuartier = quartiers.some(function(k){ return q.includes(k) })
  if (!hasQuartier && quartier) enriched += ' ' + quartier

  // Toujours ajouter Toulouse
  if (!q.includes('toulouse')) enriched += ' Toulouse'

  // Ajouter des mots clés selon le type de recherche
  if (q.includes('infirmier') || q.includes('médecin') || q.includes('docteur') || q.includes('dentiste')) {
    enriched += ' téléphone adresse rendez-vous'
  } else if (q.includes('kebab') || q.includes('restaurant') || q.includes('épicerie') || q.includes('bouffe')) {
    enriched += ' adresse horaires ouvert'
  } else if (q.includes('événement') || q.includes('agenda') || q.includes('sortie')) {
    enriched += ' 2026 programme dates'
  } else if (q.includes('association') || q.includes('aide') || q.includes('service')) {
    enriched += ' contact téléphone adresse'
  }
  
  return enriched
}

// Recherche web via Tavily — toutes sources
async function searchWeb(query) {
  try {
    var quartier = profil ? (profil.quartier || '') : ''
    var enriched = enrichQuery(query, quartier)
    var res = await fetch(TAVILY, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query: enriched, max_results: 4, country: 'France' })
    })
    var data = await res.json()
    if (!data.results || !data.results.length) return null
    return data.results.map(function(r) {
      return '[' + r.title + '] ' + r.content.slice(0, 250)
    }).join('\n')
  } catch(e) { return null }
}

// Recherche info quartier Toulouse spécifiquement
async function searchQuartier(quartier) {
  return searchWeb(quartier + ' quartier Toulouse histoire habitants', [
    'wikipedia.org', 'toulouse.fr', 'tactikollectif.org', 'actu.fr'
  ])
}

// Recherche dans le feed CQP
async function searchFeed(query) {
  try {
    var terms = query.toLowerCase().split(' ').filter(function(w) { return w.length > 2 })
    var res = await sbc.from('posts')
      .select('prenom, quartier, contenu, created_at')
      .eq('visible', true)
      .order('created_at', { ascending: false })
      .limit(100)
    if (!res.data || !res.data.length) return null
    var matches = res.data.filter(function(p) {
      var txt = (p.contenu || '').toLowerCase()
      return terms.some(function(t) { return txt.includes(t) })
    }).slice(0, 6)
    if (!matches.length) return null
    return 'POSTS DU RÉSEAU CQP correspondants :\n' + matches.map(function(p) {
      var date = new Date(p.created_at).toLocaleDateString('fr-FR')
      return '- ' + p.prenom + ' (' + (p.quartier||'?') + ') le ' + date + ' : ' + p.contenu.slice(0, 200)
    }).join('\n')
  } catch(e) { return null }
}

function needsSearch(txt) {

  sbc.from('profils').select('*').eq('code', code).maybeSingle().then(function(res) {
    if (res.data) {
      profil = res.data;
      document.getElementById('badge').style.display = 'flex';

    ? '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><path d="M12 2a10 10 0 1 0 10 10"/><path d="M12 6v6l4 2"/></svg>'
    : (profil ? profil.prenom[0].toUpperCase() : '?');
  var name = isIA ? 'CQP IA' : (profil ? profil.prenom : 'Toi');
  d.innerHTML = '<div class="av ' + (isIA ? 'ia' : 'user') + '">' + av + '</div><div class="mbody"><div class="mname">' + name + '</div><div class="mtext">' + txt + '</div></div>';
  msgsEl.appendChild(d);
  msgsEl.scrollTop = msgsEl.scrollHeight;
  return d.querySelector('.mtext');
}

function showPreview(data) {
  var last = msgsEl.querySelector('.msg:last-child .mbody');
  if (!last) return;
  var q = data.quartier || (profil && profil.quartier) || '';
  var p = (profil && profil.prenom) || '';
  var imgHtml = data._imgB64 ? '<img src="data:' + (data._imgMime || 'image/jpeg') + ';base64,' + data._imgB64 + '" style="width:100%;border-radius:8px;margin-bottom:8px;max-height:200px;object-fit:cover;">' : '';
  var body = '';
  if (data.type === 'post') body = imgHtml + '<span class="preview-q">' + q + '</span><span class="preview-p">' + p + '</span><div class="preview-t">' + (data.contenu || '') + '</div>';
  else if (data.type === 'annonce') body = imgHtml + '<span class="preview-q">' + (data.titre || '') + '</span><div class="preview-t">' + (data.categorie || '') + ' · ' + q + '<br>' + (data.description || '') + '</div>';
  else if (data.type === 'evenement') body = imgHtml + '<span class="preview-q">' + (data.titre || '') + '</span><div class="preview-t">📍' + (data.lieu || '') + ' · ' + (data.date || '') + '<br>' + (data.description || '') + '</div>';
  var photoBtn = data._imgB64 ? '' : '<button class="btn-photo" onclick="addPhotoToPending()">🖼️ Ajouter une photo (optionnel)</button>';
  var pv = document.createElement('div');
  pv.className = 'preview';
  pv.innerHTML = '<div class="preview-head">Aperçu · ' + data.type + '</div><div class="preview-body">' + body + '</div><div class="preview-acts">' + photoBtn + '<div class="preview-row"><button class="btn-cancel" onclick="cancelPub()">Modifier</button><button class="btn-pub" onclick="confirmPub()">Publier ✓</button></div></div>';
  last.appendChild(pv);
  msgsEl.scrollTop = msgsEl.scrollHeight;
  pending = data;
}

function cancelPub() {
  pending = null;
  addMsg('ia', "D'accord, dis-moi ce que tu veux changer.");
}

function detectAndShow(fullText, tel) {
  var ft = fullText.trim();
  if (ft.indexOf('"publier"') >= 0 && ft.indexOf('"type"') >= 0) {
    var s = ft.indexOf('{');
    var e = ft.lastIndexOf('}');
    if (s >= 0 && e > s) {
      try {
        var pd = JSON.parse(ft.slice(s, e + 1));
        if (!pd.action) pd.action = 'publier';
        if (pd.action === 'publier' && pd.type) {
          if (pendingImg) { pd._imgB64 = pendingImg.b64data; pd._imgMime = pendingImg.mime; pendingImg = null; }
          tel.textContent = '';
          if (!profil) { tel.textContent = 'Tout est prêt ! Connecte-toi pour publier.'; }
          else { tel.textContent = "Voilà l'aperçu :"; showPreview(pd); }
          return true;
        }
      } catch(ex) {}
    }
  }
  return false;
}

function uploadImg(b64data, mime) {
  var formData = new FormData();
  formData.append('file', 'data:' + mime + ';base64,' + b64data);
  formData.append('upload_preset', 'cqp_toulouse');
  formData.append('folder', 'site-photos/posts');
  return fetch('https://api.cloudinary.com/v1_1/vzfwtyczqfbhbjzotjft/auto/upload', {
    method: 'POST',
    body: formData
  }).then(function(r) { return r.json(); }).then(function(d) {
    if (d.error) throw new Error(d.error.message);
    return d.secure_url;
  });
}

function confirmPub() {
  if (!profil) { addMsg('ia', 'Connecte-toi pour publier !'); return; }
  if (!pending) return;
  var d = pending; pending = null;
  var pv = document.querySelector('.preview');
  if (pv) pv.remove();
  var uploadPromise = (d._imgB64 && d._imgMime) ? uploadImg(d._imgB64, d._imgMime).catch(function() { return null; }) : Promise.resolve(null);
  uploadPromise.then(function(photoUrl) {
    var p;
    if (d.type === 'post') p = sbc.from('posts').insert({ prenom: profil.prenom, contenu: d.contenu || '', quartier: d.quartier || profil.quartier, session_id: profil.code, profil_code: profil.code, visible: true, photo_url: photoUrl });
    else if (d.type === 'annonce') p = sbc.from('annonces').insert({ prenom: profil.prenom, titre: d.titre, description: d.description || '', categorie: d.categorie || 'Autre', quartier: d.quartier || profil.quartier, profil_code: profil.code, visible: true, validee: true, photo_url: photoUrl || '' });
    else if (d.type === 'evenement') p = sbc.from('evenements').insert({ titre: d.titre, description: d.description || '', lieu: d.lieu || '', date_debut: new Date(d.date || Date.now()).toISOString(), prenom: profil.prenom, profil_code: profil.code, visible: true, validee: true, photo_url: photoUrl || '' });
    return p;
  }).then(function() {
    addMsg('ia', 'Publié ! Ton ' + (pending ? pending.type : 'contenu') + ' est maintenant visible sur CQP.');
  }).catch(function() {
    addMsg('ia', "Erreur lors de la publication, réessaie.");
  });
}

function addPhotoToPending() {
  photoInp.onchange = function(e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    photoInp.value = '';
    var reader = new FileReader();
    reader.onload = function(ev) {
      if (pending) {
        pending._imgB64 = ev.target.result.split(',')[1];
        pending._imgMime = file.type || 'image/jpeg';
        var pv = document.querySelector('.preview');
        if (pv) pv.remove();
        showPreview(pending);
        msgsEl.scrollTop = msgsEl.scrollHeight;
      }
    };
    reader.readAsDataURL(file);
  };
  photoInp.click();
}

function analyzeVision(b64data, mime, userInstruction) {
  var q = profil ? profil.quartier : 'Toulouse';
  var n = profil ? profil.prenom : 'Anonyme';
  var baseInstruction = userInstruction || null
  var QUARTIERS = ['Bellefontaine','Reynerie','Mirail','Grand Mirail','Papus','Empalot','Bagatelle','Faourette','Izards','Arènes','Bourbaki',"Croix d'Aurade"]

  var prompt = [
    '<leila_identity>',
    'Tu es Leila, assistante IA de CQP Toulouse — réseau social des quartiers populaires.',
    'Tu parles à ' + n + ' du quartier ' + q + '.',
    '</leila_identity>',
    '',
    '<tone>',
    'Tu es chaleureuse, directe, naturelle. Français courant, pas formel.',
    'Conversation déjà en cours — pas de salutation.',
    'Une seule question à la fois maximum.',
    '</tone>',
    '',
    '<image_analysis>',
    'Analyse cette image avec attention.',
    baseInstruction
      ? 'DEMANDE DE L\'UTILISATEUR : "' + baseInstruction + '" — réponds précisément à cette demande.'
      : 'Décris ce que tu vois en 1-2 phrases, puis demande ce que l\'utilisateur veut en faire.',
    '',
    'CAPACITÉS :',
    '- Si l\'image contient du texte : extrais-le fidèlement (OCR)',
    '- Si c\'est un flyer/affiche : titre, lieu, date, description',
    '- Identifie le lieu si possible en utilisant ta connaissance de Toulouse',
    '- Quartiers connus : ' + QUARTIERS.join(', '),
    '- Lieux clés : Prairie des Filtres (BBQ autorisés), Halle aux Grains (Saint-Cyprien), Garonne',
    '- Si tu n\'es pas sûre d\'un lieu, dis-le honnêtement — ne jamais inventer',
    '</image_analysis>',
    '',
    '<reasoning>',
    'Avant chaque réponse, réfléchis en 3 étapes (ne les affiche pas) :',
    '1. QUE VEUT VRAIMENT L\'UTILISATEUR ? (service, info, publication, discussion...)',
    '2. AI-JE L\'INFO ou dois-je chercher sur internet ou dans le feed CQP ?',
    '3. QUELLE EST LA RÉPONSE LA PLUS COURTE ET UTILE ?',
    'Si service/commerce/lieu → cherche et donne adresse + téléphone directement.',
    'Si actualité → cherche et résume.',
    'Si publication → aide à rédiger.',
    'Ne renvoie JAMAIS vers Google — donne la réponse toi-même.',
    '</reasoning>',
    '<rules>',
    'Tu ne sors JAMAIS de ton rôle d\'assistante CQP.',
    'GROUNDING STRICT : si des résultats web (<web_results>) ou des posts CQP (<cqp_feed>) sont fournis, tu DOIS les utiliser et citer les vraies infos (noms, adresses, téléphones) tels quels dans ta réponse.',
    'Ne jamais inventer ou paraphraser des infos qui sont déjà dans les résultats — recopie-les fidèlement.',
    'JSON uniquement quand l\'utilisateur confirme vouloir publier.',
    'Si l\'utilisateur mentionne un quartier différent du sien, utilise celui-là.',
    'Ne montre JAMAIS le JSON brut — il est traité automatiquement.',
    '</rules>',
    '',
    '<publication_format>',
    'Post: {"action":"publier","type":"post","contenu":"...","quartier":"QUARTIER_DETECTE"}',
    'Annonce: {"action":"publier","type":"annonce","titre":"...","categorie":"Vente|Service|Emploi|Logement|Don|Autre","description":"...","quartier":"QUARTIER_DETECTE"}',
    'Evenement: {"action":"publier","type":"evenement","titre":"...","lieu":"...","date":"2026-06-15","description":"..."}',
    '</publication_format>'
  ].join('\n')

  return fetch(PROXY, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'meta-llama/llama-4-scout-17b-16e-instruct',
      messages: [{ role: 'user', content: [
        { type: 'image_url', image_url: { url: 'data:' + mime + ';base64,' + b64data } },
        { type: 'text', text: prompt }
      ]}],
      max_tokens: 300
    })
  }).then(function(r) { return r.json(); }).then(function(d) {
    return d.choices && d.choices[0] && d.choices[0].message && d.choices[0].message.content || null;
  }).catch(function() { return null; });
}

document.getElementById('clip-btn').addEventListener('click', function() {
  photoInp.onchange = function(e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    photoInp.value = '';
    var reader = new FileReader();
    reader.onload = function(ev) {
      var b64 = ev.target.result;
      var b64data = b64.split(',')[1];
      var mime = file.type || 'image/jpeg';
      // Garder la photo dans la barre — ne pas envoyer direct
      pendingImg = { b64data: b64data, mime: mime };
      // Afficher miniature dans la barre
      var bar = document.getElementById('img-preview-bar');
      if (bar) {
        document.getElementById('img-preview-thumb').src = b64;
        bar.style.display = 'flex';
      }
      sbtn.disabled = false;
      taEl.focus();
      // STOP ici — ne pas analyser ni envoyer
      return;
      var DEAD_CODE = true;
      var tel = addMsg('ia', '');
      tel.classList.add('typing');
      typing = true;
      analyzeVision(b64data, mime).then(function(vtext) {
        tel.classList.remove('typing');
        typing = false;
        if (vtext) {
          var ft = vtext.trim();
          var s = ft.indexOf('{'); var e2 = ft.lastIndexOf('}');
          if (s >= 0 && e2 > s) {
            try {
              var pd = JSON.parse(ft.slice(s, e2 + 1));
              if (!pd.action) pd.action = 'publier';
              if (pd.action === 'publier' && pd.type) {
                pd._imgB64 = b64data; pd._imgMime = mime; pendingImg = null;
                tel.textContent = "J'ai analysé l'image, voilà l'aperçu :";
                showPreview(pd); return;
              }
            } catch(ex) {}
          }
        }
        tel.textContent = 'Image reçue ! Dis-moi ce que tu veux en faire.';
      });
    };
    reader.readAsDataURL(file);
  };
  photoInp.click();
});

taEl.addEventListener('input', function() { sbtn.disabled = !taEl.value.trim(); });
taEl.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (!sbtn.disabled && !typing) doSend(); }
});
taEl.addEventListener('input', function() { taEl.style.height = 'auto'; taEl.style.height = Math.min(taEl.scrollHeight, 120) + 'px'; });

document.getElementById('card-evt').addEventListener('click', function() { qaClick('evenement'); });
document.getElementById('card-ann').addEventListener('click', function() { qaClick('annonce'); });
document.getElementById('card-post').addEventListener('click', function() { qaClick('post'); });
sbtn.addEventListener('click', function() { doSend(); });

function qaClick(type) {
  cardsEl.style.display = 'none';
  var m = { post: 'je veux publier un post', annonce: 'je veux créer une annonce', evenement: 'je veux proposer un événement' };
  taEl.value = m[type]; sbtn.disabled = false; doSend();
}

async function doSend() {
  var txt = taEl.value.trim();
  if (!txt && !pendingImg) return;
  if (typing) return;
  taEl.value = ''; taEl.style.height = 'auto'; sbtn.disabled = true;
  cardsEl.style.display = 'none';
  typing = true;
  
  // Recherche dans le feed CQP
  var feedContext = ''
  if (txt && needsFeedSearch(txt)) {
    try {
      var fr = await searchFeed(txt)
      if (fr) feedContext = '\n\n<cqp_feed>\nPOSTS RÉELS DES HABITANTS DE CQP — cite ces posts directement dans ta réponse :\n' + fr + '\n</cqp_feed>'
    } catch(e) {}
  }

  // Afficher indicateur de recherche
  function showStep(msg) {
    var el = document.createElement('div')
    el.className = 'msg ia-msg search-step'
    el.style.cssText = 'font-size:12px;color:#999;padding:4px 16px;font-style:italic;'
    el.textContent = msg
    msgsEl.appendChild(el)
    msgsEl.scrollTop = msgsEl.scrollHeight
    return el
  }

  // Génération d'image si demandée
  var imageGenerated = null
  if (txt && needsImageGen(txt)) {
    var loadEl = addMsg('ia', '⏳ Je génère l\'image...')
    imageGenerated = await generateImage(txt)
    loadEl.remove()
    if (imageGenerated) {
      // Afficher l'image directement dans le chat
      var imgEl = document.createElement('div')
      imgEl.className = 'msg ia-msg'
      imgEl.innerHTML = '<img src="' + imageGenerated + '" style="max-width:100%;border-radius:12px;margin-top:8px;" />'
      msgsEl.appendChild(imgEl)
      msgsEl.scrollTop = msgsEl.scrollHeight
    }
  }

  // Recherche web si question d'actualité
  var webContext = ''
  if (txt && needsSearch(txt)) {
    try {
      var sr = await searchWeb(txt)
      if (sr) webContext = '\n\n<web_results>\nINFOS TROUVÉES SUR INTERNET — utilise ces données DIRECTEMENT dans ta réponse. Cite les noms, adresses et numéros tels quels. Ne dis PAS que tu ne sais pas si ces infos existent dans tes résultats :\n' + sr + '\n</web_results>'
    } catch(e) {}
  }
  // Afficher le message + photo dans le chat
  if (pendingImg) {
    var b64url = 'data:' + pendingImg.mime + ';base64,' + pendingImg.b64data;
    hideEmpty();
    cardsEl.style.display = 'none';
    var imgDiv = document.createElement('div');
    imgDiv.className = 'msg';
    var av2 = profil ? profil.prenom[0].toUpperCase() : '?';
    var name2 = profil ? profil.prenom : 'Toi';
    imgDiv.innerHTML = '<div class="av user">' + av2 + '</div><div class="mbody"><div class="mname">' + name2 + '</div>'
      + (txt ? '<div class="mtext">' + txt + '</div>' : '')
      + '<img src="' + b64url + '" style="max-width:100%;border-radius:12px;margin-top:6px;max-height:200px;object-fit:contain;"></div>';
    msgsEl.appendChild(imgDiv);
    msgsEl.scrollTop = msgsEl.scrollHeight;
    var bar2 = document.getElementById('img-preview-bar');
    if (bar2) bar2.style.display = 'none';
    hist.push({ role: 'user', content: (txt ? txt + '\n' : '') + '[Photo jointe - décrire et demander quoi faire]' });
  } else {
    addMsg('user', txt);
    hist.push({ role: 'user', content: txt });
  }
  // Si photo jointe, analyser avec vision avant d'envoyer à Groq
  if (pendingImg) {
    var imgB64 = pendingImg.b64data;
    var imgMime = pendingImg.mime;
    pendingImg = null;
    typing = true;
    var tel2 = addMsg('ia', '');
    tel2.classList.add('typing');
    analyzeVision(imgB64, imgMime, txt || null).then(function(desc) {
      var visionMsg = desc || 'Image reçue.';
      tel2.classList.remove('typing');
      // Vérifier si c'est un JSON de publication
      var ft = visionMsg.trim()
      var s = ft.indexOf('{'); var e2 = ft.lastIndexOf('}');
      if (s >= 0 && e2 > s) {
        try {
          var pd = JSON.parse(ft.slice(s, e2+1));
          if (pd.action === 'publier' && pd.type) {
            pd._imgB64 = imgB64; pd._imgMime = imgMime;
            tel2.textContent = "Voilà l'aperçu :";
            hist.push({ role: 'assistant', content: tel2.textContent });
            showPreview(pd);
            typing = false;
            return;
          }
        } catch(ex) {}
      }
      tel2.textContent = visionMsg;
      hist.push({ role: 'assistant', content: visionMsg });
      typing = false;
    });
    return;
  }
  var tel = addMsg('ia', '');
  tel.classList.add('typing');
  fetch(PROXY, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ model: 'mistral-saba-24b', messages: [{ role: 'system', content: getSYS() + feedContext + webContext }].concat(hist), max_tokens: 400, temperature: 0.1, stream: true })
  }).then(function(res) {
    tel.classList.remove('typing'); tel.textContent = '';
    var reader = res.body.getReader(); var dec = new TextDecoder(); var full = '';
    function read() {
      return reader.read().then(function(chunk) {
        if (chunk.done) {
          hist.push({ role: 'assistant', content: full });
          if (!detectAndShow(full, tel)) {}
          typing = false;
          return;
        }
        var lines = dec.decode(chunk.value).split('\n').filter(function(l) { return l.indexOf('data: ') === 0; });
        lines.forEach(function(line) {
          var d = line.slice(6); if (d === '[DONE]') return;
          try { var delta = JSON.parse(d).choices[0].delta.content || ''; full += delta; tel.textContent = full; msgsEl.scrollTop = msgsEl.scrollHeight; } catch(ex) {}
        });
        return read();
      });
    }
    return read();
  }).catch(function() { tel.classList.remove('typing'); tel.textContent = "Erreur, réessaie."; typing = false; });
}

init();
</script>
