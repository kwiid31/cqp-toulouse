<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#f0ede6">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>IA CQP</title>
<link rel="stylesheet" href="css/main.css">
<style>
html{height:-webkit-fill-available;background:#f0ede6}
body{height:100%;height:-webkit-fill-available;background:#f0ede6;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.wrap{display:flex;flex-direction:column;height:100vh;height:100dvh;background:#f0ede6;position:fixed;top:0;left:0;right:0;bottom:0}
.ia-top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));flex-shrink:0}
.back-btn{background:none;border:none;cursor:pointer;padding:4px;color:#888;line-height:0}
.badge{display:none;align-items:center;gap:6px;font-size:13px;font-weight:500;background:#f0f0f0;padding:4px 10px;border-radius:20px}
.dot{width:8px;height:8px;border-radius:50%;background:#22c55e}
.conn-btn{font-size:13px;color:#888;background:none;border:none;cursor:pointer;padding:4px 8px}
.msgs{flex:1;overflow-y:auto;padding:16px 16px 8px;display:flex;flex-direction:column;gap:16px;background:#f0ede6;scroll-behavior:smooth}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;text-align:center;padding:24px;background:#f0ede6}
.empty h1{font-size:26px;font-weight:400;color:#1c1a17;margin:16px 0 8px;font-family:Georgia,serif;letter-spacing:-.3px}
.empty p{font-size:14px;color:#9a9080;font-style:italic;line-height:1.5}
.cards-zone{display:flex;gap:10px;padding:0 16px 12px;overflow-x:auto;flex-shrink:0;scrollbar-width:none;background:#f0ede6}
.cards-zone::-webkit-scrollbar{display:none}
.card{flex-shrink:0;width:130px;border:1px solid #e8e2d9;border-radius:14px;padding:14px;cursor:pointer;background:#fff;transition:background .15s}
.card:active{background:#f5f0e8}
.card svg{margin-bottom:8px;color:#555}
.card p{font-size:13px;font-weight:500;color:#1a1a1a;margin:0;line-height:1.3}
.msg{display:flex;gap:10px;animation:up .2s ease}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.av{width:32px;height:32px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.av.ia{background:#C8102E}
.av.user{background:#e8e3db;color:#555}
.mbody{flex:1;min-width:0}
.mname{font-size:12px;font-weight:600;color:#888;margin-bottom:4px}
.mtext{font-size:15px;color:#1a1a1a;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.typing::after{content:'●●●';animation:blink 1s infinite;font-size:18px;color:#C8102E;letter-spacing:4px}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
.preview-card{background:#fff;border:1.5px solid #C8102E;border-radius:14px;padding:14px;margin-top:8px;font-size:14px}
.preview-card h4{margin:0 0 8px;font-size:12px;color:#C8102E;text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.preview-card p{margin:0 0 4px;color:#333;line-height:1.4}
.preview-card img{width:100%;border-radius:8px;margin-bottom:8px;max-height:150px;object-fit:cover;display:block}
.preview-btns{display:flex;gap:8px;margin-top:12px}
.btn-pub{background:#C8102E;color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:14px;font-weight:600;cursor:pointer;flex:1}
.btn-cancel{background:#f0f0f0;color:#555;border:none;border-radius:8px;padding:8px 16px;font-size:14px;cursor:pointer}
.input-zone{padding:10px 16px;padding-bottom:max(14px,env(safe-area-inset-bottom));background:#f0ede6;flex-shrink:0}
.input-box{display:flex;align-items:flex-end;gap:10px;border:.5px solid #ddd8d0;border-radius:16px;padding:12px 14px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.clip-btn{background:none;border:none;cursor:pointer;padding:2px;color:#aaa;line-height:0;flex-shrink:0}
textarea{flex:1;border:none;background:none;outline:none;resize:none;font-size:16px;font-family:inherit;color:#1a1a1a;max-height:120px;line-height:1.4}
textarea::placeholder{color:#a09585}
.send-btn{width:36px;height:36px;border-radius:50%;background:#C8102E;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;opacity:.4;transition:opacity .15s}
.send-btn.active{opacity:1}
.img-preview-bar{display:none;padding:8px 16px 0;background:#f0ede6}
.img-thumb{position:relative;display:inline-block}
.img-thumb img{width:72px;height:72px;object-fit:cover;border-radius:10px;display:block}
.img-thumb button{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:#333;color:#fff;border:none;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center}
</style>
</head>

// ═══════════════════════════════════════════
// INIT — Charger profil
// ═══════════════════════════════════════════
function init() {
  // 1. Depuis localStorage (instantané)
  var code = localStorage.getItem('cqp_code') || localStorage.getItem('profil_code') || localStorage.getItem('code')
  var prenom = localStorage.getItem('cqp_prenom') || ''
  var quartier = localStorage.getItem('cqp_quartier') || 'Toulouse'
  if (code && prenom) {
    profil = {code: code, prenom: prenom, quartier: quartier}
    showConnected(prenom)
  }
  // 2. Depuis Supabase (complet, pour avoir toutes les infos)
  if (code) {
    sbc.from('profils').select('*').eq('code', code).maybeSingle().then(function(res) {
      if (res.data) {
        profil = res.data
        showConnected(res.data.prenom)
      }
    })
  }
}

function showConnected(prenom) {
  document.getElementById('badge').style.display = 'flex'
  document.getElementById('uname').textContent = prenom
  document.getElementById('connbtn').style.display = 'none'
  var t = document.getElementById('empty-title')
  if (t) t.textContent = 'Le retour de ' + prenom + ' !'
}

init()

// ═══════════════════════════════════════════
// MESSAGES UI
// ═══════════════════════════════════════════
function hideEmpty() { if (emptyEl) emptyEl.style.display = 'none' }

function addMsg(role, txt) {
  hideEmpty()
  var isIA = role === 'ia'
  var d = document.createElement('div')
  d.className = 'msg'
  var avContent = isIA
    ? '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><path d="M12 2a10 10 0 1 0 10 10"/><path d="M12 6v6l4 2"/></svg>'
    : (profil ? profil.prenom[0].toUpperCase() : '?')
  var name = isIA ? 'CQP IA' : (profil ? profil.prenom : 'Toi')
  var av = document.createElement('div')
  av.className = 'av ' + (isIA ? 'ia' : 'user')
  av.innerHTML = avContent
  var body = document.createElement('div')
  body.className = 'mbody'
  var mname = document.createElement('div')
  mname.className = 'mname'
  mname.textContent = name
  var mtext = document.createElement('div')
  mtext.className = 'mtext'
  mtext.textContent = txt || ''
  body.appendChild(mname)
  body.appendChild(mtext)
  d.appendChild(av)
  d.appendChild(body)
  msgsEl.appendChild(d)
  msgsEl.scrollTop = msgsEl.scrollHeight
  return mtext
}

// ═══════════════════════════════════════════
// PUBLICATION
// ═══════════════════════════════════════════
function showEditablePreview(type, suggestion, imgB64, imgMime) {
  var typeLabel = type === 'post' ? 'Post' : type === 'annonce' ? 'Annonce' : 'Événement'
  var q = profil ? (profil.quartier || 'Toulouse') : 'Toulouse'

  var card = document.createElement('div')
  card.className = 'preview-card'

  var h4 = document.createElement('h4')
  h4.textContent = typeLabel
  card.appendChild(h4)

  if (imgB64) {
    var img = document.createElement('img')
    img.src = 'data:' + imgMime + ';base64,' + imgB64
    img.style.cssText = 'width:100%;border-radius:8px;margin-bottom:8px;max-height:150px;object-fit:cover;display:block;'
    card.appendChild(img)
  }

  // Hint modifiable
  var hint = document.createElement('p')
  hint.textContent = '✏️ Modifie le texte directement ci-dessous avant de publier'
  hint.style.cssText = 'font-size:12px;color:#C8102E;margin:0 0 6px;font-weight:500;'
  card.appendChild(hint)

  // Textarea éditable
  var ta = document.createElement('textarea')
  ta.value = suggestion || ''
  ta.placeholder = 'Écris ton texte ici...'
  ta.style.cssText = 'width:100%;border:2px solid #C8102E;border-radius:8px;padding:10px;font-size:14px;font-family:inherit;resize:vertical;min-height:80px;box-sizing:border-box;color:#1a1a1a;background:#fff;'
  card.appendChild(ta)
  setTimeout(function(){ ta.focus(); ta.select() }, 300)

  var btns = document.createElement('div')
  btns.className = 'preview-btns'

  var btnPub = document.createElement('button')
  btnPub.className = 'btn-pub'
  btnPub.textContent = 'Publier'
  btnPub.addEventListener('click', function() {
    var pd = {action:'publier', type: type, quartier: q}
    if (type === 'post') pd.contenu = ta.value
    else if (type === 'annonce') { pd.titre = ta.value.split('\n')[0]; pd.description = ta.value; pd.categorie = 'Autre' }
    else { pd.titre = ta.value.split('\n')[0]; pd.description = ta.value; pd.lieu = q; pd.date = '2026-06-15' }
    publishPost(pd, imgB64, imgMime)
    card.remove()
  })

  var btnCancel = document.createElement('button')
  btnCancel.className = 'btn-cancel'
  btnCancel.textContent = 'Annuler'
  btnCancel.addEventListener('click', function() { card.remove() })

  btns.appendChild(btnPub)
  btns.appendChild(btnCancel)
  card.appendChild(btns)
  msgsEl.appendChild(card)
  msgsEl.scrollTop = msgsEl.scrollHeight
}

function detectAndShow(txt, el, imgB64, imgMime) {
  var s = txt.indexOf('{'), e = txt.lastIndexOf('}')
  if (s < 0 || e <= s) return false
  try {
    var pd = JSON.parse(txt.slice(s, e+1))
    if (pd.action === 'publier' && pd.type) {
      if (imgB64) pd._imgB64 = imgB64
      if (imgMime) pd._imgMime = imgMime
      // Cacher le message IA qui contient le JSON brut
      if (el) {
        el.textContent = ''
        if (el.parentElement) el.parentElement.style.display = 'none'
      }
      showPreview(pd, msgsEl)
      return true
    }
  } catch(ex) {}
  return false
}

function showPreview(pd, container) {
  var type = pd.type === 'post' ? 'Post' : pd.type === 'annonce' ? 'Annonce' : 'Événement'
  var imgB64 = pd._imgB64 || null
  var imgMime = pd._imgMime || null

  var card = document.createElement('div')
  card.className = 'preview-card'

  var h4 = document.createElement('h4')
  h4.textContent = type
  card.appendChild(h4)

  if (imgB64) {
    var img = document.createElement('img')
    img.src = 'data:' + imgMime + ';base64,' + imgB64
    card.appendChild(img)
  }

  var p = document.createElement('p')
  var rawTxt = pd.contenu || pd.description || pd.titre || ''
  p.textContent = rawTxt.replace(/\[Image jointe\]/gi, '').replace(/\[Photo jointe\]/gi, '').trim()
  card.appendChild(p)

  if (pd.lieu) { var pl = document.createElement('p'); pl.textContent = '📍 ' + pd.lieu; card.appendChild(pl) }
  if (pd.date) { var pd2 = document.createElement('p'); pd2.textContent = '📅 ' + pd.date; card.appendChild(pd2) }

  var btns = document.createElement('div')
  btns.className = 'preview-btns'

  var btnPub = document.createElement('button')
  btnPub.className = 'btn-pub'
  btnPub.textContent = 'Publier'
  btnPub.onclick = function() { publishPost(pd, imgB64, imgMime) }

  var btnCancel = document.createElement('button')
  btnCancel.className = 'btn-cancel'
  btnCancel.textContent = 'Annuler'
  btnCancel.onclick = function() { card.remove() }

  btns.appendChild(btnPub)
  btns.appendChild(btnCancel)
  card.appendChild(btns)

  if (container) container.appendChild(card)
  else msgsEl.appendChild(card)
  msgsEl.scrollTop = msgsEl.scrollHeight
}

async function uploadCloudinary(b64, mime) {
  try {
    var blob = await fetch('data:' + mime + ';base64,' + b64).then(function(r){ return r.blob() })
    var form = new FormData()
    form.append('file', blob)
    form.append('upload_preset', CLOUD_PRESET)
    form.append('folder', 'cqp/posts')
    var res = await fetch(CLOUDINARY_URL, {method:'POST', body: form})
    var data = await res.json()
    return data.secure_url || null
  } catch(e) { return null }
}

async function publishPost(pd, imgB64, imgMime) {
  var tel = addMsg('ia', '⏳ Publication en cours...')
  try {
    var imageUrl = null
    if (imgB64) {
      tel.textContent = '⏳ Upload de l\'image...'
      imageUrl = await uploadCloudinary(imgB64, imgMime)
    }

    var table = pd.type === 'post' ? 'posts' : pd.type === 'annonce' ? 'annonces' : 'evenements'
    var row = {visible: true}
    if (profil) {
      row.profil_code = profil.code
      row.prenom = profil.prenom
      row.quartier = profil.quartier || pd.quartier || 'Toulouse'
    }

    if (pd.type === 'post') {
      row.contenu = (pd.contenu || '').replace(/\[Image jointe\]/gi, '').replace(/\[Photo jointe\]/gi, '').trim()
      row.quartier = row.quartier || pd.quartier
      if (imageUrl) row.image_url = imageUrl
    } else if (pd.type === 'annonce') {
      row.titre = pd.titre
      row.description = pd.description
      row.categorie = pd.categorie || 'Autre'
      row.quartier = row.quartier || pd.quartier
      if (imageUrl) row.image_url = imageUrl
    } else {
      row.titre = pd.titre
      row.lieu = pd.lieu || ''
      row.date_debut = pd.date || new Date().toISOString().slice(0,10)
      row.description = pd.description || ''
      row.visible = true
      row.validee = true
      if (profil) row.prenom = profil.prenom
      if (imageUrl) row.image_url = imageUrl
      // Pas de colonne quartier dans evenements
      delete row.quartier
    }

    var res = await sbc.from(table).insert(row)
    if (!res.error) {
      forcedType = null
      tel.textContent = '✅ Publié avec succès !' + (imageUrl ? ' 📸' : '')
      hist.push({role: 'assistant', content: tel.textContent})
    } else {
      tel.textContent = 'Erreur : ' + res.error.message
    }
  } catch(e) {
    tel.textContent = 'Erreur : ' + e.message
  }
}

// ═══════════════════════════════════════════
// VISION
// ═══════════════════════════════════════════
function analyzeVision(b64, mime, userMsg) {
  var n = profil ? profil.prenom : 'l\'utilisateur'
  var q = profil ? (profil.quartier || 'Toulouse') : 'Toulouse'
  var fType = forcedType

  var typeInstruction = ''
  if (fType === 'evenement') {
    typeInstruction = ' L\'utilisateur veut créer un ÉVÉNEMENT avec cette image (c\'est probablement un flyer). Génère UNIQUEMENT ce JSON sans rien d\'autre : {"action":"publier","type":"evenement","titre":"titre de l\'événement visible sur le flyer ou déduit","lieu":"lieu visible ou ' + q + '","date":"2026-06-20","description":"description courte de l\'événement"}'
  } else if (fType === 'annonce') {
    typeInstruction = ' L\'utilisateur veut créer une ANNONCE avec cette image. Génère UNIQUEMENT ce JSON : {"action":"publier","type":"annonce","titre":"titre court","categorie":"Vente","description":"description basée sur l\'image","quartier":"' + q + '"}'
  } else if (fType === 'post') {
    typeInstruction = ' L\'utilisateur veut publier un POST avec cette image. Génère UNIQUEMENT ce JSON : {"action":"publier","type":"post","contenu":"texte accrocheur 1-2 phrases","quartier":"' + q + '"}'
  } else if (userMsg) {
    typeInstruction = ' L\'utilisateur demande : "' + userMsg + '". Génère directement le JSON de publication approprié.'
  } else {
    typeInstruction = ' Regarde cette photo et demande en une seule phrase courte ce que l\'utilisateur veut en faire : post, annonce ou événement.'
  }

  var prompt = 'Tu es Leila, assistante IA de CQP Toulouse. Tu parles à ' + n + ' du quartier ' + q + '.' + typeInstruction


  return fetch(PROXY, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      model: 'meta-llama/llama-4-scout-17b-16e-instruct',
      messages: [{role: 'user', content: [
        {type: 'image_url', image_url: {url: 'data:' + mime + ';base64,' + b64}},
        {type: 'text', text: prompt}
      ]}],
      max_tokens: 400,
      temperature: 0.3
    })
  }).then(function(r){ return r.json() })
    .then(function(d){ return d.choices && d.choices[0] ? d.choices[0].message.content : 'Image analysée.' })
    .catch(function(){ return 'Impossible d\'analyser l\'image.' })
}

// ═══════════════════════════════════════════
// ENVOI MESSAGE
// ═══════════════════════════════════════════
async function doSend() {
  var txt = taEl.value.trim()
  if (!txt && !pendingImg) return
  if (typing) return
  taEl.value = ''
  taEl.style.height = 'auto'
  sbtn.disabled = true
  sbtn.classList.remove('active')
  cardsEl.style.display = 'none'
  typing = true

  // Afficher message utilisateur
  if (pendingImg) {
    hideEmpty()
    var imgDiv = document.createElement('div')
    imgDiv.className = 'msg'
    var av2 = document.createElement('div')
    av2.className = 'av user'
    av2.textContent = profil ? profil.prenom[0].toUpperCase() : '?'
    var body2 = document.createElement('div')
    body2.className = 'mbody'
    var nm2 = document.createElement('div')
    nm2.className = 'mname'
    nm2.textContent = profil ? profil.prenom : 'Toi'
    body2.appendChild(nm2)
    if (txt) {
      var tx2 = document.createElement('div')
      tx2.className = 'mtext'
      tx2.textContent = txt
      body2.appendChild(tx2)
    }
    var imgEl = document.createElement('img')
    imgEl.src = 'data:' + pendingImg.mime + ';base64,' + pendingImg.b64data
    imgEl.style.cssText = 'max-width:100%;border-radius:12px;margin-top:6px;max-height:200px;object-fit:contain;display:block;'
    body2.appendChild(imgEl)
    imgDiv.appendChild(av2)
    imgDiv.appendChild(body2)
    msgsEl.appendChild(imgDiv)
    msgsEl.scrollTop = msgsEl.scrollHeight
    document.getElementById('img-preview-bar').style.display = 'none'
    hist.push({role: 'user', content: txt || 'Photo envoyée.'})
  } else {
    addMsg('user', txt)
    hist.push({role: 'user', content: txt})
  }

  // Si photo → analyzeVision
  if (pendingImg) {
    var imgB64 = pendingImg.b64data
    var imgMime = pendingImg.mime
    lastImg = {b64: imgB64, mime: imgMime}
    pendingImg = null
    var tel2 = addMsg('ia', '')
    tel2.classList.add('typing')
    analyzeVision(imgB64, imgMime, txt || null).then(function(desc) {
      tel2.classList.remove('typing')
      var msg = desc || 'Photo reçue.'
      // Si JSON de publication → extraire le texte et montrer preview éditable
      try {
        var s = msg.indexOf('{'), e = msg.lastIndexOf('}')
        if (s >= 0 && e > s) {
          var pd = JSON.parse(msg.slice(s, e+1))
          if (pd.action === 'publier' && pd.type) {
            tel2.textContent = ''
            if (tel2.parentElement) tel2.parentElement.style.display = 'none'
            var suggestion = pd.contenu || pd.description || pd.titre || ''
            showEditablePreview(pd.type, suggestion, imgB64, imgMime)
            hist.push({role: 'assistant', content: suggestion})
            typing = false
            sbtn.disabled = false
            return
          }
        }
      } catch(ex) {}
      // Sinon texte normal — question de Leila
      tel2.textContent = msg
      hist.push({role: 'assistant', content: msg})
      typing = false
      sbtn.disabled = false
    })
    return
  }

  // Appel Groq texte
  var tel = addMsg('ia', '')
  tel.classList.add('typing')

  // Si l'utilisateur confirme après une photo → réinjecter l'image dans le contexte
  // Si message texte + lastImg disponible → réutiliser la photo
  // Si lastImg existe et que le message est court (< 50 chars) → wantsPublish automatique
  // Si lastImg existe et contient un mot de publication → wantsPublish
  var pubKeywords = ['post','annonce','événement','evenement','event','publie','vas-y',
    'oui','ok','ouais','yep','go','allez','parfait','super','bien',
    'un post','une annonce','fais','propose','génère','ecris','rédige']
  var isShortReply = txt && txt.length < 40
  var wantsPublish = txt && lastImg && (isShortReply || pubKeywords.some(function(k){ return txt.toLowerCase().includes(k) }))
  if (wantsPublish) {
    var finalImg = lastImg
    // On garde lastImg au cas où l'utilisateur voudrait modifier
    var tel3 = addMsg('ia', '')
    tel3.classList.add('typing')
    analyzeVision(finalImg.b64, finalImg.mime, txt).then(function(desc) {
      tel3.classList.remove('typing')
      // Cacher le message de chargement
      if (tel3.parentElement) tel3.parentElement.style.display = 'none'
      try {
        var s = desc.indexOf('{'), e = desc.lastIndexOf('}')
        if (s >= 0 && e > s) {
          var pd = JSON.parse(desc.slice(s, e+1))
          if (pd.action === 'publier' && pd.type) {
            lastImg = null
            showEditablePreview(pd.type, pd.contenu || pd.description || pd.titre || '', finalImg.b64, finalImg.mime)
            hist.push({role: 'assistant', content: pd.contenu || pd.description || ''})
            typing = false
            sbtn.disabled = false
            return
          }
        }
      } catch(ex) {}
      // Si pas de JSON — afficher le texte
      if (tel3.parentElement) tel3.parentElement.style.display = ''
      tel3.textContent = desc
      hist.push({role: 'assistant', content: desc})
      typing = false
      sbtn.disabled = false
    })
    return
  }

  fetch(PROXY, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      model: MODEL,
      messages: [{role: 'system', content: getSYS()}].concat(hist),
      max_tokens: 400,
      temperature: 0.5,
      stream: !isIOS
    })
  }).then(function(res) {
    tel.classList.remove('typing')
    tel.textContent = ''

    if (isIOS) {
      // Non-streaming pour iOS
      return res.json().then(function(d) {
        var full = d.choices && d.choices[0] ? (d.choices[0].message.content || '') : ''
        hist.push({role: 'assistant', content: full})
        if (!detectAndShow(full, tel, null, null)) { tel.textContent = full }
        typing = false
        sbtn.disabled = false
      })
    }

    // Streaming pour desktop
    var reader = res.body.getReader()
    var dec = new TextDecoder()
    var full = ''
    function read() {
      return reader.read().then(function(chunk) {
        if (chunk.done) {
          hist.push({role: 'assistant', content: full})
          if (!detectAndShow(full, tel, null, null)) {}
          typing = false
          sbtn.disabled = false
          return
        }
        var lines = dec.decode(chunk.value).split('\n').filter(function(l){ return l.indexOf('data: ') === 0 })
        lines.forEach(function(line) {
          var d = line.slice(6)
          if (d === '[DONE]') return
          try {
            var delta = JSON.parse(d).choices[0].delta.content || ''
            full += delta
            tel.textContent = full
            msgsEl.scrollTop = msgsEl.scrollHeight
          } catch(ex) {}
        })
        return read()
      })
    }
    return read()
  }).catch(function(e) {
    tel.classList.remove('typing')
    tel.textContent = 'Une erreur s\'est produite.'
    typing = false
    sbtn.disabled = false
  })
}

// ═══════════════════════════════════════════
// UI HELPERS
// ═══════════════════════════════════════════
function setMsg(txt) { taEl.value = txt; taEl.dispatchEvent(new Event('input')); doSend() }

function startFlow(type) {
  // Définir le type forcé pour ce flow
  forcedType = type
  var msgs = {
    'evenement': 'Je veux créer un événement dans l\'agenda. Tu peux me poser les questions une par une (titre, date, lieu, description). Je pourrai aussi joindre un flyer ou une photo si je veux.',
    'annonce': 'Je veux déposer une annonce. Tu peux me demander la catégorie (vente, service, emploi, logement, don), le titre et la description. Je pourrai aussi joindre une photo.',
    'post': 'Je veux publier un post dans le feed. Je peux écrire un texte, joindre une photo, plusieurs photos ou une vidéo.'
  }
  taEl.value = msgs[type]
  taEl.dispatchEvent(new Event('input'))
  doSend()
}
function clearImg() { pendingImg = null; document.getElementById('img-preview-bar').style.display = 'none'; sbtn.classList.toggle('active', taEl.value.trim().length > 0) }

taEl.addEventListener('input', function() {
  this.style.height = 'auto'
  this.style.height = Math.min(this.scrollHeight, 120) + 'px'
  sbtn.classList.toggle('active', this.value.trim().length > 0 || !!pendingImg)
})

taEl.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSend() }
})

sbtn.addEventListener('click', doSend)

document.getElementById('clip-btn').addEventListener('click', function() {
  document.getElementById('file-input').click()
})

document.getElementById('file-input').addEventListener('change', function(e) {
  var file = e.target.files[0]
  if (!file) return
  var reader = new FileReader()
  reader.onload = function(ev) {
    var b64 = ev.target.result.split(',')[1]
    pendingImg = {b64data: b64, mime: file.type}
    document.getElementById('img-thumb-el').src = ev.target.result
    document.getElementById('img-preview-bar').style.display = 'block'
    sbtn.classList.add('active')
  }
  reader.readAsDataURL(file)
  e.target.value = ''
})
</script>
