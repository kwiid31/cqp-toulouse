<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#C8102E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Admin — CQP Toulouse</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--rouge:#C8102E;--blue:#1877F2;--green:#42B72A;--orange:#EA580C;--purple:#7C3AED;
  --txt:#050505;--txt2:#65676B;--txt3:#8A8D91;
  --bg:#F0F2F5;--bg3:#E4E6EB;--border:#CED0D4;
  --shadow:0 1px 2px rgba(0,0,0,.1);--r:8px;--nav:56px;}
html,body{font-size:15px;background:var(--bg);color:var(--txt);font-family:'Barlow',sans-serif;min-height:100vh;}
a{text-decoration:none;color:inherit}button{cursor:pointer;font-family:inherit;outline:none;border:none;}

.topbar{position:sticky;top:0;z-index:100;height:var(--nav);background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:0 14px;box-shadow:var(--shadow);}
.topbar-title{font-family:'Bebas Neue',sans-serif;font-size:1.2rem;letter-spacing:.5px;flex:1;}
.badge-admin{background:var(--orange);color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:.6rem;letter-spacing:2px;text-transform:uppercase;padding:3px 9px;border-radius:4px;}

.admin-wrap{max-width:760px;margin:0 auto;padding:12px;}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:12px;}
.stat-card{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;}
.stat-n{font-family:'Bebas Neue',sans-serif;font-size:2rem;line-height:1;}
.stat-l{font-family:'Barlow Condensed',sans-serif;font-size:.62rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--txt3);margin-top:2px;}

/* TABS */
.tabs{display:flex;gap:0;background:#fff;border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px;}
.tab-btn{flex:1;padding:12px 6px;background:none;border:none;font-family:'Barlow Condensed',sans-serif;font-size:.7rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--txt3);border-bottom:2px solid transparent;transition:all .15s;}
.tab-btn.active{color:var(--rouge);border-bottom-color:var(--rouge);}

/* TABLE */
.table-wrap{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;}
.table-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);}
.table-head-title{font-family:'Barlow Condensed',sans-serif;font-size:.65rem;letter-spacing:2px;text-transform:uppercase;color:var(--txt3);flex:1;}
.table-row{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-bottom:1px solid var(--bg3);}
.table-row:last-child{border-bottom:none;}
.row-av{width:36px;height:36px;border-radius:50%;background:var(--rouge);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:.9rem;color:#fff;flex-shrink:0;overflow:hidden;}
.row-av img{width:100%;height:100%;object-fit:cover;}
.row-main{flex:1;min-width:0;}
.row-title{font-family:'Barlow',sans-serif;font-weight:600;font-size:.88rem;line-height:1.3;}
.row-sub{font-size:.78rem;color:var(--txt3);margin-top:2px;}
.row-actions{display:flex;gap:6px;flex-shrink:0;}
.btn-sm{padding:5px 12px;border-radius:6px;font-family:'Barlow Condensed',sans-serif;font-size:.65rem;letter-spacing:1.5px;text-transform:uppercase;}
.btn-ok{background:var(--green);color:#fff;}
.btn-del{background:#fff;border:1.5px solid var(--border);color:var(--rouge);}
.btn-del:hover{background:#fff0f2;}

/* ACTU FORM */
.actu-form{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:12px;}
.actu-form-title{font-family:'Bebas Neue',sans-serif;font-size:1.2rem;margin-bottom:14px;}
.fg{margin-bottom:12px;}
.fg label{display:block;font-family:'Barlow Condensed',sans-serif;font-size:.65rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--txt3);margin-bottom:5px;}
.fg input,.fg select,.fg textarea{width:100%;padding:11px 14px;background:var(--bg3);border:1.5px solid var(--border);border-radius:8px;color:var(--txt);font-family:'Barlow',sans-serif;font-size:.9rem;outline:none;resize:vertical;}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--rouge);}
.fg-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.btn-rouge{width:100%;padding:13px;background:var(--rouge);border:none;border-radius:8px;color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:.88rem;letter-spacing:2px;text-transform:uppercase;}
.form-msg{text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:.75rem;letter-spacing:1px;min-height:18px;margin-top:8px;}

.spinner{display:flex;align-items:center;justify-content:center;gap:8px;padding:24px;}
.spinner-dot{width:7px;height:7px;border-radius:50%;background:var(--rouge);animation:bounce .9s infinite;}
.spinner-dot:nth-child(2){animation-delay:.15s;}.spinner-dot:nth-child(3){animation-delay:.3s;}
@keyframes bounce{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.7)}}
.empty{text-align:center;padding:28px;color:var(--txt3);font-family:'Barlow Condensed',sans-serif;font-size:.8rem;letter-spacing:1px;}

/* GATE */
#gate{max-width:400px;margin:60px auto;padding:0 16px;}
.gate-box{background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:24px;text-align:center;}
.gate-box h2{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;margin-bottom:8px;}
.gate-box p{font-size:.85rem;color:var(--txt2);margin-bottom:20px;}
#gate-input{width:100%;padding:12px 14px;background:var(--bg3);border:1.5px solid var(--border);border-radius:8px;font-size:1.2rem;letter-spacing:6px;text-align:center;outline:none;font-family:'Bebas Neue',sans-serif;color:var(--txt);}
#gate-input:focus{border-color:var(--rouge);}
</style>
</head>
<body>

<header class="topbar">
  <button onclick="history.length>1?history.back():location.href='index.html'" style="width:36px;height:36px;background:var(--bg3);border-radius:50%;display:flex;align-items:center;justify-content:center;">
    <svg viewBox="0 0 24 24" width="20" height="20" style="stroke:var(--txt);fill:none;stroke-width:2;stroke-linecap:round;"><polyline points="15 18 9 12 15 6"/></svg>
  </button>
  <div class="topbar-title">Admin</div>
  <span class="badge-admin">Admin</span>
</header>

<!-- GATE (vérification admin) -->
<div id="gate">
  <div class="gate-box">
    <h2>🔐 Accès Admin</h2>
    <p>Entre ton code profil pour vérifier tes droits admin.</p>
    <input id="gate-input" type="password" inputmode="numeric" placeholder="••••••" maxlength="6">
    <button class="btn-rouge" style="margin-top:12px;" onclick="checkAdmin()">Vérifier</button>
    <div class="form-msg" id="gate-msg"></div>
  </div>
</div>

<!-- PANNEAU ADMIN -->
<div id="admin-panel" style="display:none;">
  <div class="admin-wrap">

    <!-- STATS -->
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-n" id="s-profils" style="color:var(--purple)">—</div><div class="stat-l">Profils</div></div>
      <div class="stat-card"><div class="stat-n" id="s-posts" style="color:var(--blue)">—</div><div class="stat-l">Posts</div></div>
      <div class="stat-card"><div class="stat-n" id="s-stories" style="color:var(--orange)">—</div><div class="stat-l">Stories</div></div>
      <div class="stat-card"><div class="stat-n" id="s-annonces" style="color:var(--green)">—</div><div class="stat-l">Annonces</div></div>
      <div class="stat-card"><div class="stat-n" id="s-evts" style="color:var(--rouge)">—</div><div class="stat-l">Événements</div></div>
      <div class="stat-card"><div class="stat-n" id="s-views" style="color:var(--txt2)">—</div><div class="stat-l">Visites</div></div>
    </div>

    <!-- TABS -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('actus',this)">Actus</button>
      <button class="tab-btn" onclick="switchTab('moderation',this)">Modération</button>
      <button class="tab-btn" onclick="switchTab('evts',this)">Évts</button>
      <button class="tab-btn" onclick="switchTab('profils',this)">Profils</button>
    </div>

    <!-- TAB ACTUS -->
    <div id="tab-actus">
      <div class="actu-form">
        <div class="actu-form-title">✍️ Publier une actualité</div>
        <div class="fg"><label>Titre *</label><input id="a-titre" placeholder="Titre de l'article"></div>
        <div class="fg-row">
          <div class="fg"><label>Catégorie</label><select id="a-cat"><option>Quartier</option><option>Politique</option><option>Culture</option><option>Social</option><option>Sport</option><option>Général</option></select></div>
          <div class="fg"><label>Date de publication</label><input type="datetime-local" id="a-date"></div>
        </div>
        <div class="fg"><label>Contenu *</label><textarea id="a-contenu" rows="5" placeholder="Corps de l'article…"></textarea></div>
        <div class="fg"><label>URL photo</label><input id="a-photo" placeholder="https://…" type="url"></div>
        <button class="btn-rouge" onclick="publishActu()">Publier l'actualité</button>
        <div class="form-msg" id="a-msg"></div>
      </div>
      <div class="table-wrap" id="actus-list">
        <div class="spinner"><div class="spinner-dot"></div><div class="spinner-dot"></div><div class="spinner-dot"></div></div>
      </div>
    </div>

    <!-- TAB MODERATION (posts/annonces à valider) -->
    <div id="tab-moderation" style="display:none;">
      <div class="table-wrap" style="margin-bottom:12px;">
        <div class="table-head"><div class="table-head-title">Posts à modérer</div></div>
        <div id="mod-posts"><div class="spinner"><div class="spinner-dot"></div><div class="spinner-dot"></div><div class="spinner-dot"></div></div></div>
      </div>
      <div class="table-wrap">
        <div class="table-head"><div class="table-head-title">Annonces à valider</div></div>
        <div id="mod-annonces"><div class="spinner"><div class="spinner-dot"></div><div class="spinner-dot"></div><div class="spinner-dot"></div></div></div>
      </div>
    </div>

    <!-- TAB EVTS -->
    <div id="tab-evts" style="display:none;">
      <div class="table-wrap">
        <div class="table-head"><div class="table-head-title">Événements à valider</div></div>
        <div id="mod-evts"><div class="spinner"><div class="spinner-dot"></div><div class="spinner-dot"></div><div class="spinner-dot"></div></div></div>
      </div>
    </div>

    <!-- TAB PROFILS -->
    <div id="tab-profils" style="display:none;">
      <div class="table-wrap">
        <div class="table-head"><div class="table-head-title">Derniers inscrits</div></div>
        <div id="profils-list"><div class="spinner"><div class="spinner-dot"></div><div class="spinner-dot"></div><div class="spinner-dot"></div></div></div>
      </div>
    </div>

  </div>
</div>

<script>
const SBU='https://vzfwtyczqfbhbjzotjft.supabase.co';
const SBK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ6Znd0eWN6cWZiaGJqem90amZ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3NDY0OTIsImV4cCI6MjA5MTMyMjQ5Mn0.heto5Qc6WdIjlurllzXhi1PmnRY7_x65Bdof-vKqyGk';
const sb=supabase.createClient(SBU,SBK);
const _EF=SBU+'/functions/v1/auth';
const esc=s=>{const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;};
const timeAgo=d=>{if(!d)return'';const s=(Date.now()-new Date(d))/1000;if(s<60)return"À l'instant";if(s<3600)return`Il y a ${Math.floor(s/60)} min`;if(s<86400)return`Il y a ${Math.floor(s/3600)} h`;if(s<604800)return`Il y a ${Math.floor(s/86400)} j`;return new Date(d).toLocaleDateString('fr-FR',{day:'2-digit',month:'short'});};

let _isAdmin=false;
let _authDone=false;

async function ensureAuth(code){
  if(_authDone)return;
  try{
    const{data:{session}}=await sb.auth.getSession();
    if(session){_authDone=true;return;}
    const r=await fetch(_EF,{method:'POST',headers:{'Content-Type':'application/json','apikey':SBK},body:JSON.stringify({profil_code:code,action:'login'})});
    const d=await r.json();
    if(d.email&&d.password){await sb.auth.signInWithPassword({email:d.email,password:d.password});_authDone=true;}
  }catch(e){console.warn(e);}
}

async function checkAdmin(){
  const code=document.getElementById('gate-input').value.trim();
  const msg=document.getElementById('gate-msg');
  if(code.length!==6){msg.style.color='var(--rouge)';msg.textContent='Code 6 chiffres requis.';return;}
  msg.style.color='var(--txt3)';msg.textContent='Vérification…';
  await ensureAuth(code);
  try{
    const{data}=await sb.from('profils').select('is_admin,prenom').eq('code',code).limit(1);
    if(!data?.length||!data[0].is_admin){msg.style.color='var(--rouge)';msg.textContent='Accès refusé.';return;}
    _isAdmin=true;
    document.getElementById('gate').style.display='none';
    document.getElementById('admin-panel').style.display='block';
    loadAll();
  }catch(e){msg.style.color='var(--rouge)';msg.textContent='Erreur.';console.error(e);}
}

function switchTab(name,btn){
  ['actus','moderation','evts','profils'].forEach(t=>{document.getElementById('tab-'+t).style.display=t===name?'block':'none';});
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

async function loadAll(){
  loadStats();loadActusList();loadModPosts();loadModAnnonces();loadModEvts();loadProfils();
}

async function loadStats(){
  const tables=['profils','posts','stories','annonces','evenements','page_views'];
  const counts=await Promise.all(tables.map(t=>sb.from(t).select('*',{count:'exact',head:true})));
  ['s-profils','s-posts','s-stories','s-annonces','s-evts','s-views'].forEach((id,i)=>{
    const el=document.getElementById(id);if(el)el.textContent=counts[i].count??'—';
  });
}

async function loadActusList(){
  const el=document.getElementById('actus-list');
  const{data}=await sb.from('actus').select('*').order('date_publication',{ascending:false}).limit(20);
  if(!data?.length){el.innerHTML='<div class="empty">Aucune actu.</div>';return;}
  el.innerHTML='<div class="table-head"><div class="table-head-title">Actus publiées</div></div>'+
    data.map(a=>`<div class="table-row">
      <div class="row-main">
        <div class="row-title">${esc(a.titre)}</div>
        <div class="row-sub">${esc(a.categorie||'')} · ${timeAgo(a.date_publication)}</div>
      </div>
      <div class="row-actions">
        <button class="btn-sm btn-del" onclick="deleteActu(${a.id})">Suppr.</button>
      </div>
    </div>`).join('');
}

async function publishActu(){
  const titre=document.getElementById('a-titre').value.trim();
  const contenu=document.getElementById('a-contenu').value.trim();
  const cat=document.getElementById('a-cat').value;
  const dateVal=document.getElementById('a-date').value;
  const photo=document.getElementById('a-photo').value.trim();
  const msg=document.getElementById('a-msg');
  if(!titre||!contenu){msg.style.color='var(--rouge)';msg.textContent='Titre et contenu obligatoires.';return;}
  msg.style.color='var(--txt3)';msg.textContent='Publication…';
  const{error}=await sb.from('actus').insert({titre,contenu,categorie:cat,date_publication:dateVal?new Date(dateVal).toISOString():new Date().toISOString(),photo_url:photo||null,visible:true});
  if(error){msg.style.color='var(--rouge)';msg.textContent='Erreur: '+error.message;return;}
  msg.style.color='var(--green)';msg.textContent='✅ Actu publiée !';
  document.getElementById('a-titre').value='';document.getElementById('a-contenu').value='';document.getElementById('a-photo').value='';
  setTimeout(()=>msg.textContent='',2000);
  loadActusList();loadStats();
}

async function deleteActu(id){
  if(!confirm('Supprimer cette actu ?'))return;
  await sb.from('actus').update({visible:false}).eq('id',id);
  loadActusList();loadStats();
}

async function loadModPosts(){
  const el=document.getElementById('mod-posts');
  const{data}=await sb.from('posts').select('*').eq('visible',true).order('created_at',{ascending:false}).limit(30);
  if(!data?.length){el.innerHTML='<div class="empty">Aucun post.</div>';return;}
  el.innerHTML=data.map(p=>`<div class="table-row">
    <div class="row-av">${(p.prenom||'?')[0].toUpperCase()}</div>
    <div class="row-main">
      <div class="row-title">${esc(p.prenom||'Anonyme')}</div>
      <div class="row-sub">${esc((p.contenu||'').substring(0,80))} · ${timeAgo(p.created_at)}</div>
    </div>
    <div class="row-actions">
      <button class="btn-sm btn-del" onclick="hidePost(${p.id})">Masquer</button>
    </div>
  </div>`).join('');
}
async function hidePost(id){await sb.from('posts').update({visible:false}).eq('id',id);loadModPosts();}

async function loadModAnnonces(){
  const el=document.getElementById('mod-annonces');
  const{data}=await sb.from('annonces').select('*').order('created_at',{ascending:false}).limit(30);
  if(!data?.length){el.innerHTML='<div class="empty">Aucune annonce.</div>';return;}
  el.innerHTML=data.map(a=>`<div class="table-row">
    <div class="row-av" style="background:var(--green)">${(a.prenom||'A')[0].toUpperCase()}</div>
    <div class="row-main">
      <div class="row-title">${esc(a.titre)}</div>
      <div class="row-sub">${esc(a.prenom||'')} · ${timeAgo(a.created_at)} · ${a.visible?'✅ Visible':'⏳ En attente'}</div>
    </div>
    <div class="row-actions">
      ${!a.visible?`<button class="btn-sm btn-ok" onclick="approveAnnonce(${a.id})">Valider</button>`:''}
      <button class="btn-sm btn-del" onclick="hideAnnonce(${a.id})">Masquer</button>
    </div>
  </div>`).join('');
}
async function approveAnnonce(id){await sb.from('annonces').update({visible:true,validee:true}).eq('id',id);loadModAnnonces();}
async function hideAnnonce(id){await sb.from('annonces').update({visible:false}).eq('id',id);loadModAnnonces();}

async function loadModEvts(){
  const el=document.getElementById('mod-evts');
  const{data}=await sb.from('evenements').select('*').order('created_at',{ascending:false}).limit(30);
  if(!data?.length){el.innerHTML='<div class="empty">Aucun événement.</div>';return;}
  el.innerHTML=data.map(e=>`<div class="table-row">
    <div class="row-av" style="background:var(--blue)">ÉVT</div>
    <div class="row-main">
      <div class="row-title">${esc(e.titre)}</div>
      <div class="row-sub">${new Date(e.date_debut).toLocaleDateString('fr-FR')} · ${esc(e.propose_par||'')} · ${e.validee?'✅ Validé':'⏳ En attente'}</div>
    </div>
    <div class="row-actions">
      ${!e.validee?`<button class="btn-sm btn-ok" onclick="approveEvt(${e.id})">Valider</button>`:''}
      <button class="btn-sm btn-del" onclick="hideEvt(${e.id})">Masquer</button>
    </div>
  </div>`).join('');
}
async function approveEvt(id){await sb.from('evenements').update({validee:true,visible:true}).eq('id',id);loadModEvts();}
async function hideEvt(id){await sb.from('evenements').update({visible:false}).eq('id',id);loadModEvts();}

async function loadProfils(){
  const el=document.getElementById('profils-list');
  const{data}=await sb.from('profils').select('*').order('created_at',{ascending:false}).limit(50);
  if(!data?.length){el.innerHTML='<div class="empty">Aucun profil.</div>';return;}
  el.innerHTML=data.map(p=>`<div class="table-row">
    <div class="row-av">${p.photo_url?`<img src="${esc(p.photo_url)}">`:(p.prenom||'?')[0].toUpperCase()}</div>
    <div class="row-main">
      <div class="row-title">${esc(p.prenom||'Anonyme')} ${p.is_admin?'<span style="font-size:.65rem;background:var(--orange);color:#fff;padding:2px 6px;border-radius:4px;margin-left:4px;">Admin</span>':''}</div>
      <div class="row-sub">Code: ${esc(p.code)} · ${esc(p.quartier||'—')} · ${timeAgo(p.created_at)}</div>
    </div>
    <div class="row-actions">
      <button class="btn-sm btn-del" onclick="toggleAdminRole('${p.code}',${!p.is_admin})">${p.is_admin?'Retirer admin':'Rendre admin'}</button>
    </div>
  </div>`).join('');
}
async function toggleAdminRole(code,makeAdmin){
  await sb.from('profils').update({is_admin:makeAdmin}).eq('code',code);
  loadProfils();
}

// Auto-check si déjà admin en localStorage
async function autoCheck(){
  const code=localStorage.getItem('cqp_code');
  if(!code)return;
  await ensureAuth(code);
  try{
    const{data}=await sb.from('profils').select('is_admin').eq('code',code).limit(1);
    if(data?.[0]?.is_admin){
      _isAdmin=true;
      document.getElementById('gate').style.display='none';
      document.getElementById('admin-panel').style.display='block';
      loadAll();
    }
  }catch{}
}
autoCheck();
</script>
</body>
</html>
