<style>
.evt-card{background:#fff;border-radius:var(--r);box-shadow:var(--shadow-card);margin-bottom:10px;overflow:hidden;}
.evt-cover{height:120px;display:flex;flex-direction:column;justify-content:flex-end;padding:16px;position:relative;overflow:hidden;}
.evt-cover::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,#020510,#081a5e,#1877F2);opacity:.97;}
.evt-head{display:flex;align-items:center;gap:10px;padding:12px 14px 6px;}
.evt-body{padding:6px 14px 12px;font-size:.86rem;color:var(--txt2);line-height:1.6;}
.evt-footer{padding:10px 14px;border-top:1px solid var(--bg3);display:flex;align-items:center;gap:8px;}
.modal-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;align-items:flex-end;justify-content:center;}
.modal-ov.open{display:flex;}
.modal-box{background:#fff;border-radius:20px 20px 0 0;padding:20px 16px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;padding-bottom:max(24px,env(safe-area-inset-bottom));}

</head><body>

  <button class="back-btn" onclick="history.back()"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>
  <div class="topbar-logo"><span class="logo-pill">CQP</span><div class="logo-text"><span class="logo-name">Événements</span></div></div>

</header>
<div style="background:linear-gradient(135deg,#020510,#081a5e,#1877F2);padding:20px 16px 18px;display:flex;align-items:center;gap:14px;">
  <div style="width:56px;height:56px;background:rgba(255,255,255,.12);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1.5px solid rgba(255,255,255,.2);">
    <div style="font-family:'Barlow Condensed',sans-serif;font-size:.55rem;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.6);" id="hero-month"></div>
    <div style="font-family:'Bebas Neue',sans-serif;font-size:1.6rem;color:#fff;line-height:1;" id="hero-day"></div>
  </div>
  <div><div style="font-family:'Bebas Neue',sans-serif;font-size:1.4rem;color:#fff;">Agenda CQP</div><div style="font-family:'Barlow Condensed',sans-serif;font-size:.72rem;color:rgba(255,255,255,.6);letter-spacing:1px;" id="hero-sub">Chargement…</div></div>
</div>
<div style="max-width:680px;margin:10px auto;padding:0 10px 16px;" id="evt-list">
  <div class="spinner"><div class="spinner-dot"></div><div class="spinner-dot"></div><div class="spinner-dot"></div></div>
</div>
<div class="modal-ov" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-box">
    <div style="font-family:'Bebas Neue',sans-serif;font-size:1.3rem;margin-bottom:16px;">📅 Proposer un événement</div>
    <div class="fg"><label>Titre *</label><input id="pe-titre" placeholder="Nom de l'événement" maxlength="80" style="width:100%;padding:11px 14px;background:var(--bg3);border:1.5px solid var(--border);border-radius:8px;font-family:'Barlow',sans-serif;font-size:.9rem;outline:none;"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      <div class="fg"><label>Date *</label><input type="datetime-local" id="pe-date" style="width:100%;padding:11px 14px;background:var(--bg3);border:1.5px solid var(--border);border-radius:8px;font-family:'Barlow',sans-serif;font-size:.9rem;outline:none;"></div>
      <div class="fg"><label>Catégorie</label><select id="pe-cat" style="width:100%;padding:11px 14px;background:var(--bg3);border:1.5px solid var(--border);border-radius:8px;font-family:'Barlow',sans-serif;font-size:.9rem;outline:none;"><option>Réunion</option><option>Manifestation</option><option>Culture</option><option>Solidarité</option><option>Sport</option><option>Autre</option></select></div>
    </div>
    <div class="fg"><label>Lieu</label><input id="pe-lieu" placeholder="Adresse ou salle" maxlength="100" style="width:100%;padding:11px 14px;background:var(--bg3);border:1.5px solid var(--border);border-radius:8px;font-family:'Barlow',sans-serif;font-size:.9rem;outline:none;"></div>
    <div class="fg"><label>Description</label><textarea id="pe-desc" rows="3" placeholder="Décrivez l'événement…" maxlength="500" style="width:100%;padding:11px 14px;background:var(--bg3);border:1.5px solid var(--border);border-radius:8px;font-family:'Barlow',sans-serif;font-size:.9rem;outline:none;resize:vertical;"></textarea></div>
    <div class="fg"><label>Votre prénom *</label><input id="pe-prenom" maxlength="30" style="width:100%;padding:11px 14px;background:var(--bg3);border:1.5px solid var(--border);border-radius:8px;font-family:'Barlow',sans-serif;font-size:.9rem;outline:none;"></div>
    <button class="btn-rouge" onclick="submitEvt()">📅 Proposer l'événement</button>
    <div class="form-msg" id="pe-msg"></div>
    <button onclick="closeModal()" style="width:100%;padding:12px;background:none;border:none;color:var(--txt3);font-family:'Barlow Condensed',sans-serif;font-size:.78rem;letter-spacing:1px;margin-top:4px;cursor:pointer;">Annuler</button>
  </div>
</div>
<!-- MODAL INSCRIPTION -->
<div class="modal-ov" id="modal-ins" onclick="if(event.target===this)closeInsModal()">
  <div class="modal-box">
    <div style="font-family:'Bebas Neue',sans-serif;font-size:1.3rem;margin-bottom:4px;">S'inscrire</div>
    <div style="font-size:.85rem;color:var(--txt2);margin-bottom:16px;" id="ins-titre-display"></div>
    <div class="fg"><label>Prénom *</label><input id="ins-prenom" maxlength="30" style="width:100%;padding:11px 14px;background:var(--bg3);border:1.5px solid var(--border);border-radius:8px;font-family:'Barlow',sans-serif;font-size:.9rem;outline:none;"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      <div class="fg"><label>Nom *</label><input id="ins-nom" maxlength="40" style="width:100%;padding:11px 14px;background:var(--bg3);border:1.5px solid var(--border);border-radius:8px;font-family:'Barlow',sans-serif;font-size:.9rem;outline:none;"></div>
      <div class="fg"><label>Email *</label><input id="ins-email" type="email" style="width:100%;padding:11px 14px;background:var(--bg3);border:1.5px solid var(--border);border-radius:8px;font-family:'Barlow',sans-serif;font-size:.9rem;outline:none;"></div>
    </div>
    <div class="fg"><label>Téléphone</label><input id="ins-tel" type="tel" style="width:100%;padding:11px 14px;background:var(--bg3);border:1.5px solid var(--border);border-radius:8px;font-family:'Barlow',sans-serif;font-size:.9rem;outline:none;"></div>
    <button class="btn-rouge" onclick="submitInscription()">Confirmer mon inscription</button>
    <div class="form-msg" id="ins-msg"></div>
    <button onclick="closeInsModal()" style="width:100%;padding:10px;background:none;border:none;color:var(--txt3);font-family:'Barlow Condensed',sans-serif;font-size:.78rem;cursor:pointer;margin-top:4px;">Annuler</button>
  </div>
</div>

  <div class="nav-center"><button class="nav-pub" onclick="openModal()" aria-label="Proposer un événement"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button></div>

  <a class="nav-item" href="profil.html"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Profil</a>
</nav>
<script>
const esc=s=>Utils.esc(s),timeAgo=d=>Utils.timeAgo(d)
const now=new Date()
document.getElementById('hero-month').textContent=now.toLocaleDateString('fr-FR',{month:'short'}).toUpperCase()
document.getElementById('hero-day').textContent=now.getDate()
const _inscrits=new Set(JSON.parse(localStorage.getItem('cqp_inscriptions')||'[]'))
async function load(){
  const el=document.getElementById('evt-list')
  const{data,error}=await Api.getEvenements(20)
  if(error||!data?.length){el.innerHTML='<div class="empty" style="text-align:center;padding:48px 20px"><div style="font-size:2.5rem;margin-bottom:12px">📅</div><div style="font-weight:700;font-size:1rem;margin-bottom:8px">Aucun événement à venir</div><div style="color:var(--txt3);font-size:.85rem;line-height:1.6">Vous organisez quelque chose dans le quartier ?<br>Proposez-le avec le bouton + Proposer !</div></div>';document.getElementById('hero-sub').textContent='Aucun événement à venir';return}
  document.getElementById('hero-sub').textContent=`${data.length} événement${data.length>1?'s':''} à venir`
  el.innerHTML=data.map(e=>{
    const d=new Date(e.date_debut)
    const day=d.getDate(),month=d.toLocaleDateString('fr-FR',{month:'short'}).toUpperCase()
    const heure=d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})
    const ins=_inscrits.has(e.id)
    return `<div class="evt-card">
      <div class="evt-cover"><div style="position:relative;z-index:1;"><div style="font-family:'Barlow Condensed',sans-serif;font-size:.65rem;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.6);">${month}</div><div style="font-family:'Bebas Neue',sans-serif;font-size:2rem;color:#fff;line-height:1;">${day}</div></div></div>
      <div class="evt-head">
        <div style="flex:1"><div style="font-weight:600;font-size:.94rem;">${esc(e.titre)}</div><div style="font-size:.78rem;color:var(--txt3);">📅 ${day} ${month} à ${heure}${e.lieu?' · 📍 '+esc(e.lieu):''}</div></div>
        <span class="badge badge-blue">${esc(e.categorie||'Evt')}</span>
      </div>
      ${e.description?`<div class="evt-body">${esc(e.description.substring(0,160))}${e.description.length>160?'…':''}</div>`:''}
      <div class="evt-footer">
        <span class="tag">${Utils.countdown(e.date_debut)}</span>
        <button id="ins-${e.id}" onclick="openInscription(${e.id},'${Utils.esc(e.titre)}')" style="flex:1;padding:10px;background:${_inscrits.has(e.id)?'var(--green)':'var(--blue)'};border:none;border-radius:22px;color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:.78rem;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;">${_inscrits.has(e.id)?'✅ Inscrit':"S'inscrire"}</button>
      </div>
    </div>`
  }).join('')
}
let _currentInsEvtId=null
function openInscription(id,titre){
  _currentInsEvtId=id
  const el=document.getElementById('ins-titre-display');if(el)el.textContent=titre||''
  const p=Auth.getPrenom();if(p){const inp=document.getElementById('ins-prenom');if(inp)inp.value=p}
  document.getElementById('modal-ins').classList.add('open');document.body.style.overflow='hidden'
}
function closeInsModal(){document.getElementById('modal-ins').classList.remove('open');document.body.style.overflow=''}
async function submitInscription(){
  const prenom=document.getElementById('ins-prenom').value.trim()
  const nom=document.getElementById('ins-nom').value.trim()
  const email=document.getElementById('ins-email').value.trim()
  const tel=document.getElementById('ins-tel')?.value.trim()
  const msg=document.getElementById('ins-msg')
  if(!prenom||!nom||!email){msg.style.color='var(--rouge)';msg.textContent='Prénom, nom et email obligatoires.';return}
  msg.style.color='var(--txt3)';msg.textContent='Inscription en cours…'
  const{error}=await Api.createInscription({evenement_id:_currentInsEvtId,prenom,nom,email,telephone:tel||null})
  if(error){msg.style.color='var(--rouge)';msg.textContent='Erreur: '+error.message;return}
  _inscrits.add(_currentInsEvtId)
  localStorage.setItem('cqp_inscriptions',JSON.stringify([..._inscrits]))
  const btn=document.getElementById('ins-'+_currentInsEvtId)
  if(btn){btn.textContent='✅ Inscrit';btn.style.background='var(--green)'}
  msg.style.color='var(--green)';msg.textContent='✅ Inscription confirmée !'
  setTimeout(closeInsModal,1500)
}
function openModal(){
  const p=Auth.getPrenom();if(p){const el=document.getElementById('pe-prenom');el.value=p;el.readOnly=true;}
  document.getElementById('modal').classList.add('open');document.body.style.overflow='hidden'
}
function closeModal(){document.getElementById('modal').classList.remove('open');document.body.style.overflow=''}
async function submitEvt(){
  const titre=document.getElementById('pe-titre').value.trim()
  const dateVal=document.getElementById('pe-date').value
  const cat=document.getElementById('pe-cat').value
  const lieu=document.getElementById('pe-lieu').value.trim()
  const desc=document.getElementById('pe-desc').value.trim()
  const prenom=document.getElementById('pe-prenom').value.trim()||Auth.getPrenom()
  const msg=document.getElementById('pe-msg')
  if(!titre||!dateVal||!prenom){msg.style.color='var(--rouge)';msg.textContent='Titre, date et prénom obligatoires.';return}
  msg.style.color='var(--txt3)';msg.textContent='Envoi…'
  const{error}=await Api.createEvenement({titre,date_debut:new Date(dateVal).toISOString(),categorie:cat,lieu:lieu||'',description:desc||'',propose_par:prenom})
  if(error){msg.style.color='var(--rouge)';msg.textContent='Erreur: '+error.message;return}
  msg.style.color='var(--green)';msg.textContent='✅ Proposé — validation sous 24h.'
  setTimeout(closeModal,2000)
}
load();Api.trackView('evenements')
if(window.location.search.includes('new=1'))openModal()
</script>
