<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#C8102E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Événements — CQP Toulouse</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--rouge:#C8102E;--blue:#1877F2;--green:#42B72A;--orange:#EA580C;
  --txt:#050505;--txt2:#65676B;--txt3:#8A8D91;
  --bg:#F0F2F5;--bg3:#E4E6EB;--border:#CED0D4;
  --shadow:0 1px 2px rgba(0,0,0,.1);--r:10px;--nav:56px;}
html,body{font-size:15px;background:var(--bg);color:var(--txt);font-family:'Barlow',sans-serif;min-height:100vh;}
body{padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 4px);}
a{text-decoration:none;color:inherit}button,label{cursor:pointer;font-family:inherit;outline:none;border:none;}

.topbar{position:sticky;top:0;z-index:100;height:var(--nav);background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:0 14px;box-shadow:var(--shadow);}
.back-btn{width:36px;height:36px;background:var(--bg3);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.back-btn svg{width:20px;height:20px;stroke:var(--txt);fill:none;stroke-width:2;stroke-linecap:round;}
.topbar-title{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:.5px;flex:1;}
.btn-new{padding:8px 16px;background:var(--blue);border:none;border-radius:20px;color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:.72rem;letter-spacing:1.5px;text-transform:uppercase;}

/* HERO CALENDAR */
.cal-hero{background:linear-gradient(135deg,#050a1a 0%,#0e2472 60%,var(--blue) 100%);padding:20px 16px;display:flex;align-items:center;gap:14px;}
.cal-icon{width:56px;height:56px;background:rgba(255,255,255,.12);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1.5px solid rgba(255,255,255,.2);}
.cal-icon-month{font-family:'Barlow Condensed',sans-serif;font-size:.55rem;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.6);}
.cal-icon-day{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;color:#fff;line-height:1;}
.cal-info{flex:1;}
.cal-title{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;color:#fff;letter-spacing:.5px;}
.cal-sub{font-family:'Barlow Condensed',sans-serif;font-size:.72rem;color:rgba(255,255,255,.6);letter-spacing:1px;margin-top:2px;}

/* SECTIONS */
.section-head{display:flex;align-items:center;gap:8px;padding:16px 14px 8px;}
.section-head-title{font-family:'Barlow Condensed',sans-serif;font-size:.65rem;letter-spacing:2.5px;text-transform:uppercase;color:var(--txt3);flex:1;}
.section-head-count{font-family:'Barlow Condensed',sans-serif;font-size:.65rem;letter-spacing:1px;color:var(--txt3);}

/* EVT CARD */
.evt-list{max-width:680px;margin:0 auto;padding:0 10px 16px;}
.evt-card{background:#fff;border-radius:var(--r);margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow);}
.evt-cover{height:130px;position:relative;overflow:hidden;}
.evt-cover img{width:100%;height:100%;object-fit:cover;}
.evt-cover-bg{width:100%;height:100%;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;position:relative;}
.evt-cover-bg::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,#050a1a 0%,#0e2472 60%,var(--blue) 100%);opacity:.96;}
.evt-date-badge{position:relative;z-index:1;font-family:'Bebas Neue',sans-serif;font-size:2rem;color:#fff;line-height:1;}
.evt-date-day{font-family:'Barlow Condensed',sans-serif;font-size:.65rem;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.6);position:relative;z-index:1;}
.evt-head{display:flex;align-items:center;gap:10px;padding:12px 14px 6px;}
.evt-av{width:38px;height:38px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:.85rem;color:#fff;flex-shrink:0;}
.evt-meta{flex:1;}
.evt-title{font-family:'Barlow',sans-serif;font-weight:600;font-size:.94rem;}
.evt-info{font-size:.78rem;color:var(--txt3);margin-top:2px;}
.evt-badge{font-family:'Barlow Condensed',sans-serif;font-size:.6rem;letter-spacing:1.5px;text-transform:uppercase;padding:3px 9px;border-radius:4px;color:#fff;background:var(--blue);}
.evt-body{padding:8px 14px 12px;}
.evt-desc{font-size:.86rem;color:var(--txt2);line-height:1.6;}
.evt-footer{padding:10px 14px;border-top:1px solid var(--bg3);display:flex;align-items:center;gap:8px;}
.countdown-pill{font-family:'Barlow Condensed',sans-serif;font-size:.7rem;letter-spacing:1px;padding:4px 10px;border-radius:20px;background:#e7f3ff;color:var(--blue);}
.btn-inscrire{flex:1;padding:10px;background:var(--blue);border:none;border-radius:22px;color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:.78rem;letter-spacing:1.5px;text-transform:uppercase;}
.btn-inscrire:active{opacity:.85;}
.btn-inscrit{background:var(--green);}

/* MODAL */
.modal-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;align-items:flex-end;justify-content:center;}
.modal-ov.open{display:flex;}
.modal-box{background:#fff;border-radius:20px 20px 0 0;padding:20px 16px;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;padding-bottom:max(24px,env(safe-area-inset-bottom));}
.modal-title{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:.5px;margin-bottom:16px;}
.fg{margin-bottom:12px;}
.fg label{display:block;font-family:'Barlow Condensed',sans-serif;font-size:.65rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--txt3);margin-bottom:5px;}
.fg input,.fg select,.fg textarea{width:100%;padding:11px 14px;background:var(--bg3);border:1.5px solid var(--border);border-radius:8px;color:var(--txt);font-family:'Barlow',sans-serif;font-size:.9rem;outline:none;transition:border .15s;resize:vertical;}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--blue);}
.fg-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.btn-submit{width:100%;padding:14px;background:var(--blue);border:none;border-radius:8px;color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:.88rem;letter-spacing:2px;text-transform:uppercase;margin-top:4px;}
.form-msg{text-align:center;font-size:.8rem;min-height:18px;margin-top:8px;}

.spinner{display:flex;align-items:center;justify-content:center;gap:8px;padding:40px;}
.spinner-dot{width:8px;height:8px;border-radius:50%;background:var(--blue);animation:bounce .9s infinite;}
.spinner-dot:nth-child(2){animation-delay:.15s;}.spinner-dot:nth-child(3){animation-delay:.3s;}
@keyframes bounce{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.7)}}
.empty{text-align:center;padding:48px 20px;color:var(--txt3);font-family:'Barlow Condensed',sans-serif;font-size:.85rem;letter-spacing:1px;}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:200;background:#fff;border-top:1px solid var(--border);display:flex;align-items:stretch;height:var(--nav);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -1px 8px rgba(0,0,0,.06);}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:none;border:none;color:var(--txt3);font-family:'Barlow Condensed',sans-serif;font-size:.5rem;letter-spacing:.5px;text-transform:uppercase;text-decoration:none;padding:6px 0;}
.nav-item.active,.nav-item:hover{color:var(--rouge);}
.nav-item svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.nav-center{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:4px;}
.nav-pub{width:50px;height:50px;border-radius:50%;background:var(--rouge);border:none;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 14px rgba(200,16,46,.4);margin-top:-14px;}
.nav-pub svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;}
@media(min-width:700px){.bottom-nav{display:none;}body{padding-bottom:0;}}
</style>
</head>
<body>

<header class="topbar">
  <button class="back-btn" onclick="history.length>1?history.back():location.href='index.html'">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
  </button>
  <span class="topbar-title">📅 Événements</span>
  <button class="btn-new" onclick="openModal()">+ Proposer</button>
</header>

<div class="cal-hero">
  <div class="cal-icon">
    <div class="cal-icon-month" id="hero-month"></div>
    <div class="cal-icon-day" id="hero-day"></div>
  </div>
  <div class="cal-info">
    <div class="cal-title">Agenda CQP</div>
    <div class="cal-sub" id="hero-sub">Chargement…</div>
  </div>
</div>

<div class="section-head">
  <div class="section-head-title">À venir</div>
  <div class="section-head-count" id="count-evts"></div>
</div>

<div class="evt-list" id="evt-list">
  <div class="spinner"><div class="spinner-dot"></div><div class="spinner-dot"></div><div class="spinner-dot"></div></div>
</div>

<!-- MODAL PROPOSER -->
<div class="modal-ov" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-box">
    <div class="modal-title">📅 Proposer un événement</div>
    <p style="font-size:.84rem;color:var(--txt2);margin-bottom:16px;line-height:1.7">Votre événement sera publié après validation par l'équipe CQP.</p>
    <div class="fg"><label>Titre *</label><input id="pe-titre" placeholder="Nom de l'événement" maxlength="80"></div>
    <div class="fg-row">
      <div class="fg"><label>Date *</label><input type="datetime-local" id="pe-date"></div>
      <div class="fg"><label>Catégorie</label><select id="pe-cat"><option>Réunion</option><option>Manifestation</option><option>Culture</option><option>Solidarité</option><option>Sport</option><option>Autre</option></select></div>
    </div>
    <div class="fg"><label>Lieu</label><input id="pe-lieu" placeholder="Adresse ou salle" maxlength="100"></div>
    <div class="fg"><label>Description</label><textarea id="pe-desc" rows="3" placeholder="Décrivez l'événement…" maxlength="500"></textarea></div>
    <div class="fg"><label>Votre prénom *</label><input id="pe-prenom" placeholder="Prénom" maxlength="30" readonly></div>
    <button class="btn-submit" onclick="submitEvt()">📅 Proposer l'événement</button>
    <div class="form-msg" id="pe-msg"></div>
    <button onclick="closeModal()" style="width:100%;padding:12px;background:none;border:none;color:var(--txt3);font-family:'Barlow Condensed',sans-serif;font-size:.78rem;letter-spacing:1px;margin-top:4px;">Annuler</button>
  </div>
</div>

<nav class="bottom-nav">
  <a class="nav-item" href="index.html"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Accueil</a>
  <a class="nav-item" href="groupes.html"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Groupes</a>
  <div class="nav-center"><button class="nav-pub" onclick="openModal()"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button></div>
  <a class="nav-item" href="actus.html"><svg viewBox="0 0 24 24"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>Actus</a>
  <a class="nav-item" href="profil.html"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Profil</a>
</nav>

<script>
const SBU='https://vzfwtyczqfbhbjzotjft.supabase.co';
const SBK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ6Znd0eWN6cWZiaGJqem90amZ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3NDY0OTIsImV4cCI6MjA5MTMyMjQ5Mn0.heto5Qc6WdIjlurllzXhi1PmnRY7_x65Bdof-vKqyGk';
const sb=supabase.createClient(SBU,SBK);
const _EF=SBU+'/functions/v1/auth';
const esc=s=>{const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;};
const getCode=()=>localStorage.getItem('cqp_code')||null;
const getPrenom=()=>localStorage.getItem('cqp_prenom')||'';
const _codeToEmail=c=>`code-${c}@cqp-toulouse.fr`;
const _codeToPass=c=>`cqp-${c}-secret2025`;
let _authDone=false;
async function ensureAuth(){if(_authDone)return;const code=localStorage.getItem('cqp_code');if(!code)return;try{const{data:{session}}=await sb.auth.getSession();if(session){_authDone=true;return;}const{error}=await sb.auth.signInWithPassword({email:_codeToEmail(code),password:_codeToPass(code)});if(!error){_authDone=true;return;}await sb.auth.signUp({email:_codeToEmail(code),password:_codeToPass(code),options:{data:{profil_code:code}}});await sb.auth.signInWithPassword({email:_codeToEmail(code),password:_codeToPass(code)});_authDone=true;}catch(e){console.warn(e);}}

const now=new Date();
document.getElementById('hero-month').textContent=now.toLocaleDateString('fr-FR',{month:'short'}).toUpperCase();
document.getElementById('hero-day').textContent=now.getDate();

const countdown=d=>{const ms=new Date(d)-Date.now();if(ms<0)return'Passé';const days=Math.floor(ms/86400000);if(days===0)return'⚡ Aujourd\'hui';if(days===1)return'🔴 Demain';if(days<=7)return`🟠 Dans ${days} j`;return`📅 ${new Date(d).toLocaleDateString('fr-FR',{day:'numeric',month:'short'})}`;};

async function loadEvts(){
  const el=document.getElementById('evt-list');
  try{
    const{data,error}=await sb.from('evenements').select('*').eq('visible',true).eq('validee',true)
      .gte('date_debut',new Date().toISOString()).order('date_debut',{ascending:true}).limit(30);
    if(error||!data?.length){
      el.innerHTML='<div class="empty">Aucun événement à venir.<br>Soyez le premier à en proposer un !</div>';
      document.getElementById('hero-sub').textContent='Aucun événement prévu';
      document.getElementById('count-evts').textContent='';
      return;
    }
    document.getElementById('hero-sub').textContent=`${data.length} événement${data.length>1?'s':''} à venir`;
    document.getElementById('count-evts').textContent=`${data.length} résultat${data.length>1?'s':''}`;
    el.innerHTML=data.map(e=>{
      const d=new Date(e.date_debut);
      const day=d.getDate();
      const month=d.toLocaleDateString('fr-FR',{month:'short'}).toUpperCase();
      const heure=d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
      return `<div class="evt-card">
        <div class="evt-cover">
          ${e.photo_url
            ?`<img src="${esc(e.photo_url)}" alt="" loading="lazy">`
            :`<div class="evt-cover-bg"><div class="evt-date-day">${month}</div><div class="evt-date-badge">${day}</div></div>`}
        </div>
        <div class="evt-head">
          <div class="evt-av">ÉVT</div>
          <div class="evt-meta">
            <div class="evt-title">${esc(e.titre)}</div>
            <div class="evt-info">📅 ${day} ${month} à ${heure}${e.lieu?' · 📍 '+esc(e.lieu):''}</div>
          </div>
          <span class="evt-badge">${esc(e.categorie||'Événement')}</span>
        </div>
        ${e.description?`<div class="evt-body"><div class="evt-desc">${esc(e.description.substring(0,180))}${e.description.length>180?'…':''}</div></div>`:''}
        <div class="evt-footer">
          <span class="countdown-pill">${countdown(e.date_debut)}</span>
          <button class="btn-inscrire" id="ins-${e.id}" onclick="toggleInscription(${e.id},this)">S'inscrire</button>
        </div>
      </div>`;
    }).join('');
    checkInscriptions(data.map(e=>e.id));
  }catch(err){el.innerHTML='<div class="empty">⚠️ Connexion impossible.</div>';console.error(err);}
}

const _inscriptions=new Set(JSON.parse(localStorage.getItem('cqp_inscriptions')||'[]'));
function checkInscriptions(ids){ids.forEach(id=>{if(_inscriptions.has(id)){const btn=document.getElementById('ins-'+id);if(btn){btn.textContent='✅ Inscrit';btn.classList.add('btn-inscrit');}}});}
async function toggleInscription(id,btn){
  if(!getCode()){window.location.href='profil.html';return;}
  const inscrit=_inscriptions.has(id);
  if(!inscrit){_inscriptions.add(id);btn.textContent='✅ Inscrit';btn.classList.add('btn-inscrit');}
  else{_inscriptions.delete(id);btn.textContent='S\'inscrire';btn.classList.remove('btn-inscrit');}
  localStorage.setItem('cqp_inscriptions',JSON.stringify([..._inscriptions]));
  await ensureAuth();
  if(!inscrit)await sb.from('event_inscriptions').insert({evenement_id:id,profil_code:getCode()}).catch(()=>{});
  else await sb.from('event_inscriptions').delete().eq('evenement_id',id).eq('profil_code',getCode()).catch(()=>{});
}

function openModal(){
  const prenom=getPrenom();
  if(prenom){const el=document.getElementById('pe-prenom');el.value=prenom;el.readOnly=true;}
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeModal(){document.getElementById('modal').classList.remove('open');document.body.style.overflow='';}

async function submitEvt(){
  await ensureAuth();
  const titre=document.getElementById('pe-titre').value.trim();
  const dateVal=document.getElementById('pe-date').value;
  const cat=document.getElementById('pe-cat').value;
  const lieu=document.getElementById('pe-lieu').value.trim();
  const desc=document.getElementById('pe-desc').value.trim();
  const prenom=document.getElementById('pe-prenom').value.trim()||getPrenom();
  const msg=document.getElementById('pe-msg');
  if(!titre||!dateVal||!prenom){msg.style.color='var(--rouge)';msg.textContent='Titre, date et prénom obligatoires.';return;}
  msg.style.color='var(--txt3)';msg.textContent='Envoi…';
  const{error}=await sb.from('evenements').insert({titre,date_debut:new Date(dateVal).toISOString(),categorie:cat,lieu:lieu||'',description:desc||'',propose_par:prenom,visible:false,validee:false});
  if(error){msg.style.color='var(--rouge)';msg.textContent='Erreur: '+error.message;return;}
  msg.style.color='var(--green)';msg.textContent='✅ Événement proposé — validation sous 24h.';
  setTimeout(closeModal,2000);
}

loadEvts();
</script>
</body>
</html>
