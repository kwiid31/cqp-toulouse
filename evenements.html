<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f0ede6">
<title>Agenda — CQP Toulouse</title>
<link rel="stylesheet" href="/css/main.css">
<style>
body{background:#f0ede6;margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.page-wrap{max-width:600px;margin:0 auto;padding-bottom:100px}

/* Topbar */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));background:#f0ede6;position:sticky;top:0;z-index:50}
.topbar-title{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:18px;letter-spacing:1px;text-transform:uppercase}
.back-btn{background:none;border:none;cursor:pointer;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:#fff}
.btn-proposer{background:#C8102E;color:#fff;border:none;border-radius:20px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}

/* Header date */
.agenda-header{background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);padding:20px 16px;margin:0 0 16px;color:#fff}
.agenda-header h1{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:28px;margin:0 0 4px;letter-spacing:.5px}
.agenda-header p{font-size:13px;opacity:.7;margin:0}
.agenda-date{display:inline-flex;flex-direction:column;align-items:center;background:rgba(255,255,255,.15);border-radius:12px;padding:8px 14px;margin-bottom:12px}
.agenda-date .mois{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;opacity:.8}
.agenda-date .jour{font-size:32px;font-weight:900;line-height:1;font-family:'Barlow Condensed',sans-serif}

/* Filtres */
.filters{display:flex;gap:8px;padding:0 16px 12px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filter-btn{flex-shrink:0;padding:6px 14px;border-radius:20px;border:1px solid #ddd;background:#fff;font-size:13px;font-family:inherit;cursor:pointer;transition:all .15s;white-space:nowrap}
.filter-btn.active{background:#C8102E;color:#fff;border-color:#C8102E}

/* Cards événement */
.evt-list{padding:0 16px;display:flex;flex-direction:column;gap:12px}
.evt-card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.06);cursor:pointer;transition:transform .15s}
.evt-card:active{transform:scale(.98)}
.evt-cover{width:100%;height:160px;object-fit:cover;display:block;background:#e8e3db}
.evt-cover-placeholder{width:100%;height:140px;background:linear-gradient(135deg,#1a1a2e,#0f3460);display:flex;align-items:center;justify-content:center}
.evt-cover-placeholder span{font-size:40px}
.evt-body{padding:14px}
.evt-badge{display:inline-block;background:#f0f0f0;color:#666;font-size:11px;font-weight:600;padding:3px 8px;border-radius:10px;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.evt-titre{font-size:16px;font-weight:700;color:#1a1a1a;margin:0 0 6px;line-height:1.3}
.evt-meta{font-size:13px;color:#888;display:flex;flex-direction:column;gap:3px}
.evt-meta span{display:flex;align-items:center;gap:4px}
.evt-desc{font-size:13px;color:#555;margin-top:8px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.evt-footer{display:flex;gap:8px;margin-top:12px}
.btn-inscrire{flex:1;background:#C8102E;color:#fff;border:none;border-radius:10px;padding:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-inscrire.inscrit{background:#22c55e}
.btn-lire{background:#f0f0f0;color:#555;border:none;border-radius:10px;padding:10px 14px;font-size:14px;cursor:pointer;font-family:inherit}

/* Vide */
.empty-state{text-align:center;padding:60px 24px;color:#888}
.empty-state div{font-size:48px;margin-bottom:12px}
.empty-state p{font-size:15px}

/* Modal détail */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:none;align-items:flex-end}
.modal-overlay.open{display:flex}
.modal-box{background:#fff;border-radius:20px 20px 0 0;width:100%;max-height:88vh;overflow-y:auto;padding-bottom:max(24px,env(safe-area-inset-bottom))}
.modal-img{width:100%;height:200px;object-fit:cover;display:block}
.modal-content{padding:20px 16px}
.modal-badge{font-size:11px;font-weight:700;color:#C8102E;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.modal-titre{font-size:20px;font-weight:700;margin:0 0 12px;line-height:1.3}
.modal-meta{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.modal-meta span{font-size:14px;color:#555;display:flex;align-items:center;gap:6px}
.modal-desc{font-size:14px;color:#333;line-height:1.6;margin-bottom:20px}
.modal-close{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.2);border:none;cursor:pointer;color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center}

/* Loading */
.loading{display:flex;justify-content:center;padding:40px;color:#888;font-size:14px}

</style>
</head>
<body>
<div class="page-wrap">

  <div class="topbar">
    <button class="back-btn" onclick="history.back()">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <span class="topbar-title">📅 Agenda</span>
    <button class="btn-proposer" onclick="window.location.href='ia.html'">+ Proposer</button>
  </div>

  <div class="agenda-header">
    <div class="agenda-date">
      <span class="mois" id="h-mois">JUN</span>
      <span class="jour" id="h-jour">10</span>
    </div>
    <h1>Agenda CQP</h1>
    <p id="h-count">Chargement...</p>
  </div>

  <div class="filters" id="filters">
    <button class="filter-btn active" data-cat="">Tout</button>
    <button class="filter-btn" data-cat="Sport">⚽ Sport</button>
    <button class="filter-btn" data-cat="Culture">🎭 Culture</button>
    <button class="filter-btn" data-cat="Fête">🎉 Fête</button>
    <button class="filter-btn" data-cat="Réunion">🗣️ Réunion</button>
    <button class="filter-btn" data-cat="Atelier">🎨 Atelier</button>
    <button class="filter-btn" data-cat="Concert">🎵 Concert</button>
  </div>

  <div class="evt-list" id="evt-list">
    <div class="loading">Chargement des événements...</div>
  </div>

</div>

<!-- Modal détail -->
<div class="modal-overlay" id="modal-detail" onclick="if(event.target===this)closeModal()">
  <div class="modal-box" style="position:relative">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <img id="modal-img" src="" alt="" style="display:none" class="modal-img">
    <div class="modal-content">
      <div class="modal-badge" id="modal-cat">Événement</div>
      <div class="modal-titre" id="modal-titre"></div>
      <div class="modal-meta">
        <span>📅 <span id="modal-date"></span></span>
        <span id="modal-lieu-wrap" style="display:none">📍 <span id="modal-lieu"></span></span>
      </div>
      <div class="modal-desc" id="modal-desc"></div>
      <button class="btn-inscrire" id="modal-inscrire-btn" onclick="inscrireModal()">S'inscrire</button>
    </div>
  </div>
</div>

<!-- Navbar -->
<nav class="bottom-nav">
  <a class="nav-item" href="index.html" aria-label="Accueil">
    <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
  </a>
  <a class="nav-item" href="explorer.html" aria-label="Explorer">
    <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
  </a>
  <div class="nav-center">
    <button class="nav-pub" onclick="window.location.href='ia.html'" aria-label="Publier">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="white"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
    </button>
  </div>
  <a class="nav-item" href="notifs.html" aria-label="Notifications">
    <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
  </a>
  <a class="nav-item" href="profil.html" aria-label="Profil">
    <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
  </a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/app.js?v=610759"></script>
<script src="/js/utils.js?v=610759"></script>
<script src="/js/auth.js?v=610759"></script>
<script src="/js/api.js?v=610759"></script>
<script>
const esc = s => Utils.esc(s)
const _inscrits = new Set(JSON.parse(localStorage.getItem('cqp_inscriptions') || '[]'))
let _allEvts = []
let _currentEvt = null

// Header date
const now = new Date()
document.getElementById('h-mois').textContent = now.toLocaleDateString('fr-FR', {month:'short'}).toUpperCase()
document.getElementById('h-jour').textContent = now.getDate()

// Filtres
document.getElementById('filters').addEventListener('click', e => {
  const btn = e.target.closest('.filter-btn')
  if (!btn) return
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'))
  btn.classList.add('active')
  renderList(btn.dataset.cat)
})

async function load() {
  const el = document.getElementById('evt-list')
  const { data, error } = await Api.getEvenements(null, 50)
  if (error || !data?.length) {
    el.innerHTML = '<div class="empty-state"><div>📅</div><p>Aucun événement à venir.<br>Sois le premier à en proposer un !</p></div>'
    document.getElementById('h-count').textContent = 'Aucun événement à venir'
    return
  }
  _allEvts = data
  document.getElementById('h-count').textContent = data.length + ' événement' + (data.length > 1 ? 's' : '') + ' à venir'
  renderList('')
}

function renderList(cat) {
  const el = document.getElementById('evt-list')
  const filtered = cat ? _allEvts.filter(e => (e.categorie || '').toLowerCase().includes(cat.toLowerCase())) : _allEvts
  if (!filtered.length) {
    el.innerHTML = '<div class="empty-state"><div>🔍</div><p>Aucun événement dans cette catégorie.</p></div>'
    return
  }
  el.innerHTML = filtered.map(e => cardHTML(e)).join('')
}

function cardHTML(e) {
  const d = e.date_debut ? new Date(e.date_debut) : null
  const dateStr = d ? d.toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long'}) : ''
  const heureStr = d ? d.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'}) : ''
  const img = e.image_url || e.photo_url
  const inscrit = _inscrits.has(e.id)
  return `<div class="evt-card" onclick="openDetail(${e.id})">
    ${img
      ? `<img class="evt-cover" src="${esc(img)}" alt="${esc(e.titre)}" loading="lazy">`
      : `<div class="evt-cover-placeholder"><span>📅</span></div>`
    }
    <div class="evt-body">
      <div class="evt-badge">${esc(e.categorie || 'Événement')}</div>
      <div class="evt-titre">${esc(e.titre)}</div>
      <div class="evt-meta">
        ${dateStr ? `<span>📅 ${dateStr}${heureStr ? ' à ' + heureStr : ''}</span>` : ''}
        ${e.lieu ? `<span>📍 ${esc(e.lieu)}</span>` : ''}
      </div>
      ${e.description ? `<div class="evt-desc">${esc(e.description)}</div>` : ''}
      <div class="evt-footer">
        <button class="btn-lire" onclick="event.stopPropagation();openDetail(${e.id})">Lire +</button>
        <button class="btn-inscrire ${inscrit ? 'inscrit' : ''}" onclick="event.stopPropagation();inscrire(${e.id},this)">
          ${inscrit ? '✅ Inscrit' : "S'inscrire"}
        </button>
      </div>
    </div>
  </div>`
}

function openDetail(id) {
  const e = _allEvts.find(x => x.id === id)
  if (!e) return
  _currentEvt = e
  const d = e.date_debut ? new Date(e.date_debut) : null
  const dateStr = d ? d.toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long', year:'numeric'}) : ''
  const heureStr = d ? d.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'}) : ''
  const img = e.image_url || e.photo_url
  const modalImg = document.getElementById('modal-img')
  if (img) { modalImg.src = img; modalImg.style.display = 'block' }
  else { modalImg.style.display = 'none' }
  document.getElementById('modal-cat').textContent = e.categorie || 'Événement'
  document.getElementById('modal-titre').textContent = e.titre || ''
  document.getElementById('modal-date').textContent = (dateStr || '') + (heureStr ? ' à ' + heureStr : '')
  const lieuWrap = document.getElementById('modal-lieu-wrap')
  if (e.lieu) { document.getElementById('modal-lieu').textContent = e.lieu; lieuWrap.style.display = 'flex' }
  else { lieuWrap.style.display = 'none' }
  document.getElementById('modal-desc').textContent = e.description || 'Aucune description.'
  const inscrit = _inscrits.has(e.id)
  const btn = document.getElementById('modal-inscrire-btn')
  btn.textContent = inscrit ? '✅ Déjà inscrit' : "S'inscrire"
  btn.className = 'btn-inscrire' + (inscrit ? ' inscrit' : '')
  document.getElementById('modal-detail').classList.add('open')
  document.body.style.overflow = 'hidden'
}

function closeModal() {
  document.getElementById('modal-detail').classList.remove('open')
  document.body.style.overflow = ''
}

function inscrire(id, btn) {
  if (_inscrits.has(id)) return
  _inscrits.add(id)
  localStorage.setItem('cqp_inscriptions', JSON.stringify([..._inscrits]))
  if (btn) { btn.textContent = '✅ Inscrit'; btn.classList.add('inscrit') }
}

function inscrireModal() {
  if (_currentEvt) inscrire(_currentEvt.id, document.getElementById('modal-inscrire-btn'))
}

load()
</script>
</body>
</html>
