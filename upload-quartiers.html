async function uploadAll() {
  const results = {}
  for (const [name, b64] of Object.entries(imgs)) {
    try {
      const r = await fetch(FUNC, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({name, b64, mime: 'image/jpeg'})
      })
      const d = await r.json()
      results[name] = d.url || JSON.stringify(d)
      document.getElementById('log').innerHTML += '<br>' + name + ': ' + results[name]
    } catch(e) {
      results[name] = 'ERROR: ' + e.message
      document.getElementById('log').innerHTML += '<br>' + name + ': ERROR'
    }
  }
  document.getElementById('log').innerHTML += '<br><br>DONE: ' + JSON.stringify(results)
}

uploadAll()
