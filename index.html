<style>
/* ── PTR ── */
#ptr{display:none;justify-content:center;align-items:center;padding:12px;position:fixed;top:var(--nav);left:0;right:0;z-index:150;}
.ptr-dot{width:8px;height:8px;border-radius:50%;background:var(--rouge);animation:bounce .9s infinite;}
.ptr-dot:nth-child(2){animation-delay:.15s}.ptr-dot:nth-child(3){animation-delay:.3s}
/* ── TICKER ── */
.ticker{display:flex;align-items:center;gap:8px;padding:7px 14px;background:#fff;border-bottom:1px solid var(--border);overflow:hidden;position:sticky;top:var(--nav);z-index:99;}
.ticker-dot{width:6px;height:6px;border-radius:50%;background:var(--rouge);flex-shrink:0;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.ticker-track{flex:1;overflow:hidden;height:20px;position:relative;}
.ticker-inner{position:absolute;white-space:nowrap;animation:scroll-x 22s linear infinite;font-family:'Barlow Condensed',sans-serif;font-size:.78rem;letter-spacing:.5px;color:var(--txt2);}
@keyframes scroll-x{from{transform:translateX(100%)}to{transform:translateX(-100%)}}
/* ── COMPOSER ── */
.composer{background:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px;}
@media(min-width:600px){.composer{border-radius:var(--r);box-shadow:var(--shadow-card);}}
.c-name-wrap{flex:1;padding:10px 16px;background:var(--bg3);border:1.5px solid var(--border);border-radius:24px;font-size:.88rem;color:var(--txt2);cursor:pointer;}
/* ── PUB MENU ── */
.pub-overlay{display:none;position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.5);}
.pub-overlay.open{display:block;}
.pub-menu{position:fixed;bottom:0;left:0;right:0;z-index:401;background:#fff;border-radius:20px 20px 0 0;padding:16px;padding-bottom:max(20px,env(safe-area-inset-bottom));display:none;}
.pub-menu.open{display:block;}
.pub-menu-title{font-family:'Barlow Condensed',sans-serif;font-size:.65rem;letter-spacing:2px;text-transform:uppercase;color:var(--txt3);padding:0 4px 12px;}
.pub-options{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.pub-opt{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--bg3);border-radius:10px;border:none;cursor:pointer;font-family:'Barlow',sans-serif;text-align:left;transition:background .15s;}
.pub-opt:active{background:var(--bg);}
.pub-opt-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0;}
.pub-opt-label{font-weight:600;font-size:.88rem;color:var(--txt);}
.pub-opt-sub{font-size:.75rem;color:var(--txt3);}
/* ── SHEET COMMENTAIRES ── */
.sheet{display:none;position:fixed;bottom:0;left:0;right:0;z-index:500;background:#fff;border-radius:20px 20px 0 0;max-height:85vh;overflow:hidden;flex-direction:column;}
.sheet.open{display:flex;}
.sheet-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border);flex-shrink:0;}
.sheet-head h3{font-family:'Bebas Neue',sans-serif;font-size:1.2rem;flex:1;margin:0;}
.sheet-body{flex:1;overflow-y:auto;padding:12px 14px;}
.sheet-foot{padding:8px 8px 8px 10px;border-top:1px solid var(--border);display:flex;gap:8px;flex-shrink:0;align-items:center;padding-bottom:max(8px,env(safe-area-inset-bottom));}
/* ── STORY VIEWER ── */
#sv{display:none;position:fixed;inset:0;z-index:600;background:#000;flex-direction:column;}
#sv.open{display:flex;}
.sv-bars{display:flex;gap:4px;padding:env(safe-area-inset-top) 12px 0;padding-top:max(12px,env(safe-area-inset-top));}
.sv-bar{flex:1;height:2px;background:rgba(255,255,255,.3);border-radius:2px;overflow:hidden;}
.sv-bar-fill{height:100%;background:#fff;width:0%;}
.sv-header{display:flex;align-items:center;gap:10px;padding:10px 14px;}
.sv-body{flex:1;position:relative;}
.sv-nav{position:absolute;top:0;bottom:0;width:45%;}
.sv-nav-l{left:0;}
.sv-nav-r{right:0;}
/* ── DRAWERS CONTENU ── */
.post-form{display:none;position:fixed;inset:0;z-index:500;background:#fff;flex-direction:column;}
.post-form.open{display:flex;}
.post-form-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff;z-index:1;}
.post-form-body{flex:1;overflow-y:auto;padding:16px;}
.post-textarea{width:100%;min-height:120px;padding:12px;background:none;border:none;font-family:'Barlow',sans-serif;font-size:1rem;line-height:1.6;color:var(--txt);resize:none;outline:none;}
.photo-preview{width:100%;border-radius:10px;margin-top:8px;max-height:260px;object-fit:cover;display:none;}
.photo-bar{display:flex;align-items:center;gap:8px;padding:10px 16px;border-top:1px solid var(--border);position:sticky;bottom:0;background:#fff;}
.photo-bar-btn{width:40px;height:40px;background:var(--bg3);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.1rem;cursor:pointer;border:none;}
/* ── ACTU CARDS ── */
.actu-card{background:#fff;overflow:hidden;}
@media(min-width:600px){.actu-card{border-radius:var(--r);box-shadow:var(--shadow-card);}}
.actu-card:not(:last-child){border-bottom:1px solid var(--border);}
.actu-img{width:100%;height:200px;object-fit:cover;display:block;}
.actu-head{display:flex;align-items:center;gap:10px;padding:12px 14px 6px;}
.actu-meta{flex:1;}
.actu-title{font-family:'Barlow',sans-serif;font-weight:600;font-size:.94rem;line-height:1.35;}
.actu-text{font-size:.86rem;color:var(--txt2);line-height:1.65;padding:0 14px 8px;}
.card-read-more{margin:4px 14px 12px;padding:10px;background:var(--bg3);border:none;border-radius:7px;width:calc(100% - 28px);font-family:'Barlow Condensed',sans-serif;font-size:.76rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--txt2);cursor:pointer;}
/* ── EVT CARDS ── */
.evt-card{background:#fff;overflow:hidden;}
@media(min-width:600px){.evt-card{border-radius:var(--r);box-shadow:var(--shadow-card);}}
.evt-card:not(:last-child){border-bottom:1px solid var(--border);}
.evt-badge{font-family:'Barlow Condensed',sans-serif;font-size:.6rem;letter-spacing:1.5px;text-transform:uppercase;padding:3px 9px;border-radius:4px;color:#fff;background:var(--blue);}
.evt-footer{padding:10px 14px;border-top:1px solid var(--bg3);display:flex;align-items:center;gap:8px;}
.btn-inscrit{background:var(--green)!important;}
/* ── ANNONCE CARDS ── */
.an-card{background:#fff;overflow:hidden;}
@media(min-width:600px){.an-card{border-radius:var(--r);box-shadow:var(--shadow-card);}}
.an-card:not(:last-child){border-bottom:1px solid var(--border);}
</style>
</head>

<script>
'use strict'
const esc = s => Utils.esc(s)
const timeAgo = d => Utils.timeAgo(d)

// ── PUB MENU ──────────────────────────────────────────────────
function openPub() {
  if (!Auth.getCode()) { window.location.href = 'profil.html'; return }
  document.getElementById('pub-overlay').classList.add('open')
  document.getElementById('pub-menu').classList.add('open')
  document.body.style.overflow = 'hidden'
}
function closePub() {
  document.getElementById('pub-overlay').classList.remove('open')
  document.getElementById('pub-menu').classList.remove('open')
  document.body.style.overflow = ''
}

// ── POST FORM ─────────────────────────────────────────────────
let _postType = 'post'
function openPostForm(type) {
  closePub()
  _postType = type || 'post'
  const prenom = Auth.getPrenom()
  document.getElementById('pf-name').textContent = prenom || 'Anonyme'
  document.getElementById('pf-av').textContent = (prenom || '?')[0].toUpperCase()
  const ph = Auth.getPhoto()
  if (ph) { const av = document.getElementById('pf-av'); av.innerHTML = `<img src="${esc(ph)}" alt="" style="width:100%;height:100%;object-fit:cover;">`; av.classList.remove('c-av-init') }
  document.getElementById('pf-text').placeholder = type === 'story' ? 'Texte de ta story (optionnel)…' : 'Quoi de neuf dans le quartier ?'
  document.getElementById('post-form').classList.add('open')
  document.body.style.overflow = 'hidden'
  setTimeout(() => document.getElementById('pf-text').focus(), 100)
}
function closePostForm() {
  document.getElementById('post-form').classList.remove('open')
  document.body.style.overflow = ''
  document.getElementById('pf-text').value = ''
  document.getElementById('pf-preview').style.display = 'none'
  document.getElementById('pf-photo').value = ''
  document.getElementById('pf-msg').textContent = ''
}
function previewPhoto(inp) {
  const file = inp.files?.[0]
  if (!file) return
  const img = document.getElementById('pf-preview')
  img.src = URL.createObjectURL(file)
  img.style.display = 'block'
}
async function submitPost() {
  const code = Auth.getCode()
  const prenom = Auth.getPrenom()
  if (!code) { window.location.href = 'profil.html'; return }
  const text = document.getElementById('pf-text').value.trim()
  const file = document.getElementById('pf-photo').files?.[0]
  const msg = document.getElementById('pf-msg')
  if (!text && !file) { msg.textContent = 'Texte ou photo requis'; return }
  const btn = document.getElementById('pf-submit')
  btn.textContent = '…'; btn.disabled = true
  msg.textContent = ''
  try {
    let photo_url = null
    if (file) { msg.textContent = 'Upload en cours…'; photo_url = await Api.uploadPhoto(file, 'posts') }
    if (_postType === 'story') {
      if (!photo_url) throw new Error('Photo obligatoire pour une story')
      const { error } = await Api.createStory({ prenom, photo_url })
      if (error) throw error
      Utils.toast('Story publiée !', 'success')
    } else {
      const { data, error } = await Api.createPost({ prenom, contenu: text || null, photo_url })
      if (error) throw error
      if (data) Feed.prepend(data)
      Utils.toast('Post publié !', 'success')
    }
    closePostForm()
    if (_postType === 'story') Stories.load(document.getElementById('stories-bar'))
  } catch (e) {
    msg.textContent = 'Erreur : ' + e.message
  } finally {
    btn.textContent = 'Publier'; btn.disabled = false
  }
}

// ── COMMENTAIRES ─────────────────────────────────────────────
let _sheetPostId = null
let _sheetItemType = 'post'
async function openSheet(itemType, itemId) {
  _sheetPostId = itemId
  _sheetItemType = itemType || 'post' 
  const prenom = Auth.getPrenom()
  const av = document.getElementById('sheet-av')
  av.textContent = (prenom || '?')[0].toUpperCase()
  document.getElementById('sheet').classList.add('open')
  document.body.style.overflow = 'hidden'
  history.pushState({ sheet: true }, '')
  await refreshComments()
  setTimeout(() => document.getElementById('sheet-input').focus(), 200)
}
function closeSheet() {
  document.getElementById('sheet').classList.remove('open')
  document.body.style.overflow = ''
  _sheetPostId = null
}
window.addEventListener('popstate', e => {
  if (document.getElementById('sheet').classList.contains('open')) {
    closeSheet()
  }
})
async function refreshComments() {
  const body = document.getElementById('sheet-body')
  body.innerHTML = '<div class="spinner"><div class="spinner-dot"></div><div class="spinner-dot"></div><div class="spinner-dot"></div></div>'
  const { data } = await Api.getComments(_sheetItemType, _sheetPostId)
  if (!data?.length) { body.innerHTML = '<div class="empty">Aucun commentaire — soyez le premier !</div>'; return }
  body.innerHTML = data.map(c => `
    <div class="cmt-item">
      <div class="c-av c-av-28 c-av-init">${esc((c.prenom || '?')[0].toUpperCase())}</div>
      <div class="cmt-bubble">
        <span class="cmt-name">${esc(c.prenom || 'Anonyme')}</span>
        <span class="cmt-text">${esc(c.message || c.contenu || '')}</span>
        <span class="cmt-ts">${timeAgo(c.created_at)}</span>
      </div>
    </div>`).join('')
  body.scrollTop = body.scrollHeight
}
async function sendComment() {
  const prenom = Auth.getPrenom()
  const inp = document.getElementById('sheet-input')
  const message = inp.value.trim()
  if (!message || !_sheetPostId) return
  inp.value = ''
  // ⚠️ DB: champ "message" pas "contenu"
  const { error } = await Api.addComment({ itemType: _sheetItemType, itemId: _sheetPostId, message, prenom })
  if (error) { Utils.toast('Erreur envoi commentaire', 'error'); inp.value = message; return }
  await refreshComments()
  const cc = document.getElementById(`cc-${_sheetPostId}`)
  if (cc) cc.textContent = parseInt(cc.textContent || 0) + 1
  Utils.toast('Commentaire publié ✅')
}

// ── NOTIFICATIONS ─────────────────────────────────────────────
function openNotifs() { Utils.toast('Notifications bientôt disponibles', 'info') }

// ── TICKER ────────────────────────────────────────────────────
async function loadTicker() {
  const { data } = await Api.getActus(null, 5)
  if (!data?.length) return
  const ticker = document.getElementById('ticker')
  const inner = document.getElementById('ticker-inner')
  inner.textContent = data.map(a => `📣 ${a.titre}`).join('  ·  ')
  ticker.style.display = 'flex'
}

// ── INIT ──────────────────────────────────────────────────────
async function init() {
  const code = Auth.getCode()
  if (!code) { window.location.href = 'profil.html'; return }

  // Avatar topbar
  const prenom = Auth.getPrenom()
  const photo = Auth.getPhoto()
  const av = document.getElementById('c-av')
  if (photo) { av.innerHTML = `<img src="${esc(photo)}" alt="" style="width:100%;height:100%;object-fit:cover;">`; av.classList.remove('c-av-init') }
  else if (prenom) av.textContent = prenom[0].toUpperCase()

  // Feed en priorité
  Feed.init(document.getElementById('feed'))
  Feed.setupDoubleTap(document.getElementById('feed'))
  Feed.setupPullToRefresh()

  // Non-bloquant
  setTimeout(() => Stories.load(document.getElementById('stories-bar')), 300)
  setTimeout(() => loadTicker(), 600)

  // Profil en arrière-plan
  Api.getProfil(code).then(p => {
    if (!p) return
    Auth.save(p)
    if (p.is_admin) document.getElementById('admin-link').style.display = 'flex'
    if (p.photo_url) {
      const av2 = document.getElementById('c-av')
      av2.innerHTML = `<img src="${esc(p.photo_url)}" alt="" style="width:100%;height:100%;object-fit:cover;">`
      av2.classList.remove('c-av-init')
    }
  }).catch(() => {})

  Api.trackView('index')
}
init()
</script>
