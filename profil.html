<!DOCTYPE html>
<html lang="fr">
<head>

<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#C8102E">

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Profil — CQP Toulouse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }
body { background: #fff; font-family: -apple-system, system-ui, sans-serif; }
#avatar-file { display: none; }
.code-inputs{display:flex;gap:8px;justify-content:center;margin-bottom:18px;}
.code-digit{width:44px;height:54px;border:2px solid #e4e6eb;border-radius:10px;font-family:'Bebas Neue',sans-serif;font-size:1.8rem;text-align:center;color:#000;background:#f9f9f9;outline:none;}
.code-digit:focus{border-color:#C8102E;background:#fff;}

/* ── Onboarding Twitter style ── */
.onboarding-wrap {
  padding: 14px 0 14px 16px;
}
.onboarding-header {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 12px;
  padding-right: 16px;
}
.onboarding-title {
  font-size: 17px;
  font-weight: 800;
  color: #000;
  flex: 1;
}
.onboarding-counter {
  font-size: 13px;
  color: #536471;
  font-weight: 500;
}
.onboarding-scroll {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  padding-right: 16px;
  padding-bottom: 4px;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.onboarding-scroll::-webkit-scrollbar { display: none; }

.ob-card {
  flex-shrink: 0;
  width: 168px;
  border-radius: 16px;
  padding: 18px 16px 16px;
  cursor: pointer;
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 160px;
  transition: transform .15s ease, opacity .15s;
  -webkit-tap-highlight-color: transparent;
}
.ob-card:active { transform: scale(.97); opacity: .9; }

.ob-card-icon {
  font-size: 32px;
  margin-bottom: 10px;
  line-height: 1;
}
.ob-card-label {
  font-size: 14px;
  font-weight: 700;
  color: #fff;
  line-height: 1.3;
  flex: 1;
}
.ob-card-arrow {
  margin-top: 12px;
  width: 32px;
  height: 32px;
  background: rgba(255,255,255,0.25);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  align-self: flex-end;
}
.ob-card-arrow svg { stroke: #fff; }

.ob-grad-0 { background: linear-gradient(135deg, #1a8cff 0%, #0052cc 100%); }
.ob-grad-1 { background: linear-gradient(135deg, #f7971e 0%, #e05d00 100%); }
.ob-grad-2 { background: linear-gradient(135deg, #a855f7 0%, #7c3aed 100%); }
.ob-grad-3 { background: linear-gradient(135deg, #10b981 0%, #047857 100%); }
.ob-grad-4 { background: linear-gradient(135deg, #f43f5e 0%, #be123c 100%); }
.ob-grad-5 { background: linear-gradient(135deg, #f59e0b 0%, #b45309 100%); }
</style>
<style>
.topbar, [class*="topbar"], header { padding-top: env(safe-area-inset-top) !important; }
body { padding-top: env(safe-area-inset-top); }
</style>
</head>
<body>

<!-- VUE WELCOME -->
<div id="view-welcome" style="display:none;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:40px 24px;background:#fff;">
  <div style="font-family:'Bebas Neue',sans-serif;font-size:2.5rem;color:#C8102E;letter-spacing:2px;margin-bottom:8px;">CQP</div>
  <div style="font-size:14px;color:#65676b;margin-bottom:48px;text-align:center;">Le réseau des quartiers populaires de Toulouse</div>
  <div style="width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px;">
    <button onclick="goConnect('signup')" style="width:100%;background:#C8102E;border:none;border-radius:12px;color:#fff;font-size:1rem;font-weight:600;padding:16px;cursor:pointer;">Rejoindre le réseau →</button>
    <button onclick="goConnect('login')" style="width:100%;background:none;border:1.5px solid #e4e6eb;border-radius:12px;color:#333;font-size:.95rem;font-weight:500;padding:14px;cursor:pointer;">J'ai déjà un identifiant</button>
    <button onclick="window.location.href='index.html'" style="background:none;border:none;color:#999;font-size:.85rem;padding:8px;cursor:pointer;">Juste regarder →</button>
  </div>
</div>

<!-- VUE CONNEXION -->
<div id="view-connect" style="display:none;min-height:100vh;background:#fff;">
  <div style="padding:24px 16px;">
    <button onclick="goWelcome()" style="background:none;border:none;cursor:pointer;margin-bottom:20px;">
      <svg viewBox="0 0 24 24" width="22" stroke="#000" fill="none" stroke-width="2" stroke-linecap="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </button>
    <div id="panel-login" style="display:none;">
      <h2 style="font-size:22px;font-weight:700;margin-bottom:6px;">Mon code d'accès</h2>
      <p style="font-size:14px;color:#65676b;margin-bottom:24px;">Entre ton code à 6 chiffres</p>
      <div class="code-inputs" id="login-inputs"></div>
      <button id="login-btn" onclick="doLogin()" disabled style="width:100%;background:#C8102E;color:#fff;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;opacity:.4;">Accéder à mon profil</button>
      <div id="login-msg" style="margin-top:12px;text-align:center;font-size:13px;color:#C8102E;min-height:18px;"></div>
    </div>
    <div id="panel-signup" style="display:none;">
      <h2 style="font-size:22px;font-weight:700;margin-bottom:6px;">Rejoindre CQP</h2>
      <p style="font-size:14px;color:#65676b;margin-bottom:24px;">Choisis un prénom et un quartier</p>
      <input id="s-prenom" placeholder="Ton prénom" style="width:100%;border:1.5px solid #e4e6eb;border-radius:10px;padding:12px;font-size:15px;margin-bottom:12px;">
      <select id="s-quartier" style="width:100%;border:1.5px solid #e4e6eb;border-radius:10px;padding:12px;font-size:15px;margin-bottom:20px;background:#fff;">
        <option value="">Choisir un quartier</option>
        <option>Bagatelle</option><option>Bellefontaine</option><option>Reynerie</option>
        <option>Mirail</option><option>Faourette</option><option>Papus</option>
        <option>Bordelongue</option><option>Empalot</option><option>Autre</option>
      </select>
      <button id="signup-btn" onclick="doSignup()" style="width:100%;background:#C8102E;color:#fff;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;">Créer mon profil</button>
      <div id="signup-msg" style="margin-top:12px;text-align:center;font-size:13px;color:#C8102E;min-height:18px;"></div>
    </div>
  </div>
</div>

<!-- VUE PROFIL -->
<div id="view-profil" style="display:none;background:#fff;min-height:100vh;padding-bottom:80px;">

  <div style="padding:20px 16px 0;">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;">
      <div style="flex:1;">
        <div style="font-size:24px;font-weight:700;color:#000;line-height:1.2;" id="p-name">…</div>
        <div style="font-size:14px;color:#65676b;margin-top:2px;" id="p-quartier"></div>
      </div>
      <label for="avatar-file" style="cursor:pointer;flex-shrink:0;margin-left:12px;">
        <div style="width:72px;height:72px;border-radius:50%;background:#e4e6eb;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;color:#65676b;" id="profil-av">?</div>
      </label>
      <input type="file" id="avatar-file" accept="image/*" onchange="uploadAvatar(this)">
    </div>
    <div id="p-bio" style="font-size:14px;color:#000;line-height:1.5;margin-bottom:14px;"></div>
    <div style="display:flex;gap:24px;margin-bottom:16px;">
      <div><div style="font-size:18px;font-weight:700;color:#000;" id="p-stat-posts">0</div><div style="font-size:12px;color:#65676b;">Posts</div></div>
      <div><div style="font-size:18px;font-weight:700;color:#000;" id="p-stat-likes">0</div><div style="font-size:12px;color:#65676b;">J'aimes</div></div>
      <div><div style="font-size:18px;font-weight:700;color:#000;" id="p-stat-comments">0</div><div style="font-size:12px;color:#65676b;">Commentaires</div></div>
    </div>
    <button onclick="openEdit()" style="width:100%;border:1.5px solid #e4e6eb;background:#fff;border-radius:10px;padding:10px;font-size:14px;font-weight:600;color:#000;cursor:pointer;margin-bottom:20px;">Modifier le profil</button>
  </div>

  <div style="height:1px;background:#e4e6eb;"></div>

  <!-- ONBOARDING Twitter style -->
  <div id="onboarding-section"></div>

  <div style="height:8px;background:#f0f2f5;"></div>

  <div id="my-posts-section" style="padding-top:4px;">
    <div style="padding:14px 16px 10px;font-size:14px;font-weight:700;color:#000;">Mes publications</div>
    <div id="my-posts-list"></div>
  </div>

  <div style="padding:24px 16px 40px;text-align:center;">
    <button onclick="doLogout()" style="background:none;border:1.5px solid #e4e6eb;border-radius:10px;padding:10px 24px;font-size:14px;color:#65676b;cursor:pointer;">Se déconnecter</button>
  </div>
</div>

<!-- PANEL MODIFIER PROFIL -->
<div id="edit-panel" style="display:none;position:fixed;inset:0;z-index:9999;background:#fff;overflow-y:auto;">
  <div style="display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid #e4e6eb;position:sticky;top:0;background:#fff;z-index:1;">
    <button onclick="closeEdit()" style="background:none;border:none;cursor:pointer;margin-right:12px;">
      <svg viewBox="0 0 24 24" width="22" stroke="#000" fill="none" stroke-width="2" stroke-linecap="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </button>
    <span style="font-size:17px;font-weight:700;">Modifier le profil</span>
  </div>
  <div style="padding:20px 16px;display:flex;flex-direction:column;gap:16px;">
    <div><label style="font-size:13px;font-weight:600;color:#65676b;display:block;margin-bottom:6px;">Prénom</label>
    <input id="e-prenom" style="width:100%;border:1.5px solid #e4e6eb;border-radius:10px;padding:12px;font-size:15px;" placeholder="Ton prénom"></div>
    <div><label style="font-size:13px;font-weight:600;color:#65676b;display:block;margin-bottom:6px;">Quartier</label>
    <select id="e-quartier" style="width:100%;border:1.5px solid #e4e6eb;border-radius:10px;padding:12px;font-size:15px;background:#fff;">
      <option value="">Choisir</option>
      <option>Bagatelle</option><option>Bellefontaine</option><option>Reynerie</option>
      <option>Mirail</option><option>Faourette</option><option>Papus</option>
      <option>Bordelongue</option><option>Empalot</option><option>Autre</option>
    </select></div>
    <div><label style="font-size:13px;font-weight:600;color:#65676b;display:block;margin-bottom:6px;">Bio</label>
    <textarea id="e-bio" style="width:100%;border:1.5px solid #e4e6eb;border-radius:10px;padding:12px;font-size:15px;min-height:80px;resize:none;" placeholder="Parle de toi..."></textarea></div>
    <div id="edit-msg" style="font-size:13px;text-align:center;min-height:16px;color:#C8102E;"></div>
    <button onclick="saveProfil()" style="width:100%;background:#000;color:#fff;border:none;border-radius:10px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;">Enregistrer</button>
  </div>
</div>

<script>
const esc = s => Utils.esc(s)

function showView(id) {
  ['view-welcome','view-connect','view-profil'].forEach(v => {
    const el = document.getElementById(v)
    if (el) el.style.display = v === id ? (id === 'view-welcome' ? 'flex' : 'block') : 'none'
  })
}

function goWelcome() { showView('view-welcome') }
function goConnect(panel) {
  showView('view-connect')
  document.getElementById('panel-login').style.display = panel === 'login' ? 'block' : 'none'
  document.getElementById('panel-signup').style.display = panel === 'signup' ? 'block' : 'none'
  if (panel === 'login') buildCodeInputs()
}

function buildCodeInputs() {
  const wrap = document.getElementById('login-inputs')
  if (wrap.children.length) return
  for (let i = 0; i < 6; i++) {
    const inp = document.createElement('input')
    inp.className = 'code-digit'
    inp.maxLength = 1
    inp.inputMode = 'numeric'
    inp.addEventListener('input', () => {
      if (inp.value && inp.nextElementSibling) inp.nextElementSibling.focus()
      checkLoginReady()
    })
    inp.addEventListener('keydown', e => {
      if (e.key === 'Backspace' && !inp.value && inp.previousElementSibling) inp.previousElementSibling.focus()
    })
    wrap.appendChild(inp)
  }
}

function checkLoginReady() {
  const code = [...document.querySelectorAll('.code-digit')].map(i => i.value).join('')
  const btn = document.getElementById('login-btn')
  btn.disabled = code.length < 6
  btn.style.opacity = code.length < 6 ? '0.4' : '1'
}

async function doLogin() {
  const code = [...document.querySelectorAll('.code-digit')].map(i => i.value).join('')
  if (code.length < 6) return
  const btn = document.getElementById('login-btn')
  const msg = document.getElementById('login-msg')
  btn.textContent = '…'; btn.disabled = true
  const p = await Api.getProfil(code)
  if (!p) { msg.textContent = 'Code invalide'; btn.textContent = 'Accéder'; btn.disabled = false; return }
  Auth.save(p)
  window.location.reload()
}

async function doSignup() {
  const prenom = document.getElementById('s-prenom').value.trim()
  const quartier = document.getElementById('s-quartier').value
  const msg = document.getElementById('signup-msg')
  if (!prenom) { msg.textContent = 'Prénom obligatoire'; return }
  const btn = document.getElementById('signup-btn')
  btn.textContent = '…'; btn.disabled = true
  try {
    const profil = await Api.createProfil({ prenom, quartier: quartier || null })
    Auth.save(profil)
    showCodePopup(profil.code)
  } catch(e) { msg.textContent = 'Erreur: ' + e.message; btn.textContent = 'Créer'; btn.disabled = false }
}

function showCodePopup(code) {
  const html = '<div style="position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;">'
    + '<div style="background:#fff;border-radius:16px;padding:28px 24px;width:100%;max-width:320px;text-align:center;">'
    + '<div style="font-size:40px;margin-bottom:12px;">🎉</div>'
    + '<h3 style="font-size:20px;font-weight:700;margin-bottom:8px;">Bienvenue !</h3>'
    + '<p style="font-size:14px;color:#65676b;margin-bottom:20px;">Note ton code — il te permettra de te connecter depuis n\'importe quel appareil</p>'
    + '<div style="font-family:monospace;font-size:32px;font-weight:700;letter-spacing:8px;color:#C8102E;background:#fff0f2;border-radius:10px;padding:16px;margin-bottom:20px;">' + esc(code) + '</div>'
    + '<button onclick="this.parentElement.parentElement.remove();window.location.reload()" style="width:100%;background:#000;color:#fff;border:none;border-radius:10px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;">C\'est parti !</button>'
    + '</div></div>'
  document.body.insertAdjacentHTML('beforeend', html)
}

function doLogout() {
  Auth.clear ? Auth.clear() : localStorage.clear()
  window.location.reload()
}

function renderProfil(p) {
  const set = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = val }
  set('p-name', p.prenom || 'Anonyme')
  set('p-quartier', p.quartier || '')
  set('p-bio', p.bio || '')
  if (document.getElementById('e-prenom')) document.getElementById('e-prenom').value = p.prenom || ''
  if (document.getElementById('e-quartier')) document.getElementById('e-quartier').value = p.quartier || ''
  if (document.getElementById('e-bio')) document.getElementById('e-bio').value = p.bio || ''
  const av = document.getElementById('profil-av')
  if (av) {
    if (p.photo_url) av.innerHTML = '<img src="' + esc(p.photo_url) + '" style="width:100%;height:100%;object-fit:cover;">'
    else av.textContent = (p.prenom || '?')[0].toUpperCase()
  }
  loadProfilData(p)
}

async function loadProfilData(p) {
  const code = Auth.getCode()
  if (!code) return
  try {
    const { data: posts } = await sb.from('posts').select('id').eq('profil_code', code).eq('visible', true)
    const ids = (posts || []).map(x => x.id)
    document.getElementById('p-stat-posts').textContent = ids.length
    if (ids.length) {
      const [lRes, cRes] = await Promise.all([
        sb.from('likes').select('id', {count:'exact',head:true}).eq('item_type','post').in('item_id', ids),
        sb.from('commentaires').select('id', {count:'exact',head:true}).eq('item_type','post').eq('visible',true).in('item_id', ids)
      ])
      document.getElementById('p-stat-likes').textContent = lRes.count || 0
      document.getElementById('p-stat-comments').textContent = cRes.count || 0
    }
    renderOnboarding(ids.length, p)
    const { data: myPosts } = await sb.from('posts').select('*').eq('profil_code', code).eq('visible', true).order('created_at', {ascending:false}).limit(20)
    renderMyPosts(myPosts || [], ids)
  } catch(e) { console.warn(e) }
}

function renderOnboarding(postCount, p) {
  const allSteps = [
    { icon: '📸', label: 'Ajoute une photo de profil', action: "document.getElementById('avatar-file').click()", done: !!p.photo_url },
    { icon: '✍️', label: 'Écris ta bio', action: 'openEdit()', done: !!p.bio },
    { icon: '💬', label: 'Publie ton premier post', action: "window.location.href='index.html'", done: postCount > 0 },
    { icon: '📸', label: 'Crée ta première story', action: "window.location.href='index.html'", done: false },
    { icon: '📋', label: 'Dépose une annonce', action: "window.location.href='annonces2.html'", done: false },
    { icon: '📅', label: 'Organise un événement', action: "window.location.href='evenements.html'", done: false },
  ]
  const todo = allSteps.filter(s => !s.done)
  const section = document.getElementById('onboarding-section')
  if (!todo.length) { section.style.display = 'none'; return }
  const remaining = todo.length
  const cards = todo.map((s, i) =>
    '<div class="ob-card ob-grad-' + i + '" onclick="' + s.action + '">'
    + '<div class="ob-card-icon">' + s.icon + '</div>'
    + '<div class="ob-card-label">' + s.label + '</div>'
    + '<div class="ob-card-arrow"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></div>'
    + '</div>'
  ).join('')
  section.innerHTML =
    '<div class="onboarding-wrap">'
    + '<div class="onboarding-header">'
    + '<div class="onboarding-title">Découvre le réseau</div>'
    + '<div class="onboarding-counter">' + remaining + ' restant' + (remaining > 1 ? 's' : '') + '</div>'
    + '</div>'
    + '<div class="onboarding-scroll">' + cards + '</div>'
    + '</div>'
}

function renderMyPosts(posts, allIds) {
  const el = document.getElementById('my-posts-list')
  if (!posts.length) {
    el.innerHTML = '<div style="padding:32px 16px;text-align:center;color:#65676b;font-size:14px;">Aucune publication</div>'
    return
  }
  el.innerHTML = posts.map(p => {
    const img = p.photo_url
      ? '<div style="border-radius:16px;overflow:hidden;border:0.5px solid #e4e6eb;cursor:pointer;" onclick="openMedia(\'' + esc(p.photo_url) + '\',\'image\')"><img src="' + esc(p.photo_url) + '?width=800&quality=70" loading="lazy" style="width:100%;height:auto;display:block;filter:brightness(1.06) saturate(1.2) contrast(1.05);"></div>'
      : p.video_url
      ? '<div style="border-radius:16px;overflow:hidden;border:0.5px solid #e4e6eb;cursor:pointer;" onclick="openMedia(\'' + esc(p.video_url) + '\',\'video\')"><video src="' + esc(p.video_url) + '" autoplay muted loop playsinline style="width:100%;height:auto;display:block;max-height:350px;object-fit:cover;filter:brightness(1.06) saturate(1.2) contrast(1.05);" onended="this.currentTime=0;this.play()"></video></div>'
      : ''
    const textCard = !p.photo_url && !p.video_url && p.contenu
      ? '<div style="border-radius:16px;padding:20px;background:#1c1e21;"><p style="font-size:18px;font-weight:700;color:#fff;line-height:1.4;">' + esc(p.contenu) + '</p></div>'
      : ''
    return '<div style="padding:12px 16px;border-bottom:1px solid #f0f2f5;">'
      + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">'
      + '<span style="font-size:12px;color:#65676b;">' + Utils.timeAgo(p.created_at) + '</span>'
      + '<span style="font-size:11px;color:#C8102E;font-weight:600;">' + esc(p.quartier || '') + '</span>'
      + '</div>'
      + (p.contenu && (p.photo_url || p.video_url) ? '<p style="font-size:15px;color:#000;font-weight:500;margin-bottom:8px;line-height:1.5;">' + esc(p.contenu) + '</p>' : '')
      + (img || textCard)
      + '<div style="display:flex;gap:0;margin-top:10px;align-items:center;max-width:220px;">'
      + '<button style="background:none;border:none;padding:8px;cursor:pointer;display:flex;align-items:center;gap:5px;"><svg viewBox="0 0 24 24" width="22" height="22" stroke="#65676b" fill="none" stroke-width="2" stroke-linecap="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg><span id="plc-' + p.id + '" style="font-size:13px;color:#65676b;"></span></button>'
      + '<button style="background:none;border:none;padding:8px;cursor:pointer;display:flex;align-items:center;gap:5px;"><svg viewBox="0 0 24 24" width="22" height="22" stroke="#65676b" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg><span id="pcc-' + p.id + '" style="font-size:13px;color:#65676b;"></span></button>'
      + '</div>'
      + '</div>'
  }).join('')
  setTimeout(async () => {
    for (const post of posts) {
      const [lRes, cRes] = await Promise.all([
        sb.from('likes').select('id', {count:'exact',head:true}).eq('item_type','post').eq('item_id', post.id),
        sb.from('commentaires').select('id', {count:'exact',head:true}).eq('item_type','post').eq('item_id', post.id).eq('visible', true)
      ])
      const lEl = document.getElementById('plc-' + post.id)
      const cEl = document.getElementById('pcc-' + post.id)
      if (lEl && lRes.count) lEl.textContent = lRes.count
      if (cEl && cRes.count) cEl.textContent = cRes.count
    }
  }, 200)
}

function openEdit() { document.getElementById('edit-panel').style.display = 'block' }
function closeEdit() { document.getElementById('edit-panel').style.display = 'none' }

async function saveProfil() {
  const code = Auth.getCode()
  if (!code) return
  const prenom = document.getElementById('e-prenom').value.trim()
  const quartier = document.getElementById('e-quartier').value
  const bio = document.getElementById('e-bio').value.trim()
  const msg = document.getElementById('edit-msg')
  if (!prenom) { msg.textContent = 'Prenom obligatoire'; return }
  const { error } = await Api.updateProfil(code, { prenom, quartier: quartier || null, bio: bio || null })
  if (error) { msg.textContent = 'Erreur'; return }
  Auth.save({ code, prenom, photo_url: Auth.getPhoto() })
  document.getElementById('p-name').textContent = prenom
  document.getElementById('p-quartier').textContent = quartier || ''
  document.getElementById('p-bio').textContent = bio || ''
  msg.style.color = 'green'; msg.textContent = 'Mis a jour !'
  setTimeout(() => { msg.textContent = ''; closeEdit() }, 1500)
}

async function uploadAvatar(inp) {
  const file = inp.files && inp.files[0]
  if (!file) return
  const code = Auth.getCode()
  if (!code) return
  try {
    const url = await Api.uploadPhoto(file, 'avatars')
    await Api.updateProfil(code, { photo_url: url })
    Auth.save({ code, prenom: Auth.getPrenom(), photo_url: url })
    document.getElementById('profil-av').innerHTML = '<img src="' + esc(url) + '" style="width:100%;height:100%;object-fit:cover;">'
    Utils.toast('Photo mise a jour !', 'success')
  } catch(e) { Utils.toast('Erreur upload', 'error') }
}

function openMedia(url, type) {
  const existing = document.getElementById('media-viewer')
  if (existing) existing.remove()
  const viewer = document.createElement('div')
  viewer.id = 'media-viewer'
  viewer.style.cssText = 'position:fixed;inset:0;z-index:9999;background:#000;display:flex;align-items:center;justify-content:center;'
  let el
  if (type === 'video') {
    el = document.createElement('video')
    el.src = url; el.autoplay = true; el.controls = false; el.loop = true
    el.setAttribute('playsinline','')
    el.style.cssText = 'max-width:100%;max-height:100%;border-radius:10px;'
  } else {
    el = document.createElement('img')
    el.src = url
    el.style.cssText = 'max-width:100%;max-height:100%;object-fit:contain;border-radius:10px;'
  }
  viewer.appendChild(el)
  viewer.addEventListener('click', () => viewer.remove())
  document.body.appendChild(viewer)
}

async function init() {
  const code = Auth.getCode()
  if (!code) { showView('view-welcome'); return }
  showView('view-profil')
  renderProfil({ code, prenom: Auth.getPrenom(), quartier: '', bio: '', photo_url: Auth.getPhoto() })
  try {
    const p = await Api.getProfil(code)
    if (p) { Auth.save(p); renderProfil(p) }
  } catch(e) { console.warn(e) }
}

init()
</script>
