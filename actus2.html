<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Actualités Quartiers Populaires Toulouse — Mirail, Bellefontaine, Empalot</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="/css/main.css">
<script src="/js/app.js?v=9490"></script>
<script src="/js/utils.js?v=9490"></script>
<script src="/js/auth.js?v=9490"></script>
<script src="/js/api.js?v=9490"></script>
<style>
.actu-card{background:#fff;overflow:hidden;margin-bottom:8px;}
@media(min-width:600px){.actu-card{border-radius:var(--r);box-shadow:var(--shadow-card);}}
.actu-img{width:100%;height:200px;object-fit:cover;display:block;}
.actu-head{display:flex;align-items:center;gap:10px;padding:12px 14px 4px;}
.actu-title{font-family:'Barlow Condensed',sans-serif;font-size:1.1rem;font-weight:700;padding:4px 14px 6px;line-height:1.3;}
.actu-excerpt{font-size:.82rem;color:var(--txt2);padding:0 14px 6px;line-height:1.5;}
.card-read-more{display:block;margin:0 14px 14px;font-size:.8rem;font-weight:600;color:var(--rouge);background:none;border:none;padding:0;cursor:pointer;font-family:'Barlow',sans-serif;text-align:left;}
.cat-btn{background:var(--bg3);border:none;border-radius:20px;padding:6px 14px;font-size:.78rem;font-family:'Barlow',sans-serif;font-weight:600;cursor:pointer;color:var(--txt2);}
.cat-btn.active{background:var(--rouge);color:#fff;}
.cats{display:flex;gap:8px;padding:10px 14px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.cats::-webkit-scrollbar{display:none;}
</style>
</head>
<body>
<header class="topbar">
  <a href="index.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;">
    <div class="logo-box">CQP</div>
    <div class="logo-text"><div class="logo-city">TOULOUSE</div><div class="logo-sub">QUARTIERS POPULAIRES</div></div>
  </a>
</header>

<div style="padding-top:56px">
  <div style="background:#fff;padding:12px 14px 0;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);">
    <div style="display:flex;align-items:center;gap:8px;">
      <a href="javascript:history.back()" style="background:none;border:none;cursor:pointer;color:var(--txt2);font-size:1.2rem;text-decoration:none;">&#8592;</a>
      <span style="font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:1px;">ACTUS</span>
    </div>
  </div>

  <div class="cats" id="cats">
    <button class="cat-btn active" onclick="filterCat(this,'')">Tout</button>
    <button class="cat-btn" onclick="filterCat(this,'Quartier')">Quartier</button>
    <button class="cat-btn" onclick="filterCat(this,'Politique')">Politique</button>
    <button class="cat-btn" onclick="filterCat(this,'Culture')">Culture</button>
    <button class="cat-btn" onclick="filterCat(this,'Social')">Social</button>
    <button class="cat-btn" onclick="filterCat(this,'Sport')">Sport</button>
    <button class="cat-btn" onclick="filterCat(this,'Logement')">Logement</button>
    <button class="cat-btn" onclick="filterCat(this,'Securite')">Sécurité</button>
  </div>

  <div id="actu-list" style="padding:4px 0;"></div>
</div>

<!-- Modal article -->
<div id="dr" style="display:none;position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.5);overflow-y:auto;">
  <div style="background:#fff;min-height:100%;max-width:600px;margin:0 auto;padding:20px 16px 40px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
      <span id="dr-cat" style="background:var(--rouge);color:#fff;font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:20px;letter-spacing:.5px;"></span>
      <button onclick="closeDr()" style="background:none;border:none;font-size:1.4rem;cursor:pointer;color:var(--txt2);">✕</button>
    </div>
    <img id="dr-img" style="width:100%;max-height:250px;object-fit:cover;border-radius:8px;margin-bottom:12px;display:none;" alt="">
    <div id="dr-titre" style="font-family:'Barlow Condensed',sans-serif;font-size:1.4rem;font-weight:700;margin-bottom:6px;line-height:1.3;"></div>
    <div id="dr-date" style="font-size:.75rem;color:var(--txt3);margin-bottom:16px;"></div>
    <div id="dr-body" style="font-size:.9rem;line-height:1.8;color:var(--txt);white-space:pre-wrap;"></div>
  </div>
</div>

<nav class="bottom-nav">
  <a class="nav-item" href="index.html"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Accueil</a>
  <a class="nav-item" href="groupes.html"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Groupes</a>
  <a class="nav-item" href="annonces2.html"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>Annonces</a>
  <a class="nav-pub" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></a>
  <a class="nav-item" href="evenements.html"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Agenda</a>
  <a class="nav-item active" href="actus2.html"><svg viewBox="0 0 24 24"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>Actus</a>
  <a class="nav-item" href="profil.html"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Profil</a>
</nav>

<script>
var _all = [];

function safeEsc(s) {
  if (!s) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function safeDateFr(d) {
  try {
    return new Date(d).toLocaleDateString('fr-FR', {day:'2-digit', month:'long', year:'numeric'});
  } catch(e) { return ''; }
}

function timeAgoFr(d) {
  try {
    var diff = Date.now() - new Date(d).getTime();
    var h = Math.floor(diff / 3600000);
    if (h < 1) return 'A l instant';
    if (h < 24) return 'Il y a ' + h + 'h';
    var days = Math.floor(h / 24);
    if (days < 7) return 'Il y a ' + days + 'j';
    return safeDateFr(d);
  } catch(e) { return ''; }
}

function filterCat(btn, cat) {
  document.querySelectorAll('.cat-btn').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  var filtered = cat ? _all.filter(function(a) { return a.categorie === cat || (cat === 'Securite' && a.categorie === 'Sécurité'); }) : _all;
  render(filtered);
}

function render(actus) {
  var el = document.getElementById('actu-list');
  if (!actus || !actus.length) {
    el.innerHTML = '<div class="empty" style="text-align:center;padding:48px 20px"><div style="font-size:2.5rem;margin-bottom:12px">📰</div><div style="font-weight:700;font-size:1rem;margin-bottom:8px">Pas encore d\'actus</div><div style="color:var(--txt3);font-size:.85rem;">Contactez l\'admin !</div></div>';
    return;
  }
  var html = '';
  for (var i = 0; i < actus.length; i++) {
    var a = actus[i];
    var cover = a.photo_url
      ? '<img class="actu-img" src="' + safeEsc(a.photo_url) + '" loading="lazy" alt="">'
      : '<div class="card-cover cv-rouge"><div class="card-cover-cat">' + safeEsc(a.categorie || 'Actualite') + '</div><div class="card-cover-title">' + safeEsc(a.titre) + '</div></div>';
    var excerpt = safeEsc((a.contenu || '').substring(0, 200)) + ((a.contenu || '').length > 200 ? '...' : '');
    html += '<div class="actu-card">'
      + cover
      + '<div class="actu-head">'
      + '<div class="c-av c-av-36 c-av-init" style="background:var(--rouge);">CQP</div>'
      + '<div style="flex:1"><div style="font-weight:600;font-size:.88rem;">CQP Toulouse</div>'
      + '<div style="font-size:.72rem;color:var(--txt3);">' + timeAgoFr(a.date_publication) + '</div></div>'
      + '<span class="badge badge-rouge">' + safeEsc(a.categorie || 'Actu') + '</span>'
      + '</div>'
      + '<div class="actu-title">' + safeEsc(a.titre) + '</div>'
      + '<div class="actu-excerpt">' + excerpt + '</div>'
      + '<button class="card-read-more" onclick="openActu(' + a.id + ')">Lire la suite &rarr;</button>'
      + '</div>';
  }
  el.innerHTML = html;
}

function openActu(id) {
  var a = null;
  for (var i = 0; i < _all.length; i++) { if (_all[i].id === id) { a = _all[i]; break; } }
  if (!a) return;
  document.getElementById('dr-cat').textContent = a.categorie || 'Actualite';
  document.getElementById('dr-titre').textContent = a.titre;
  document.getElementById('dr-date').textContent = safeDateFr(a.date_publication);
  document.getElementById('dr-body').textContent = a.contenu || '';
  var img = document.getElementById('dr-img');
  if (a.photo_url) { img.src = a.photo_url; img.style.display = 'block'; } else { img.style.display = 'none'; }
  var dr = document.getElementById('dr');
  dr.style.display = 'block';
  dr.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeDr() {
  var dr = document.getElementById('dr');
  dr.classList.remove('open');
  dr.style.display = 'none';
  document.body.style.overflow = '';
}

async function load() {
  var el = document.getElementById('actu-list');
  el.innerHTML = '<div class="spinner"><div class="spinner-dot"></div><div class="spinner-dot"></div><div class="spinner-dot"></div></div>';
  var result = await Api.getActus(null, 50);
  if (result.error || !result.data || !result.data.length) {
    el.innerHTML = '<div class="empty" style="text-align:center;padding:48px 20px"><div style="font-size:2.5rem">📰</div><div style="font-weight:700;margin:8px 0;">Pas encore d\'actus</div><div style="color:var(--txt3);font-size:.85rem;">Revenez bientot !</div></div>';
    return;
  }
  _all = result.data;
  render(_all);
}

load();
if (typeof Api !== 'undefined' && Api.trackView) Api.trackView('actus');
// Deep link
setTimeout(function(){ var h=location.hash.replace('#act-',''); if(h&&!isNaN(h)) openActu(parseInt(h)); }, 600);
</script>
</body>
</html>
